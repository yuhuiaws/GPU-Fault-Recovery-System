                    --nnodes=1 \
                    --nproc-per-node=8 \
                    /opt/q118/train.py
              volumeMounts:
                - name: script
                  mountPath: /opt/q118
                  readOnly: true
                - name: dshm
                  mountPath: /dev/shm
              resources:
                requests:
                  cpu: "32"
                  memory: 128Gi
                  nvidia.com/gpu: "8"
                limits:
                  cpu: "64"
                  memory: 256Gi
                  nvidia.com/gpu: "8"
