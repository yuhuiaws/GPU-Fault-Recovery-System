# E2E FIXTURE: driven by scripts/e2e/, not a supported deployment entry point.
# Resource profile assumes p5en-class nodes with 8 GPUs per Pod; it requests no EFA.
apiVersion: kubeflow.org/v1
kind: PyTorchJob
metadata:
  name: gpu-fault-q118-log-snapshot
  namespace: gpu-fault-system
  labels:
    gpu-fault.io/managed: "true"
    gpu-fault.io/job-id: q118-log-snapshot-20260813
    gpu-fault.io/attempt-id: q118-log-snapshot-20260813-a001
spec:
  runPolicy:
    cleanPodPolicy: None
  pytorchReplicaSpecs:
    Master:
      replicas: 1
      restartPolicy: Never
      template:
        metadata:
          labels:
            app: gpu-fault-q118-log-snapshot
            gpu-fault.io/managed: "true"
            gpu-fault.io/job-id: q118-log-snapshot-20260813
            gpu-fault.io/attempt-id: q118-log-snapshot-20260813-a001
            gpu-fault.io/role: master
            gpu-fault.io/critical: "true"
          annotations:
            gpu-fault.io/expected-critical-ranks: "1"
            gpu-fault.io/training-container: pytorch
            gpu-fault.io/runtime-profile-version: hyperpod-v1
            gpu-fault.io/rank-offset: "0"
            gpu-fault.io/restart-budget: "0"
        spec:
          restartPolicy: Never
          volumes:
            - name: script
              configMap:
                name: gpu-fault-q118-gpu-script
            - name: dshm
              emptyDir:
                medium: Memory
                sizeLimit: 16Gi
          containers:
            - name: pytorch
