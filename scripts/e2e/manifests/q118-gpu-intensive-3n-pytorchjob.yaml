# E2E FIXTURE: driven by scripts/e2e/, not a supported deployment entry point.
# Resource profile assumes p5en-class nodes with 8 GPUs and 16 EFA devices per Pod.
apiVersion: v1
kind: ConfigMap
metadata:
  name: gpu-fault-q118-gpu-script
  namespace: gpu-fault-system
data:
  train.py: |
    import os
    import socket
    import time

    import torch
    import torch.distributed as dist
    from torch.nn.parallel import DistributedDataParallel

    dist.init_process_group(backend="nccl")
    rank = dist.get_rank()
    world_size = dist.get_world_size()
    local_rank = int(os.environ["LOCAL_RANK"])
    torch.cuda.set_device(local_rank)
    device = torch.device("cuda", local_rank)
    dtype = torch.bfloat16

    layers = []
    for _ in range(4):
        layers.extend(
            [
                torch.nn.Linear(4096, 4096, bias=False),
                torch.nn.GELU(),
            ]
        )
    model = torch.nn.Sequential(*layers).to(
        device=device, dtype=dtype
    )
    model = DistributedDataParallel(
        model,
        device_ids=[local_rank],
        gradient_as_bucket_view=True,
        bucket_cap_mb=64,
    )
    optimizer = torch.optim.SGD(model.parameters(), lr=1.0e-4)
    features = torch.randn(
        512, 4096, device=device, dtype=dtype
    )
    target = torch.randn(
        512, 4096, device=device, dtype=dtype
    )

    step = 0
    while True:
        started = time.monotonic()
        optimizer.zero_grad(set_to_none=True)
        output = model(features)
        loss = (output - target).float().square().mean()
        loss.backward()
        optimizer.step()
        torch.cuda.synchronize()
        elapsed = time.monotonic() - started
        if step % 5 == 0:
            print(
                "Q118_GPU_TRAIN "
                f"rank={rank}/{world_size} "
                f"local_rank={local_rank} step={step} "
                f"loss={loss.item():.6f} "
                f"step_ms={elapsed * 1000:.1f} "
                f"memory_mib="
                f"{torch.cuda.memory_allocated() / 1048576:.1f} "
                f"node={socket.gethostname()}",
                flush=True,
            )
        step += 1
---
