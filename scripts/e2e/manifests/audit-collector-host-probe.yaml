apiVersion: v1
kind: Pod
metadata:
  name: gpu-fault-audit-collector-host
  namespace: gpu-fault-system
spec:
  restartPolicy: Never
  nodeSelector:
    gpu-fault.io/e2e-target: "true"
  hostPID: true
  tolerations:
    - operator: Exists
  containers:
    - name: probe
      image: public.ecr.aws/amazonlinux/amazonlinux:2023
      securityContext:
        privileged: true
      command:
        - /bin/bash
        - -ceu
        - |
          install -m 0600 \
            /script/audit_collector_runtime_probe.py \
            /host/tmp/audit_collector_runtime_probe.py
          set +e
          chroot /host /opt/gpu-fault/venv/bin/python \
            /tmp/audit_collector_runtime_probe.py host-rdma
          status=$?
          chroot /host /opt/gpu-fault/venv/bin/python -c \
            'import os; os.unlink("/tmp/audit_collector_runtime_probe.py")'
          exit "${status}"
      volumeMounts:
        - name: host-root
          mountPath: /host
        - name: script
          mountPath: /script
          readOnly: true
  volumes:
    - name: host-root
      hostPath:
        path: /
        type: Directory
    - name: script
      configMap:
        name: gpu-fault-audit-collector-script
