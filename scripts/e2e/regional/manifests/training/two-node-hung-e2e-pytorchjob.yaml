# SOURCE MANIFEST: run gpu-training-submit or gpu-fault-workload-annotate first.
# Direct kubectl apply starts training but does not enroll it in fault management.
# Historical two-node hung fixture; assumes p5en-class 8-GPU/16-EFA Pods.
apiVersion: kubeflow.org/v1
kind: PyTorchJob
metadata:
  name: gpu-fault-hung-e2e-r4-20260728
  namespace: gpu-fault-system
spec:
  runPolicy:
    cleanPodPolicy: None
  pytorchReplicaSpecs:
    Master:
      replicas: 1
      restartPolicy: Never
      template:
        metadata:
          labels:
            app: gpu-fault-hung-e2e-r4-20260728
        spec:
          restartPolicy: Never
          affinity:
            podAntiAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchLabels:
                      app: gpu-fault-hung-e2e-r4-20260728
                  topologyKey: kubernetes.io/hostname
          volumes:
            - name: dshm
              emptyDir:
                medium: Memory
                sizeLimit: 16Gi
          containers:
            - name: pytorch
              image: public.ecr.aws/deep-learning-containers/pytorch-training@sha256:ff2c928a2e7b3b290b7c3e353085a373b3cfc7f6b165e338b9be4df439feae38
              imagePullPolicy: IfNotPresent
              volumeMounts:
                - name: dshm
                  mountPath: /dev/shm
              command:
                - /bin/bash
                - -lc
                - |
                  cat >/tmp/hung_e2e.py <<'PY'
                  import os
                  import socket
                  import time

                  import torch
                  import torch.distributed as dist

                  dist.init_process_group(backend="nccl")
                  rank = dist.get_rank()
                  local_rank = int(os.environ["LOCAL_RANK"])
                  torch.cuda.set_device(local_rank)
                  tensor = torch.ones(
                      16 * 1024 * 1024,
                      dtype=torch.float32,
                      device=local_rank,
                  )
                  for step in range(90):
                      dist.all_reduce(tensor)
                      tensor.fill_(1)
                      if local_rank == 0 and step % 10 == 0:
                          print(
                              f"ACTIVE rank={rank} step={step} "
                              f"node={socket.gethostname()}",
                              flush=True,
                          )
                      time.sleep(1)
                  print(
                      f"HUNG_INJECTED rank={rank} "
                      f"node={socket.gethostname()}",
                      flush=True,
                  )
                  while True:
                      time.sleep(60)
                  PY
                  exec torchrun \
                    --nnodes="${WORLD_SIZE}" \
                    --nproc-per-node=8 \
                    --node-rank="${RANK}" \
                    --master-addr="${MASTER_ADDR}" \
                    --master-port="${MASTER_PORT}" \
                    /tmp/hung_e2e.py
              env:
                - name: NCCL_DEBUG
                  value: INFO
                - name: TORCH_NCCL_TRACE_BUFFER_SIZE
                  value: "20000"
                - name: TORCH_NCCL_DEBUG_INFO_PIPE_FILE
                  value: /tmp/torch_nccl_debug_pipe_
                - name: TORCH_NCCL_DUMP_ON_TIMEOUT
                  value: "1"
                - name: FI_PROVIDER
                  value: efa
                - name: FI_EFA_USE_DEVICE_RDMA
                  value: "1"
                - name: FI_EFA_FORK_SAFE
                  value: "1"
              resources:
                requests:
                  cpu: "8"
                  memory: 32Gi
                  nvidia.com/gpu: "8"
                  vpc.amazonaws.com/efa: "16"
                limits:
                  cpu: "16"
                  memory: 64Gi
                  nvidia.com/gpu: "8"
                  vpc.amazonaws.com/efa: "16"
    Worker:
      replicas: 1
      restartPolicy: Never
      template:
        metadata:
          labels:
            app: gpu-fault-hung-e2e-r4-20260728
        spec:
          restartPolicy: Never
          affinity:
            podAntiAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchLabels:
                      app: gpu-fault-hung-e2e-r4-20260728
                  topologyKey: kubernetes.io/hostname
          volumes:
            - name: dshm
              emptyDir:
                medium: Memory
                sizeLimit: 16Gi
          containers:
            - name: pytorch
              image: public.ecr.aws/deep-learning-containers/pytorch-training@sha256:ff2c928a2e7b3b290b7c3e353085a373b3cfc7f6b165e338b9be4df439feae38
              imagePullPolicy: IfNotPresent
              volumeMounts:
                - name: dshm
                  mountPath: /dev/shm
              command:
                - /bin/bash
                - -lc
                - |
                  cat >/tmp/hung_e2e.py <<'PY'
                  import os
                  import socket
                  import time

                  import torch
                  import torch.distributed as dist

                  dist.init_process_group(backend="nccl")
                  rank = dist.get_rank()
                  local_rank = int(os.environ["LOCAL_RANK"])
                  torch.cuda.set_device(local_rank)
                  tensor = torch.ones(
                      16 * 1024 * 1024,
                      dtype=torch.float32,
                      device=local_rank,
                  )
                  for step in range(90):
                      dist.all_reduce(tensor)
                      tensor.fill_(1)
                      if local_rank == 0 and step % 10 == 0:
                          print(
                              f"ACTIVE rank={rank} step={step} "
                              f"node={socket.gethostname()}",
                              flush=True,
                          )
                      time.sleep(1)
                  print(
                      f"HUNG_INJECTED rank={rank} "
                      f"node={socket.gethostname()}",
                      flush=True,
                  )
                  while True:
                      time.sleep(60)
                  PY
                  exec torchrun \
                    --nnodes="${WORLD_SIZE}" \
                    --nproc-per-node=8 \
                    --node-rank="${RANK}" \
                    --master-addr="${MASTER_ADDR}" \
                    --master-port="${MASTER_PORT}" \
                    /tmp/hung_e2e.py
              env:
                - name: NCCL_DEBUG
                  value: INFO
                - name: TORCH_NCCL_TRACE_BUFFER_SIZE
                  value: "20000"
                - name: TORCH_NCCL_DEBUG_INFO_PIPE_FILE
                  value: /tmp/torch_nccl_debug_pipe_
                - name: TORCH_NCCL_DUMP_ON_TIMEOUT
                  value: "1"
                - name: FI_PROVIDER
                  value: efa
                - name: FI_EFA_USE_DEVICE_RDMA
                  value: "1"
                - name: FI_EFA_FORK_SAFE
                  value: "1"
              resources:
                requests:
                  cpu: "8"
                  memory: 32Gi
                  nvidia.com/gpu: "8"
                  vpc.amazonaws.com/efa: "16"
                limits:
                  cpu: "16"
                  memory: 64Gi
                  nvidia.com/gpu: "8"
                  vpc.amazonaws.com/efa: "16"
