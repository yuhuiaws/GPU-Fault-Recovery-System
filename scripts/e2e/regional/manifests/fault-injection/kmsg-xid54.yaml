apiVersion: v1
kind: Pod
metadata:
  name: gpu-fault-kmsg-inject-xid54-20260809
  namespace: gpu-fault-system
spec:
  # GF-REGIONAL-COLLECT-009: CHECK_MECHANICALS (XID 54) full loop.
  #
  # XID 54 (SILENT_RUNNING_PWR_REDUCED_CLOCKING, "auxiliary power is
  # not connected to the GPU board") maps to immediateAction
  # CHECK_MECHANICALS in nvidia-xid-catalog-610. That compiles to the
  # only WAITING -> human-annotation -> resume path in this solution:
  # _check_mechanicals (runtime_adapters.py:279) compares the node's
  # gpu-fault.io/mechanical-inspection-complete annotation against
  # "<incident_id>:<fencing_token>".
  #
  # products in the catalog entry are ['A100','H100','B100'] with no
  # literal H200: catalog_product_family (policy.py:229) maps H200 to
  # the H100 family, so the rule applies. Do NOT fake product=H100 --
  # that would drop the family-mapping half of the coverage.
  #
  # Label e2e-target-a on an isolated node with no prior injected Xid lines in
  # dmesg, so there is no record_id collision risk.
  nodeSelector:
    gpu-fault.io/e2e-target-a: "true"
  hostNetwork: true
  restartPolicy: Never
  tolerations:
    - operator: Exists
  containers:
    - name: inject
      resources:
        requests:
          cpu: "10m"
          memory: 32Mi
        limits:
          cpu: "200m"
          memory: 128Mi
      image: public.ecr.aws/docker/library/busybox:1.36
      command: ["/bin/sh", "-c"]
      args:
        - |
          set -eu
          date -u +"xid54_written_at=%Y-%m-%dT%H:%M:%SZ"
          printf '%s\n' \
            'NVRM: Xid (PCI:0000:59:00): 54, pid=930054, name=python, Auxiliary power is not connected to the GPU board' \
            > /host-dev-kmsg
          date -u +"done_at=%Y-%m-%dT%H:%M:%SZ"
      securityContext:
        privileged: true
      volumeMounts:
        - name: dev-kmsg
          mountPath: /host-dev-kmsg
  volumes:
    - name: dev-kmsg
      hostPath:
        path: /dev/kmsg
        type: CharDevice
