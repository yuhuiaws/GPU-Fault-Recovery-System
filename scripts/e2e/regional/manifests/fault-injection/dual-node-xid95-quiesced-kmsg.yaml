apiVersion: v1
kind: Pod
metadata:
  name: gpu-fault-quiesce-inject-xid95-node00
  namespace: gpu-fault-system
spec:
  nodeSelector:
    gpu-fault.io/e2e-target-a: "true"
  restartPolicy: Never
  hostPID: true
  containers:
    - name: injector
      resources:
        requests:
          cpu: "10m"
          memory: 32Mi
        limits:
          cpu: "200m"
          memory: 128Mi
      image: public.ecr.aws/amazonlinux/amazonlinux:2023
      securityContext:
        privileged: true
      command:
        - /bin/sh
        - -c
        - |
          chroot /host /bin/sh -c '
            systemd-run --unit=gpu-fault-reset-restore-fm-node00 \
              --on-active=90s /bin/systemctl start \
              nvidia-fabricmanager nvidia-dcgm kubelet
            systemctl stop kubelet
            systemctl stop nvidia-dcgm
            systemctl stop nvidia-fabricmanager
            pkill -TERM -x nvidia-persiste || true
            pkill -TERM -x nvidia-device-p || true
            pkill -TERM -x health_monitori || true
            pkill -TERM -x dcgm-exporter || true
            sleep 5
            printf "%s\n" "<3>NVRM: Xid (PCI:0000:59:00): 95" > /dev/kmsg
            sleep 30
            systemctl start nvidia-fabricmanager
            systemctl start nvidia-dcgm
            systemctl start kubelet
          '
      volumeMounts:
        - name: host-root
          mountPath: /host
  volumes:
    - name: host-root
      hostPath:
        path: /
        type: Directory
---
