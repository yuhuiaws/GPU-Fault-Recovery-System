apiVersion: v1
kind: Pod
metadata:
  name: gpu-fault-kmsg-inject-xid45-xid14-0724
  namespace: gpu-fault-system
spec:
  nodeSelector:
    gpu-fault.io/e2e-target-a: "true"
  restartPolicy: Never
  containers:
    - name: inject
      resources:
        requests:
          cpu: "10m"
          memory: 32Mi
        limits:
          cpu: "200m"
          memory: 128Mi
      image: public.ecr.aws/docker/library/busybox:1.36
      command: ["/bin/sh", "-c"]
      args:
        - |
          set -eu
          date -u +"xid45_written_at=%Y-%m-%dT%H:%M:%SZ"
          printf '%s\n' \
            'NVRM: Xid (PCI:0000:59:00): 45, pid=4242, name=python, Preemptive cleanup, due to previous errors' \
            > /host-dev-kmsg
          sleep 5
          date -u +"xid14_written_at=%Y-%m-%dT%H:%M:%SZ"
          printf '%s\n' \
            'NVRM: Xid (PCI:0000:59:00): 14, pid=4242, name=python, Channel exception' \
            > /host-dev-kmsg
      securityContext:
        privileged: true
      volumeMounts:
        - name: dev-kmsg
          mountPath: /host-dev-kmsg
  volumes:
    - name: dev-kmsg
      hostPath:
        path: /dev/kmsg
        type: CharDevice
