apiVersion: v1
kind: Pod
metadata:
  name: gpu-fault-inject-sxid10003-node00
  namespace: gpu-fault-system
spec:
  nodeSelector:
    gpu-fault.io/e2e-target-a: "true"
  restartPolicy: Never
  containers:
    - name: injector
      resources:
        requests:
          cpu: "10m"
          memory: 32Mi
        limits:
          cpu: "200m"
          memory: 128Mi
      image: public.ecr.aws/docker/library/busybox:1.36
      command: ["/bin/sh", "-c"]
      args:
        - |
          set -eu
          sleep 10
          printf '%s\n' \
            '<3>nvidia-nvswitch3: SXid (PCI:0000:ab:00.0): 10003, Fatal, Link 46 Host_unhandled_interrupt' \
            > /host-dev-kmsg
      securityContext:
        privileged: true
      volumeMounts:
        - name: dev-kmsg
          mountPath: /host-dev-kmsg
  volumes:
    - name: dev-kmsg
      hostPath:
        path: /dev/kmsg
        type: CharDevice
