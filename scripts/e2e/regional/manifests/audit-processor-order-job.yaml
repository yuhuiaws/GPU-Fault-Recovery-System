# Render REPLACE_WITH_WHEEL_CONFIGMAP with scripts/e2e/render_manifest.py.
# Do not apply this source manifest directly.
apiVersion: batch/v1
kind: Job
metadata:
  name: gpu-fault-audit-processor-order
  namespace: gpu-fault-system
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app: gpu-fault-audit-processor-order
    spec:
      restartPolicy: Never
      serviceAccountName: gpu-fault-control-plane
      containers:
        - name: audit
          image: public.ecr.aws/docker/library/python:3.12-slim
          command: ["/bin/sh", "-c"]
          args:
            - >-
              python -m pip install --no-cache-dir
              '/artifact/gpu_fault_control_plane-0.10.0-py3-none-any.whl[postgres]'
              && exec python
              /audit/audit_processor_observation_fault_order_postgres.py
          env:
            - name: GPU_FAULT_STORE_URL
              valueFrom:
                secretKeyRef:
                  name: gpu-fault-aurora
                  key: postgres-url
          resources:
            requests:
              cpu: "1"
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: artifact
              mountPath: /artifact
              readOnly: true
            - name: audit
              mountPath: /audit
              readOnly: true
      volumes:
        - name: artifact
          configMap:
            name: REPLACE_WITH_WHEEL_CONFIGMAP
        - name: audit
          configMap:
            name: REPLACE_WITH_AUDIT_CONFIGMAP
