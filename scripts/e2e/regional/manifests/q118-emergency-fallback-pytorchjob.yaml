# E2E FIXTURE: driven by scripts/e2e/, not a supported deployment entry point.
# Resource profile is deliberately small: 1 GPU and 1 EFA device per Pod.
apiVersion: kubeflow.org/v1
kind: PyTorchJob
metadata:
