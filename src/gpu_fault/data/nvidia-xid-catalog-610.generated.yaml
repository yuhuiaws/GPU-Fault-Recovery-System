  resolutionBuckets:
    CONTACT_SUPPORT: Please contact your support organization for further investigation.
    RESTART_APP: 'The application should be restarted


      RESET_GPU or RESTART_BM is not deemed necessary.'
    IGNORE: No Action required
    WORKFLOW_XID_45: "Solo: RESTART_FM \nNot Solo: IGNORE (follow guidance in other Xid)"
    RESET_GPU: 'Refer to https://docs.nvidia.com/deploy/gpu-debug-guidelines/index.html for GPU Reset capabilities & limitations


      RESTART_BM is not deemed necessary.'
    WORKFLOW_XID_48: "Data Center Recovery Action\nSolo: RESET_GPU\nw/ 63 or 64: DRAIN_AND_RESET\n\nInvestagatory Action\nSolo: RUN_FIELDDIAG\nNot Solo: \nString in error would tell us what unit was impacted. \nFB: follow Xid63/64 guidance\nAll other SRAM: check SRAM Error Threshold flag (nvidia-smi <sram_threshold_exceeded> or NSM Msg Type 0x3, Cmd Code 0x7D, bit 0. If set RUN_FIELDDIAG"
    CHECK_MECHANICALS: Check to ensure that device seating and all applicable connections to it are secure.
    WORKFLOW_NVLINK_ERR: "Extract the hex strings from the Xid error message. Note that there should be seven fields in the Xid. Unused fields would expect to be 0x0 rather than a full DWORD of 0\u2019s. The first, third, fourth and fifth registers are valid for Hopper-based products. \nEvaluate the populate(d) registers. If bits other than those specifically outlined below are seen, please report a bug. \nFirst register:\nBit 0, 23, 30: Can be safely ignored.\nBits 1, 20: These are generally sympathetic or secondary errors. If seen with other bits set or other Xid/SXid, please follow the resolution for those. If seen solo, please report a bug. \nBits 4 or 5: Likely HW issue with ECC/Parity --> If seen more than 2 times on the same link, report a bug.\nBits 8, 9, 12, 16, 17, 24, 28: Could possibly be a HW issue: Check link mechanical connections and re-seat if a field resolution is required. Run diags if issue persists. If the issue persist, and diagnostics has passed please report a bug.\
      \ \nBits 21 or 22: Marginal channel SI issue. If other errors accompany this Xid, follow the resolution for those first. Otherwise, check link mechanical connections. Run Field Diags and report a bug. \nBits 27, 29: If seen repeatedly, please report a bug. \nThird register:\nBits 0, 1, 2, 6: Likely HW issue with ECC/Parity --> If seen more than 2 times on the same link, report a bug.\nBit 13: Not expected to be seen in production. If seen, please report a bug. \nBits 16, 19: If seen repeatedly, please run Field Diags and report a bug\nBits 17, 18: If seen repeatedly, please report a bug.\nFourth register:\nBits 16, 17: These are generally sympathetic or secondary errors. If seen with other bits set or other Xid/SXid, please follow the resolution for those. If seen solo, please report a bug. \nBit 18: These are generally sympathetic or secondary errors, though a reset of the fabric is required. If seen with other bits set or other Xid/SXid, please follow the resolution for those. If\
      \ seen solo, please report a bug.\nFifth register:\nBits 18, 19, 21, 22, 24, 25, 27, 28: Likely HW issue with ECC/Parity --> If seen more than 2 times on the same link, report a bug.\nBits 20, 23, 26, 29: These errors represent a threshold of ECC errors being exceeded. There was no uncorrectable error at this time. Continue operation. If desired, Field Diags can be run to check for link integrity."
    UPDATE_SWFW: "Update Firmware and Software to latest versions\n\nXID 78: basic issues will keep vGPU functionality from being able to operate; must resolve to progress\n1. Guest driver version is incompatible with the host driver\n* In this case error string should be \u201CGuest driver is incompatible with host driver\"\n2. This vGPU type is not compatible with the guest OS type/GPU type. For example, user is trying to use a compute profile on an old Maxwell GPU on windows guest.\n* In this case error string should be \"vGPU type is not supported\""
    RESTART_BM: Restart bare metal, system should be restarted
    WORKFLOW_NVLINK5_ERR: 'Please see the "XID 144-150 Decode" (was "Customer Doc 144-150")tab for further guidance in evaluating these Xids. These errors need decoding of XID message as follows to determine the resolution action:

      Format of the XID error message: Xid (PCI:0000:BB:DF): <Xid Number> <sub component> <fatal vs nonfatal> <Crosscontain> <injected> <link> (<intrInfo> <errorStatus> <errorDebugData[0]> <errorDebugData[1]> <errorDebugData[2]> <errorDebugData[3]> <errorDebugData[4]>)

      From the above message, <intrInfo>, <errorStatus> must be decoded and evaluated using "XID 144-150 Decode" to derive the final resolution.'
    RESTART_VM: 'VM owning the affected GPU must be restarted


      RESET_GPU or RESTART_BM is not deemed necessary.'
    XID_154: Follow XID 154 reported guidance
    CHECK_UVM: If UVM/vGPU is being utilized, RESET_GPU; otherwise IGNORE
    CHECK_APP/CUDA: "Issue likely caused by an application passing bad data or utilizing incorrect methods in communications with GPU. Some errors will contain PID that can be used \nto identify source of the problem. \nIf determined to be a driver issue then REPORT_ISSUE"
    WORKFLOW_XID_13: 'Repeat TPC and GPC, diff SMs: RUN_DCGMEUD (possible HW issue); if pass RUN_FIELDDIAGS

      Repeat TPC and GPC, single SM: RUN_DCGMEUD (possible HW issue); if pass RUN_FIELDDIAGS

      Solo, no burst: CHECK_APP/CUDA

      Not Repeat TPC and GPC: CHECK_APP/CUDA

      Non-prod environment: CHECK_APP/CUDA

      If known good APP and Solo: REPORT_ISSUE'
    WORKFLOW_XID_31: 'Multiple runs needed to establish pattern

      Repeat MMU faults to same GPU (via PCI-ID): RUN_DCGMEUD (possible HW issue); if pass RUN_FIELDDIAGS

      Repeat MMU faults to diff GPU (via PCI-ID): CHECK_APP/CUDA

      Solo, no burst: CHECK_APP/CUDA

      If known good APP: REPORT_ISSUE'
    ? 'Solo: RESTART_FM

      Not Solo: IGNORE (follow other Xid)'
    : 'Solo: RESTART_FM

      Not Solo: IGNORE (follow other Xid)'
    INVESTIGATE_SW: "There is a problem with either user or NVIDIA software that needs to be investigated further. In many cases the user software may be making calls to illegal \nareas, poorly structured commands or other issues. \nThis may also be a problem with NVIDIA software in which case an issue should be reported. \nIn many cases there may be a PID that could be tracked back to the offending, originating entity."
    IGNORE (sympathetic): This is a sympathetic error that is expected to be seen with other conditions. Resolution for the other errors should be undertaken first. If this error was seen independently or all other resolutions aren't suffficient then REPORT_ISSUE.
    XID_137_FLOW: "This event is logged when a fault is reported by the remote MMU, such as when an illegal NVLink peer-to-peer access is made by an applicable unit on the chip. \nTypically these are application-level bugs.\nWhen this event is logged, NVIDIA recommends the following:\n\u2022 Run the application in cuda-gdb or cuda-memcheck\n\u2022 Note: The cuda-memcheck tool instruments the running application and reports which line of code performed the illegal read.\nor\n\u2022 Run the application with CUDA_DEVICE_WAITS_ON_EXCEPTION=1 and then attach later with cuda-gdb\nFile a bug if the previous two come back inconclusive to eliminate other possible causes."
    INVESTIGATE_LINK_SI: Refer to GB200 Resiliency Service Flow for appropriate Access or Trunk link telemetry and investigation methods.
    N/A Informational only regarding another Xid: Other issues need to be addressed. This Xid in informational only and is always expected to be seen with another Xid requiring a recovery action.
    INVESTIGATE_SW_USER: Investigate SW or user initiated if unexpected
    SYMPATHETIC_REPORT_SOLO: "This is a sympathetic error that is expected to be seen with other conditions. Resolution for the other errors should be undertaken first. If this error was seen \nindependently or all other resolutions aren't suffficient then REPORT_ISSUE."
    XID_154_EVAL: "If an XID 154 is seen along with this error, take that action. \nIf no XID 154 present, RESTART_APP"
    CHECK_NVLINK_FAILURE_FLOW: "Check telemetry to see if the any link went down in the partition within that last 30 seconds. If so, this Xid can be ignored as it was likely a by-product of the \nother conditions which should be investigated. \n\nIf no link down indication is present, REPORT_ISSUE."
    REPORT_ISSUE (if seen >1 per day): REPORT_ISSUE (if seen >1 per day)
    INVESTIGATE_SW_USER_LINK_SI: Investigate software or user intervention if not expected; additionally, follow INVESTGATE_LINK_SI if needed
    INVESTIGATE_PEER_DEVICE: 'A peer device experience the issue as decoded in the Xid144-150 table (Xid 149 in particular). Based upon the note column:

      Received_TS1: will be seen when peer link down reason is unknown

      Peer_side_down_to_sleep_state: investigate peer software and users if unexpected

      Peer_side_down_to_disable_state: investigate peer software and users if unexpected

      Peer_side_down_to_disable_and_port_lock: investigate peer software and users if unexpected

      Peer_side_down_due_to_thermal_event: check switch cooling

      Peer_side_down_due_to_force_event: investigate peer software and users if unexpected

      Peer_side_down_due_to_reset_event: investigate peer software and users if unexpected'
    INVESTIGATE_HOST: Check other logs as this is likely a secondary indicator of some action or fault (may be OOB).
    INVESTIGATE_LINK_SI_AND_CABLES: "A more general fault that could be cable, temperature, transceiver or seating condition. Refer to GB200 Resiliency Service Flow for appropriate Access or Trunk \nlink telemetry and investigation methods."
