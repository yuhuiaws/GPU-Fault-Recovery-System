    triggerConditions: "This event is logged for general user application faults. Typically this is an out-of-bounds error where the user has walked past the end of an array, but could also be an illegal instruction, illegal register, or other case.\n\nIn rare cases, it\u2019s possible for a hardware failure or system software bugs to materialize as XID 13.\n\nWhen this event is logged, NVIDIA recommends the following:\n1. Run the application in cuda-gdb or the Compute Sanitizer memcheck tool , or\n2. Run the application with CUDA_DEVICE_WAITS_ON_EXCEPTION=1 and then attach later with cuda-gdb, or\n3. File a bug if the previous two come back inconclusive to eliminate potential NVIDIA driver or hardware bug.\n\nNOTE: The Compute Sanitizer memcheck tool instruments the running application and reports which line of code performed the illegal read."
