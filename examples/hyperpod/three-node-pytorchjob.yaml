# SOURCE MANIFEST: run gpu-training-submit or gpu-fault-workload-annotate first.
# Direct kubectl apply starts training but does not enroll it in fault management.
# Resource profile assumes p5en-class nodes with 8 GPUs and 16 EFA devices per Pod.
apiVersion: kubeflow.org/v1
kind: PyTorchJob
metadata:
  name: gpu-fault-three-node-pytorch
  namespace: gpu-fault-system
spec:
  runPolicy:
    cleanPodPolicy: None
  pytorchReplicaSpecs:
    Master:
      replicas: 1
      restartPolicy: Never
      template:
        metadata:
          labels:
            app: gpu-fault-three-node-pytorch
        spec:
          restartPolicy: Never
          affinity:
            podAntiAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchLabels:
                      app: gpu-fault-three-node-pytorch
                  topologyKey: kubernetes.io/hostname
          volumes:
            - name: dshm
              emptyDir:
                medium: Memory
                sizeLimit: 8Gi
          containers:
            - name: pytorch
              image: public.ecr.aws/deep-learning-containers/pytorch-training@sha256:ff2c928a2e7b3b290b7c3e353085a373b3cfc7f6b165e338b9be4df439feae38
              imagePullPolicy: IfNotPresent
              volumeMounts:
                - name: dshm
                  mountPath: /dev/shm
              command:
                - /bin/bash
                - -lc
                - |
                  cat >/tmp/three_node_train.py <<'PY'
                  import os
                  import socket

                  import torch
                  import torch.distributed as dist
                  from torch.nn.parallel import DistributedDataParallel

                  dist.init_process_group(backend="nccl")
                  rank = dist.get_rank()
                  world_size = dist.get_world_size()
                  local_rank = int(os.environ["LOCAL_RANK"])
                  torch.cuda.set_device(local_rank)

                  device = torch.device("cuda", local_rank)
                  total = torch.tensor([rank + 1.0], device=device)
                  dist.all_reduce(total)
                  expected = world_size * (world_size + 1) / 2
                  assert total.item() == expected

                  torch.manual_seed(20260722)
                  model = torch.nn.Linear(16, 1).to(device)
                  model = DistributedDataParallel(
                      model, device_ids=[local_rank]
                  )
                  optimizer = torch.optim.SGD(model.parameters(), lr=0.01)
                  for step in range(3):
                      features = torch.ones(8, 16, device=device)
                      target = torch.full((8, 1), 0.5, device=device)
                      optimizer.zero_grad()
                      loss = torch.nn.functional.mse_loss(
                          model(features), target
                      )
                      loss.backward()
                      optimizer.step()
                      print(
                          f"rank={rank} step={step} "
                          f"loss={loss.item():.6f}",
                          flush=True,
                      )

                  dist.barrier()
                  print(
                      f"SUCCESS rank={rank}/{world_size} "
                      f"node={socket.gethostname()} "
                      f"all_reduce={total.item()}",
                      flush=True,
                  )
                  dist.destroy_process_group()
                  PY
                  exec torchrun \
                    --nnodes="${WORLD_SIZE}" \
                    --nproc-per-node=8 \
                    --node-rank="${RANK}" \
                    --master-addr="${MASTER_ADDR}" \
                    --master-port="${MASTER_PORT}" \
                    /tmp/three_node_train.py
              env:
                - name: NCCL_DEBUG
                  value: INFO
                - name: FI_PROVIDER
                  value: efa
                - name: FI_EFA_USE_DEVICE_RDMA
                  value: "1"
                - name: FI_EFA_FORK_SAFE
                  value: "1"
              resources:
                requests:
                  cpu: "8"
                  memory: 32Gi
                  nvidia.com/gpu: "8"
                  vpc.amazonaws.com/efa: "16"
                limits:
                  cpu: "16"
                  memory: 64Gi
                  nvidia.com/gpu: "8"
                  vpc.amazonaws.com/efa: "16"
    Worker:
      replicas: 2
      restartPolicy: Never
      template:
        metadata:
          labels:
            app: gpu-fault-three-node-pytorch
        spec:
          restartPolicy: Never
          affinity:
            podAntiAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchLabels:
                      app: gpu-fault-three-node-pytorch
                  topologyKey: kubernetes.io/hostname
          volumes:
            - name: dshm
              emptyDir:
                medium: Memory
                sizeLimit: 8Gi
          containers:
            - name: pytorch
              image: public.ecr.aws/deep-learning-containers/pytorch-training@sha256:ff2c928a2e7b3b290b7c3e353085a373b3cfc7f6b165e338b9be4df439feae38
              imagePullPolicy: IfNotPresent
              volumeMounts:
                - name: dshm
                  mountPath: /dev/shm
              command:
                - /bin/bash
                - -lc
                - |
                  cat >/tmp/three_node_train.py <<'PY'
                  import os
                  import socket

                  import torch
                  import torch.distributed as dist
                  from torch.nn.parallel import DistributedDataParallel

                  dist.init_process_group(backend="nccl")
                  rank = dist.get_rank()
                  world_size = dist.get_world_size()
                  local_rank = int(os.environ["LOCAL_RANK"])
                  torch.cuda.set_device(local_rank)

                  device = torch.device("cuda", local_rank)
                  total = torch.tensor([rank + 1.0], device=device)
                  dist.all_reduce(total)
                  expected = world_size * (world_size + 1) / 2
                  assert total.item() == expected

                  torch.manual_seed(20260722)
                  model = torch.nn.Linear(16, 1).to(device)
                  model = DistributedDataParallel(
                      model, device_ids=[local_rank]
                  )
                  optimizer = torch.optim.SGD(model.parameters(), lr=0.01)
                  for step in range(3):
                      features = torch.ones(8, 16, device=device)
                      target = torch.full((8, 1), 0.5, device=device)
                      optimizer.zero_grad()
                      loss = torch.nn.functional.mse_loss(
                          model(features), target
                      )
                      loss.backward()
                      optimizer.step()
                      print(
                          f"rank={rank} step={step} "
                          f"loss={loss.item():.6f}",
                          flush=True,
                      )

                  dist.barrier()
                  print(
                      f"SUCCESS rank={rank}/{world_size} "
                      f"node={socket.gethostname()} "
                      f"all_reduce={total.item()}",
                      flush=True,
                  )
                  dist.destroy_process_group()
                  PY
                  exec torchrun \
                    --nnodes="${WORLD_SIZE}" \
                    --nproc-per-node=8 \
                    --node-rank="${RANK}" \
                    --master-addr="${MASTER_ADDR}" \
                    --master-port="${MASTER_PORT}" \
                    /tmp/three_node_train.py
              env:
                - name: NCCL_DEBUG
                  value: INFO
                - name: FI_PROVIDER
                  value: efa
                - name: FI_EFA_USE_DEVICE_RDMA
                  value: "1"
                - name: FI_EFA_FORK_SAFE
                  value: "1"
              resources:
                requests:
                  cpu: "8"
                  memory: 32Gi
                  nvidia.com/gpu: "8"
                  vpc.amazonaws.com/efa: "16"
                limits:
                  cpu: "16"
                  memory: 64Gi
                  nvidia.com/gpu: "8"
                  vpc.amazonaws.com/efa: "16"
