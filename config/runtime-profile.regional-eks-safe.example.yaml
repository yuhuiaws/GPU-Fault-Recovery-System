# “regional-eks-safe” 是纯 EKS（托管节点组，无 SageMaker HyperPod）GPU 集群的
# 区域生产 profile；术语映射见 config/README.md。与 regional-hyperpod-safe 的差别只有
# 节点生命周期：nodeReboot 由 gpu-fault-eks-adapter OWN（executor 对绑定的 EC2 实例
# 调用 RebootInstances，确认条件为 EC2 state running + 新 Agent incarnation/boot_id），
# nodeReplace 由 gpu-fault-eks-adapter OWN 为 warm-spare 交接（observed warm-spare-v1）：
# 纯 EKS 没有 provider 侧替换，REPLACE_NODE 只把工作负载交接到已声明的热备节点。
# 没有 HyperPod health-monitoring-agent，因此不声明 hyperpod-hma 的 gpuDetection /
# providerHealthIsolation。
# 每个 OWN/DELEGATE 的 owner 必须由目标 GPU 集群 executor 实际构造的 adapter 广告出来：
# gpu-fault-eks-adapter 要求 executor 设置 GPU_FAULT_ENABLE_HYPERPOD_ADAPTER=true 且
# GPU_FAULT_CLUSTER_PROVIDER=eks-managed（变量名不改，含义见环境变量参考）。
# cluster_id 是稳定注册锚点；本文件是 templateSource，release-deploy 会忽略这里的
# cluster_id/profile_version，按规范化策略内容生成不可变快照和 regional-eks-<digest12> 版本。
cluster_id: REPLACE_WITH_CLUSTER_ID
environment: eks
profile_version: eks-v1
claims:
  - capability: evidenceCapture
    mode: OWN
    owner: gpu-fault-control-plane
    adapter: control-plane-evidence
  - capability: schedulerDrain
    mode: OWN
    owner: gpu-fault-kubernetes-adapter
    adapter: regional-cluster-executor
  - capability: checkpointRestore
    mode: OWN
    owner: gpu-fault-kubernetes-adapter
    adapter: regional-cluster-executor
  - capability: workloadStop
    mode: OWN
    owner: gpu-fault-kubernetes-adapter
    adapter: regional-cluster-executor
  - capability: workloadRestart
    mode: OWN
    owner: gpu-fault-kubernetes-adapter
    adapter: regional-cluster-executor
  - capability: mechanicalInspection
    mode: OWN
    owner: gpu-fault-kubernetes-adapter
    adapter: regional-cluster-executor
  - capability: deepDiagnostics
    mode: OWN
    owner: gpu-fault-validation-adapter
    adapter: control-plane-validation
  - capability: supportEscalation
    mode: OWN
    owner: gpu-fault-support-escalation
    adapter: fixed-template-email
  - capability: diagnosticBundleCapture
    mode: OWN
    owner: gpu-fault-node-agent
    adapter: node-action
  - capability: gpuReset
    mode: OWN
    owner: gpu-fault-node-agent
    adapter: node-action
  - capability: fabricManagerRestart
    mode: OWN
    owner: gpu-fault-node-agent
    adapter: node-action
  - capability: fabricReset
    mode: OWN
    owner: gpu-fault-node-agent
    adapter: node-action
  # REMEDIATE_EFA_DRIVER (EFA PCI function present, efa driver unbound). The
  # Node Agent ships it enabled (ALLOW_EFA_DRIVER_REMEDIATION=true) but until
  # 2026-09-06 no regional profile claimed the capability, so every such
  # incident fail-closed with "no executable owner for efaDriverRemediation"
  # (GF-REGIONAL-COLLECT-017 A, live).
  - capability: efaDriverRemediation
    mode: OWN
    owner: gpu-fault-node-agent
    adapter: node-action
  - capability: nvlinkDiagnostics
    mode: OBSERVE
    owner: gpu-fault-node-agent
  - capability: memoryDiagnostics
    mode: OBSERVE
    owner: gpu-fault-node-agent
  - capability: driverRemediation
    mode: OBSERVE
    owner: gpu-fault-node-agent
  - capability: softwareFirmwareUpdate
    mode: OBSERVE
    owner: gpu-fault-node-agent
  - capability: nodeReboot
    mode: OWN
    owner: gpu-fault-eks-adapter
    adapter: regional-cluster-executor
  # Provider-side replacement does not exist on a plain EKS cluster; REPLACE_NODE
  # is the Kubernetes-level warm-spare handover (HEALTHY_WARM_SPARE_ONLY) the
  # executor's spare coordinator runs, and fails closed without a declared spare.
  - capability: nodeReplace
    mode: OWN
    owner: gpu-fault-eks-adapter
    adapter: regional-cluster-executor
observed:
  - capability: evidenceCapture
    owner: gpu-fault-control-plane
    available: true
    version: v1
  - capability: schedulerDrain
    owner: gpu-fault-kubernetes-adapter
    available: true
    version: regional-v1
  - capability: checkpointRestore
    owner: gpu-fault-kubernetes-adapter
    available: true
    version: regional-v1
  - capability: workloadStop
    owner: gpu-fault-kubernetes-adapter
    available: true
    version: regional-v1
  - capability: workloadRestart
    owner: gpu-fault-kubernetes-adapter
    available: true
    version: regional-v1
  - capability: mechanicalInspection
    owner: gpu-fault-kubernetes-adapter
    available: true
    version: regional-v1
  - capability: deepDiagnostics
    owner: gpu-fault-validation-adapter
    available: true
    version: v1
  - capability: supportEscalation
    owner: gpu-fault-support-escalation
    available: true
    version: fixed-template-v1
  - capability: diagnosticBundleCapture
    owner: gpu-fault-node-agent
    available: true
    version: node-action-v1
  - capability: gpuReset
    owner: gpu-fault-node-agent
    available: true
    version: node-action-v1
  - capability: fabricManagerRestart
    owner: gpu-fault-node-agent
    available: true
    version: node-action-v1
  - capability: fabricReset
    owner: gpu-fault-node-agent
    available: true
    version: node-action-v1
  - capability: efaDriverRemediation
    owner: gpu-fault-node-agent
    available: true
    version: node-action-v1
  - capability: nodeReboot
    owner: gpu-fault-eks-adapter
    available: true
    version: ec2-reboot-v1
  - capability: nodeReplace
    owner: gpu-fault-eks-adapter
    available: true
    version: warm-spare-v1
