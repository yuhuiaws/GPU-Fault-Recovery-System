apiVersion: gpu-fault.aws/v1alpha1
kind: RegionalSite
metadata:
  name: gpu-fault-production
spec:
  repositoryRoot: REPLACE_WITH_ABSOLUTE_REPOSITORY_ROOT
  gpuKubeconfig: /secure/gpu-fault/gpu-clusters.kubeconfig
  awsRegion: REPLACE_WITH_AWS_REGION
  namespace: gpu-fault-system
  autoRollback: true

  cpu:
    kubeconfig: /secure/gpu-fault/cpu-control-plane.kubeconfig
    eksArn: REPLACE_WITH_CPU_EKS_ARN
    hyperpodClusterName: REPLACE_WITH_CPU_HYPERPOD_CLUSTER_NAME

  release:
    manifest: dist/current-release.json
    agentConfigDigest: REPLACE_WITH_64_HEX_CONFIG_DIGEST
    upgradeMaxUnavailable: 0
    rollbackMaxUnavailable: 2
    # 1 keeps a shared release rolling one GPU cluster at a time; raise to at most
    # 8 only when the site accepts several GPU clusters being touched at once.
    upgradeMaxParallelClusters: 1

  runtimeProfile:
    source: config/runtime-profile.regional-hyperpod-safe.example.yaml
    templateSource: config/runtime-profile.regional-hyperpod-safe.example.yaml
    version: hyperpod-v1
    registrationClusterId: gpu-prod-a

  nlb:
    # Values are discovered or created by the ARN-driven administrator bootstrap.
    name: REPLACE_WITH_NLB_NAME
    publicSubnets:
      - REPLACE_WITH_PUBLIC_SUBNET_A
      - REPLACE_WITH_PUBLIC_SUBNET_B
    securityGroup: REPLACE_WITH_NLB_SECURITY_GROUP_ID
    certificateArn: REPLACE_WITH_ACM_CERTIFICATE_ARN

  # Optional when DNS is managed outside this solution.
  dns:
    hostedZoneId: REPLACE_WITH_ROUTE53_HOSTED_ZONE_ID
    hostname: REPLACE_WITH_CONTROL_PLANE_HOSTNAME

  images:
    # release-deploy synchronizes these fields from signed Manifest v3.
    runtime: REPLACE_WITH_RUNTIME_IMAGE_AT_SHA256
    nodeInstaller: REPLACE_WITH_NODE_INSTALLER_IMAGE_AT_SHA256
    dcgmExporter: nvcr.io/nvidia/k8s/dcgm-exporter@sha256:d22403c31e5f17d089f909a3d9f0e4e5114258ea063a81f9268c55d5ab663cf1
    adot: public.ecr.aws/aws-observability/aws-otel-collector@sha256:bb72328152c72fb9662056759b275f7cc85e115db12bbb114fbea9f68dc4816c

  health:
    auroraClusterId: gpu-fault-regional-aurora
    ampWorkspaceId: REPLACE_WITH_AMP_WORKSPACE_ID
    ampRuleNamespace: gpu-fault-control-plane-capacity
    snsTopicArn: REPLACE_WITH_SNS_TOPIC_ARN
    certificateMinValidityDays: 30
    remoteCommandMaxUnclaimedSeconds: 300
    requireConfirmedSnsSubscription: true

  notifications:
    allowEmail: false
    acknowledgeExternalAlertChannel: true
    # ARN-only deploy defaults these fields from --admin-email, but sender,
    # recipients and the subject prefix may be configured independently.
    # adminEmail: gpu-operations@example.com
    # emailSender: gpu-operations@example.com
    # emailRecipients:
    #   - gpu-operations@example.com
    #   - gpu-platform-oncall@example.com
    # emailSubjectPrefix: "[PROD]"

  clusters:
    - clusterId: gpu-prod-a
      context: REPLACE_WITH_GPU_EKS_CONTEXT
      hyperpodClusterName: REPLACE_WITH_GPU_HYPERPOD_CLUSTER_NAME
      eksClusterArn: REPLACE_WITH_GPU_EKS_ARN
      executorIrsaRoleArn: REPLACE_WITH_EXECUTOR_IRSA_ROLE_ARN
      # Optional. IAM role for this cluster's data-plane ADOT collector:
      # `aps:RemoteWrite` on spec.health.ampWorkspaceId, trusted by the GPU
      # cluster's OIDC provider for
      # system:serviceaccount:gpu-fault-system:gpu-fault-adot-dataplane.
      # `gpu-fault-admin bootstrap` / `join-cluster` create one per GPU cluster
      # (`gpu-fault-<site>-<hyperpod>-adot-writer`) whenever the site has an
      # AMP workspace and fill this key in; `remove-cluster` deletes it with
      # the cluster's other resources. Set it only to point at a role you own
      # instead -- an explicit value always wins over the created one. Never
      # write a placeholder: a leftover REPLACE_WITH_ value fails the render.
      # Without the key the release prints that it skipped the collector for
      # this cluster and applies everything else.
      adotIrsaRoleArn: REPLACE_WITH_ADOT_IRSA_ROLE_ARN
      allowedNamespaces:
        - gpu-fault-system
        - training
      # Required production boundary for signed Agent endpoint registration.
      # Use only the GPU node subnet CIDRs, not the whole VPC.
      agentEndpointAllowedCidrs:
        - REPLACE_WITH_GPU_NODE_SUBNET_CIDR
      controlPlaneUrl: https://REPLACE_WITH_CONTROL_PLANE_HOSTNAME
      tokenFile: /secure/gpu-fault/gpu-prod-a.token
      caFile: /secure/gpu-fault/control-plane-ca.crt
      fleetMasterFile: /secure/gpu-fault/fleet-master
