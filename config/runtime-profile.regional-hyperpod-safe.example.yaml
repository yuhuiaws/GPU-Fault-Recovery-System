# “regional-hyperpod-safe” 与唯一生产部署路径的术语映射见 config/README.md。
# 每个 OWN/DELEGATE 的 owner 必须由目标 GPU 集群 executor 实际构造的
# adapter 广告出来，否则该 owner 的 remote command 永远不会被 claim。
# nodeReboot / nodeReplace 的 gpu-fault-hyperpod-adapter 要求 executor
# 设置 GPU_FAULT_ENABLE_HYPERPOD_ADAPTER=true。当前 profile 同时 OWN 两项能力，
# 注册前必须完成部署和运维手册阶段 D.1/D.2 的独立验收；若只批准 reboot，
# 应发布新的 profile version 并将 nodeReplace 保持为 OBSERVE。
# 校验命令见 docs/部署和运维手册.md 的"区域模式故障排查"小节。
# cluster_id 是稳定注册锚点，不是 HyperPod provider 名；可沿用首次集群 ID，
# 但该集群退役后锚点仍保持不变，不要求属于当前纳管集合。
# 同一 profile_version 在区域控制面只保存一份，所有引用该版本的集群共享。
# 本文件是 templateSource；release-deploy 会忽略这里的 cluster_id/profile_version，
# 按规范化策略内容生成不可变快照和 regional-hyperpod-<digest12> 版本。
# 区域生产部署保证 Node Agent、签名 key、fleet readiness 和 node-action adapter
# 已收敛，因此诊断包、单 GPU reset、Fabric Manager restart 和全 GPU/NVSwitch
# reset 由本方案 OWN；策略、workload、零 client、fencing 和 post-action validation
# 仍逐层 fail closed。
cluster_id: REPLACE_WITH_CLUSTER_ID
environment: hyperpod-eks
profile_version: hyperpod-v1
claims:
  - capability: gpuDetection
    mode: AUGMENT
    owner: hyperpod-hma
    adapter: hyperpod-hma
  - capability: providerHealthIsolation
    mode: OBSERVE
    owner: hyperpod-hma
    adapter: hyperpod-hma
  - capability: evidenceCapture
    mode: OWN
    owner: gpu-fault-control-plane
    adapter: control-plane-evidence
  - capability: schedulerDrain
    mode: OWN
    owner: gpu-fault-kubernetes-adapter
    adapter: regional-cluster-executor
  - capability: checkpointRestore
    mode: OWN
    owner: gpu-fault-kubernetes-adapter
    adapter: regional-cluster-executor
  - capability: workloadStop
    mode: OWN
    owner: gpu-fault-kubernetes-adapter
    adapter: regional-cluster-executor
  - capability: workloadRestart
    mode: OWN
    owner: gpu-fault-kubernetes-adapter
    adapter: regional-cluster-executor
  - capability: mechanicalInspection
    mode: OWN
    owner: gpu-fault-kubernetes-adapter
    adapter: regional-cluster-executor
  - capability: deepDiagnostics
    mode: OWN
    owner: gpu-fault-validation-adapter
    adapter: control-plane-validation
  - capability: supportEscalation
    mode: OWN
    owner: gpu-fault-support-escalation
    adapter: fixed-template-email
  - capability: diagnosticBundleCapture
    mode: OWN
    owner: gpu-fault-node-agent
    adapter: node-action
  - capability: gpuReset
    mode: OWN
    owner: gpu-fault-node-agent
    adapter: node-action
  - capability: fabricManagerRestart
    mode: OWN
    owner: gpu-fault-node-agent
    adapter: node-action
  - capability: fabricReset
    mode: OWN
    owner: gpu-fault-node-agent
    adapter: node-action
  # REMEDIATE_EFA_DRIVER (EFA PCI function present, efa driver unbound). The
  # Node Agent ships it enabled (ALLOW_EFA_DRIVER_REMEDIATION=true) but until
  # 2026-09-06 no regional profile claimed the capability, so every such
  # incident fail-closed with "no executable owner for efaDriverRemediation"
  # (GF-REGIONAL-COLLECT-017 A, live).
  - capability: efaDriverRemediation
    mode: OWN
    owner: gpu-fault-node-agent
    adapter: node-action
  - capability: nvlinkDiagnostics
    mode: OBSERVE
    owner: gpu-fault-node-agent
  - capability: memoryDiagnostics
    mode: OBSERVE
    owner: gpu-fault-node-agent
  - capability: driverRemediation
    mode: OBSERVE
    owner: gpu-fault-node-agent
  - capability: softwareFirmwareUpdate
    mode: OBSERVE
    owner: gpu-fault-node-agent
  - capability: nodeReboot
    mode: OWN
    owner: gpu-fault-hyperpod-adapter
    adapter: regional-cluster-executor
  - capability: nodeReplace
    mode: OWN
    owner: gpu-fault-hyperpod-adapter
    adapter: regional-cluster-executor
observed:
  - capability: evidenceCapture
    owner: gpu-fault-control-plane
    available: true
    version: v1
  - capability: schedulerDrain
    owner: gpu-fault-kubernetes-adapter
    available: true
    version: regional-v1
  - capability: checkpointRestore
    owner: gpu-fault-kubernetes-adapter
    available: true
    version: regional-v1
  - capability: workloadStop
    owner: gpu-fault-kubernetes-adapter
    available: true
    version: regional-v1
  - capability: workloadRestart
    owner: gpu-fault-kubernetes-adapter
    available: true
    version: regional-v1
  - capability: mechanicalInspection
    owner: gpu-fault-kubernetes-adapter
    available: true
    version: regional-v1
  - capability: deepDiagnostics
    owner: gpu-fault-validation-adapter
    available: true
    version: v1
  - capability: supportEscalation
    owner: gpu-fault-support-escalation
    available: true
    version: fixed-template-v1
  - capability: diagnosticBundleCapture
    owner: gpu-fault-node-agent
    available: true
    version: node-action-v1
  - capability: gpuReset
    owner: gpu-fault-node-agent
    available: true
    version: node-action-v1
  - capability: fabricManagerRestart
    owner: gpu-fault-node-agent
    available: true
    version: node-action-v1
  - capability: fabricReset
    owner: gpu-fault-node-agent
    available: true
    version: node-action-v1
  - capability: efaDriverRemediation
    owner: gpu-fault-node-agent
    available: true
    version: node-action-v1
  - capability: nodeReboot
    owner: gpu-fault-hyperpod-adapter
    available: true
    version: provider-reboot-v1
  - capability: nodeReplace
    owner: gpu-fault-hyperpod-adapter
    available: true
    version: warm-spare-v1
