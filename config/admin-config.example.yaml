apiVersion: gpu-fault.aws/v1alpha1
kind: AdminConfig
spec:
  # Only fields declared in this template are supported administrator inputs.
  # Omitted fields keep their current persisted value.
  capacity:
    controlWorkerReplicas: 6
    # Declared topology. maxClusterQueueDepth must be >= 4 x largest,
    # aurora.minAcu >= managed / 100 (rounded up to 0.5); the fault reserve
    # is derived as max(depth / 8, largest).
    largestClusterNodeCount: 512
    managedNodeCount: 512
    telemetrySpool:
      enabled: false
      replicas: 0
    # No remediation field is an administrator input. One workflow per node
    # and per failure domain are safety constants fixed at 1, and
    # remediation.maxActiveRegion, maxActivePerCluster and
    # maxActivePerResourceClass are retired: each GPU cluster's remediation
    # storm breaker bounds a correlated fault. An older file that still
    # spells them keeps loading; they are ignored with a warning.
  aurora:
    minAcu: 8
    maxAcu: 32
  processor:
    maxQueueDepth: 65536
    maxClusterQueueDepth: 4096
    retryAfterSeconds: 2
    retryBackoffSeconds: 1
    retryBackoffMaxSeconds: 30
    completedRetentionSeconds: 600
  workflow:
    pollIntervalSeconds: 5
    dispatcherWorkers: 8
  notificationDelivery:
    batchSize: 25
    maxAttempts: 8
  evidence:
    retentionHours: 24
    maxRecordsPerNode: 10000
  # The CPU control-plane HyperPod group's scheduled update, applied by the
  # deploy's last step: rolling makes the group's own schedule re-image one
  # instance at a time, rolled back on the two CloudWatch alarms below (which
  # the deploy creates on the API NLB); unchanged leaves the group as found.
  # The deploy never adds a schedule and never changes when it runs. Left out
  # of the generated file while at these defaults.
  cpuControlPlane:
    rollingUpdate:
      mode: rolling
      waitIntervalSeconds: 1800
    # Two sites in one account and Region need names of their own.
    rollbackAlarms:
      capacity: gpu-fault-cpu-roll-api-capacity
      notRestored: gpu-fault-cpu-roll-api-not-restored
