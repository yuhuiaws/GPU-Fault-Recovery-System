apiVersion: gpu-fault.aws/v1alpha1
kind: AdminConfig
spec:
  # Only fields declared in this template are supported administrator inputs.
  # Omitted fields keep their current persisted value.
  capacity:
    controlWorkerReplicas: 6
    # Declared topology. maxClusterQueueDepth must be >= 4 x largest,
    # aurora.minAcu >= managed / 100 (rounded up to 0.5); the fault reserve
    # is derived as max(depth / 8, largest).
    largestClusterNodeCount: 512
    managedNodeCount: 512
    telemetrySpool:
      enabled: false
      replicas: 0
    remediation:
      maxActiveRegion: 20
      maxActivePerCluster: 5
      maxActivePerResourceClass: 2
  aurora:
    minAcu: 8
    maxAcu: 32
  processor:
    maxQueueDepth: 65536
    maxClusterQueueDepth: 4096
    retryAfterSeconds: 2
    retryBackoffSeconds: 1
    retryBackoffMaxSeconds: 30
    completedRetentionSeconds: 600
  workflow:
    pollIntervalSeconds: 5
    dispatcherWorkers: 8
  notificationDelivery:
    batchSize: 25
    maxAttempts: 8
  evidence:
    retentionHours: 24
    maxRecordsPerNode: 10000
