name: Release

on:
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: Successful main CI run ID; empty resolves by selected commit
        required: false
        type: string
  push:
    tags:
      - "v*"

permissions:
  actions: read
  contents: read
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: docker/setup-buildx-action@v3
      - uses: sigstore/cosign-installer@v3
      - name: Resolve trusted CI run
        id: ci-run
        env:
          GITHUB_TOKEN: ${{ github.token }}
          INPUT_RUN_ID: ${{ inputs.ci_run_id }}
        run: |
          if [ -n "${INPUT_RUN_ID}" ]; then
            run_id="${INPUT_RUN_ID}"
          else
            run_id="$(
              python scripts/resolve_ci_run.py \
                --commit "$(git rev-parse HEAD)"
            )"
          fi
          case "${run_id}" in
            *[!0-9]*|'') echo "CI run ID must be numeric" >&2; exit 2 ;;
          esac
          printf 'run_id=%s\n' "${run_id}" >> "${GITHUB_OUTPUT}"
      - name: Download trusted CI candidate
        uses: actions/download-artifact@v4
        with:
          name: gpu-fault-ci-candidate
          path: dist
          github-token: ${{ github.token }}
          run-id: ${{ steps.ci-run.outputs.run_id }}
      - name: Verify CI gate signature
        run: >-
          cosign verify-blob
          --bundle dist/ci-gate.bundle.json
          --certificate-identity
          "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/ci.yml@refs/heads/main"
          --certificate-oidc-issuer
          "https://token.actions.githubusercontent.com"
          dist/ci-gate.json
      - name: Verify candidate source and artifacts
        run: python scripts/ci_gate.py verify --gate dist/ci-gate.json --dist dist
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.RELEASE_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
      - run: python -m pip install --upgrade pip
      - run: >-
          python -m pip install --require-hashes
          --requirement requirements/build.lock
      - run: >-
          python -m pip install
          '.[dev,collectors,postgres,performance]'
      - name: Select immutable runtime repository
        env:
          REPOSITORY: ${{ vars.RUNTIME_IMAGE_REPOSITORY }}
          CACHE_REPOSITORY: ${{ vars.RUNTIME_IMAGE_CACHE_REPOSITORY }}
        run: |
          test -n "${REPOSITORY}"
          case "${REPOSITORY}" in
            *.dkr.ecr.*.amazonaws.com/*) ;;
            *) echo "RUNTIME_IMAGE_REPOSITORY must be an ECR URI" >&2; exit 2 ;;
          esac
          printf 'RUNTIME_IMAGE_REPOSITORY=%s\n' "${REPOSITORY}" >> "${GITHUB_ENV}"
          if [ -n "${CACHE_REPOSITORY}" ]; then
            case "${CACHE_REPOSITORY}" in
              *.dkr.ecr.*.amazonaws.com/*) ;;
              *) echo "RUNTIME_IMAGE_CACHE_REPOSITORY must be an ECR URI" >&2; exit 2 ;;
            esac
            printf 'RUNTIME_IMAGE_CACHE_FROM=type=registry,ref=%s:buildcache-linux-amd64\n' \
              "${CACHE_REPOSITORY}" >> "${GITHUB_ENV}"
            printf 'RUNTIME_IMAGE_CACHE_TO=type=registry,ref=%s:buildcache-linux-amd64,mode=max,image-manifest=true,oci-mediatypes=true\n' \
              "${CACHE_REPOSITORY}" >> "${GITHUB_ENV}"
          fi
      - name: Promote tested candidate to signed release
        run: >-
          make release-build-promoted
          PYTHON=python
          CI_GATE=dist/ci-gate.json
      - name: Sign prebuilt deployment-host bundle
        run: make deploy-host-sign PYTHON=python
      - name: Upload signed release bundle
        uses: actions/upload-artifact@v4
        with:
          name: gpu-fault-release
          path: dist/
          if-no-files-found: error
          retention-days: 30
