name: Release

on:
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: Successful main CI run ID; empty resolves by selected commit
        required: false
        type: string
  push:
    tags:
      - "v*"

permissions:
  actions: read
  contents: read
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
      - name: Resolve trusted CI run
        id: ci-run
        env:
          GITHUB_TOKEN: ${{ github.token }}
          INPUT_RUN_ID: ${{ inputs.ci_run_id }}
        run: |
          if [ -n "${INPUT_RUN_ID}" ]; then
            run_id="${INPUT_RUN_ID}"
          else
            run_id="$(
              python scripts/resolve_ci_run.py \
                --commit "$(git rev-parse HEAD)"
            )"
          fi
          case "${run_id}" in
            *[!0-9]*|'') echo "CI run ID must be numeric" >&2; exit 2 ;;
          esac
          printf 'run_id=%s\n' "${run_id}" >> "${GITHUB_OUTPUT}"
      - name: Download trusted CI candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: gpu-fault-ci-candidate
          path: dist
          github-token: ${{ github.token }}
          run-id: ${{ steps.ci-run.outputs.run_id }}
      - name: Verify CI gate signature
        run: >-
          cosign verify-blob
          --bundle dist/ci-gate.bundle.json
          --certificate-identity
          "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/ci.yml@refs/heads/main"
          --certificate-oidc-issuer
          "https://token.actions.githubusercontent.com"
          dist/ci-gate.json
      - name: Verify candidate source and artifacts
        run: python scripts/ci_gate.py verify --gate dist/ci-gate.json --dist dist
      - name: Verify promoted unit domain signature
        run: >-
          cosign verify-blob
          --bundle dist/ci-domains/unit/unit-gate.bundle.json
          --certificate-identity
          "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/ci.yml@refs/heads/main"
          --certificate-oidc-issuer
          "https://token.actions.githubusercontent.com"
          dist/ci-domains/unit/unit-gate.json
      - name: Verify promoted coverage shard signatures
        run: |
          while IFS= read -r -d '' gate; do
            root="$(dirname "${gate}")"
            cosign verify-blob \
              --bundle "${root}/coverage-shard-gate.bundle.json" \
              --certificate-identity \
              "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/ci.yml@refs/heads/main" \
              --certificate-oidc-issuer \
              "https://token.actions.githubusercontent.com" \
              "${gate}"
          done < <(find dist/ci-domains/unit/shards \
            -name coverage-shard-gate.json -print0)
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ vars.RELEASE_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2
      - run: python -m pip install --upgrade pip
      - run: >-
          python -m pip install --require-hashes
          --requirement requirements/build.lock
      - run: >-
          python -m pip install
          '.[dev,collectors,postgres,performance]'
      - name: Select immutable runtime repository
        env:
          REPOSITORY: ${{ vars.RUNTIME_IMAGE_REPOSITORY }}
          CACHE_REPOSITORY: ${{ vars.RUNTIME_IMAGE_CACHE_REPOSITORY }}
        run: |
          test -n "${REPOSITORY}"
          case "${REPOSITORY}" in
            *.dkr.ecr.*.amazonaws.com/*) ;;
            *) echo "RUNTIME_IMAGE_REPOSITORY must be an ECR URI" >&2; exit 2 ;;
          esac
          printf 'RUNTIME_IMAGE_REPOSITORY=%s\n' "${REPOSITORY}" >> "${GITHUB_ENV}"
          if [ -n "${CACHE_REPOSITORY}" ]; then
            case "${CACHE_REPOSITORY}" in
              *.dkr.ecr.*.amazonaws.com/*) ;;
              *) echo "RUNTIME_IMAGE_CACHE_REPOSITORY must be an ECR URI" >&2; exit 2 ;;
            esac
            printf 'RUNTIME_IMAGE_CACHE_FROM=type=registry,ref=%s:buildcache-linux-amd64\n' \
              "${CACHE_REPOSITORY}" >> "${GITHUB_ENV}"
            printf 'RUNTIME_IMAGE_CACHE_TO=type=registry,ref=%s:buildcache-linux-amd64,mode=max,image-manifest=true,oci-mediatypes=true\n' \
              "${CACHE_REPOSITORY}" >> "${GITHUB_ENV}"
          fi
      - name: Install pinned supply-chain tools for the SBOM
        run: make ci-supply-chain-tools PYTHON=python
      - name: Promote tested candidate to signed release
        run: >-
          make release-build-promoted
          PYTHON=python
          CI_GATE=dist/ci-gate.json
      - name: Sign prebuilt deployment-host bundle
        run: make deploy-host-sign PYTHON=python
      - name: Upload signed release bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gpu-fault-release
          path: dist/
          if-no-files-found: error
          retention-days: 30
