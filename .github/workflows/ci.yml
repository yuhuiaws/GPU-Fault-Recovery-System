name: CI

on:
  pull_request:
  push:
    branches:
      - main

# Least-privilege default: every job may read the checkout and nothing more.
# The OIDC token mint (id-token: write) and the cross-run Actions API read
# (actions: read) are granted per job, only to the jobs that keyless-sign or
# restore a signed shard from a prior run.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  static:
    runs-on: ubuntu-latest
    env:
      PYTHONPYCACHEPREFIX: /tmp/gpu-fault-pycache
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: >-
          python -m pip install --require-hashes
          --requirement requirements/build.lock
      - run: >-
          python -m pip install
          '.[dev,collectors,postgres,performance]'
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - run: python -m ruff format --check src tests deploy scripts tools
      - run: python -m ruff check src tests deploy scripts tools
      - run: python -m ruff check --select I tests
      - run: python scripts/check-mypy-baseline.py
      - run: python scripts/check-mixin-contracts.py
      - run: python scripts/check-test-private-coupling.py
      - run: python scripts/check-test-source-assertions.py
      - run: python scripts/check-assert-messages.py
      - run: python scripts/check-public-release.py
      - run: python -m compileall -q src tests deploy scripts tools
      - run: python scripts/check-python-architecture.py
      - run: make lazy-export-check PYTHON=python
      - run: make grafana-dashboards-check PYTHON=python
      - run: >-
          PYTHON=python
          deploy/control-plane/tools/update-deployment-contracts.sh --check
      - run: python scripts/check-deploy-layout.py
      - run: python scripts/check-artifacts.py
      - run: >-
          python -m yamllint --strict -c .yamllint
          deploy examples testcases config scripts/e2e scripts/perf
      - run: >-
          find deploy scripts tools -type f -name '*.sh' -print0 |
          sort -z |
          xargs -0 -n1 bash -n
      - run: >-
          find deploy scripts tools -type f -name '*.sh' -print0 |
          sort -z |
          xargs -0 shellcheck --severity=info
      # Supply-chain gates (S8/S10). Tool versions come from the Makefile; the
      # targets are strict here because GitHub sets CI=true.
      - run: make ci-supply-chain-tools PYTHON=python
      - run: make cfn-lint-check PYTHON=python
      - run: make promtool-check PYTHON=python
      - run: make pip-audit-check PYTHON=python
      - run: >-
          PYTHONPATH=src
          python tools/generate_nvidia_xid_policy.py --check
      - run: make ci-tooling-check PYTHON=python
      - run: make docs-check
      - name: Check pull-request documentation impact
        if: github.event_name == 'pull_request'
        run: >-
          python scripts/check-doc-impact.py
          --base "${{ github.event.pull_request.base.sha }}"
          --head HEAD
          --event-path "${GITHUB_EVENT_PATH}"
      - run: >-
          python -m gpu_fault.config_cli validate
          deploy/control-plane/regional/generated

  coverage:
    name: coverage-${{ matrix.shard }}
    runs-on: ${{ vars.CI_TEST_RUNNER || 'ubuntu-latest' }}
    # actions: read lets the push-only restore step read the Actions artifacts
    # API of a prior run; id-token: write mints the OIDC token cosign signs the
    # shard gate with.
    permissions:
      actions: read
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        shard:
          - runtime_0
          - runtime_1
          - runtime_2
          - deployment
          - fault_runner
    env:
      CI_TEST_RUNNER_LABEL: ${{ vars.CI_TEST_RUNNER || 'ubuntu-latest' }}
      PYTEST_DURATIONS: "50"
      PYTEST_XDIST_DIST: worksteal
      PYTEST_XDIST_WORKERS: ${{ vars.CI_PYTEST_WORKERS || '4' }}
      PYTHONPYCACHEPREFIX: /tmp/gpu-fault-pycache
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: >-
          python -m pip install --require-hashes
          --requirement requirements/build.lock
      - run: >-
          python -m pip install
          '.[dev,collectors,postgres,performance]'
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
        if: github.event_name == 'push'
      - name: Restore signed coverage shard
        id: restore_shard
        if: github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python scripts/ci_coverage_gate.py restore
          --shard "${{ matrix.shard }}"
          --destination artifacts/coverage-shard
          --current-run-id "${GITHUB_RUN_ID}"
          --github-output "${GITHUB_OUTPUT}"
      - name: Run coverage shard with duration evidence
        if: >-
          github.event_name != 'push' ||
          steps.restore_shard.outputs.reused != 'true'
        run: >-
          make coverage-shard PYTHON=python
          COVERAGE_SHARD="${{ matrix.shard }}"
          COVERAGE_SHARD_ROOT=artifacts/coverage-shard
      - name: Verify reused coverage shard signature
        if: >-
          github.event_name == 'push' &&
          steps.restore_shard.outputs.reused == 'true'
        run: >-
          cosign verify-blob
          --bundle
          artifacts/coverage-shard/base-coverage-shard-gate.bundle.json
          --certificate-identity
          "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/ci.yml@refs/heads/main"
          --certificate-oidc-issuer
          "https://token.actions.githubusercontent.com"
          artifacts/coverage-shard/base-coverage-shard-gate.json
      - name: Build coverage shard gate
        id: build_shard
        run: >-
          python scripts/ci_coverage_gate.py build
          --shard "${{ matrix.shard }}"
          --artifact-root artifacts/coverage-shard
          --coverage-data artifacts/coverage-shard/coverage-data
          --pytest-results artifacts/coverage-shard/pytest-results.json
          --durations artifacts/coverage-shard/durations.json
          --github-output "${GITHUB_OUTPUT}"
      - name: Sign coverage shard gate
        if: github.event_name == 'push'
        run: >-
          cosign sign-blob --yes
          --bundle artifacts/coverage-shard/coverage-shard-gate.bundle.json
          artifacts/coverage-shard/coverage-shard-gate.json
      - name: Verify coverage shard signature
        if: github.event_name == 'push'
        run: >-
          cosign verify-blob
          --bundle artifacts/coverage-shard/coverage-shard-gate.bundle.json
          --certificate-identity
          "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/ci.yml@refs/heads/main"
          --certificate-oidc-issuer
          "https://token.actions.githubusercontent.com"
          artifacts/coverage-shard/coverage-shard-gate.json
      - name: Verify coverage shard content identity
        run: >-
          python scripts/ci_coverage_gate.py verify
          --shard "${{ matrix.shard }}"
          --artifact-root artifacts/coverage-shard
          --gate artifacts/coverage-shard/coverage-shard-gate.json
      - name: Upload coverage shard
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.build_shard.outputs.artifact_name }}
          path: artifacts/coverage-shard/
          if-no-files-found: error
          retention-days: 30

  postgres:
    name: coverage-postgres
    runs-on: ${{ vars.CI_TEST_RUNNER || 'ubuntu-latest' }}
    # actions: read lets the push-only restore step read the Actions artifacts
    # API of a prior run; id-token: write mints the OIDC token cosign signs the
    # shard gate with.
    permissions:
      actions: read
      contents: read
      id-token: write
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gpu_fault
          POSTGRES_PASSWORD: gpu_fault
          POSTGRES_DB: gpu_fault_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gpu_fault -d gpu_fault_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      CI_TEST_RUNNER_LABEL: ${{ vars.CI_TEST_RUNNER || 'ubuntu-latest' }}
      GPU_FAULT_TEST_POSTGRES_URL: >-
        postgresql://gpu_fault:gpu_fault@127.0.0.1:5432/gpu_fault_test
      PYTEST_DURATIONS: "50"
      PYTEST_XDIST_DIST: worksteal
      PYTEST_XDIST_WORKERS: ${{ vars.CI_PYTEST_WORKERS || '4' }}
      PYTHONPYCACHEPREFIX: /tmp/gpu-fault-pycache
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: >-
          python -m pip install --require-hashes
          --requirement requirements/build.lock
      - run: >-
          python -m pip install
          '.[dev,collectors,postgres,performance]'
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
        if: github.event_name == 'push'
      - name: Restore signed PostgreSQL coverage shard
        id: restore_shard
        if: github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python scripts/ci_coverage_gate.py restore
          --shard postgres
          --postgres-container "${{ job.services.postgres.id }}"
          --destination artifacts/coverage-shard
          --current-run-id "${GITHUB_RUN_ID}"
          --github-output "${GITHUB_OUTPUT}"
      - name: Run PostgreSQL coverage and stress shard
        if: >-
          github.event_name != 'push' ||
          steps.restore_shard.outputs.reused != 'true'
        run: >-
          make coverage-shard PYTHON=python
          COVERAGE_SHARD=postgres
          COVERAGE_SHARD_ROOT=artifacts/coverage-shard
          COVERAGE_INCLUDE_STRESS=1
      - name: Verify reused PostgreSQL shard signature
        if: >-
          github.event_name == 'push' &&
          steps.restore_shard.outputs.reused == 'true'
        run: >-
          cosign verify-blob
          --bundle
          artifacts/coverage-shard/base-coverage-shard-gate.bundle.json
          --certificate-identity
          "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/ci.yml@refs/heads/main"
          --certificate-oidc-issuer
          "https://token.actions.githubusercontent.com"
          artifacts/coverage-shard/base-coverage-shard-gate.json
      - name: Build PostgreSQL coverage shard gate
        id: build_shard
        run: >-
          python scripts/ci_coverage_gate.py build
          --shard postgres
          --postgres-container "${{ job.services.postgres.id }}"
          --artifact-root artifacts/coverage-shard
          --coverage-data artifacts/coverage-shard/coverage-data
          --pytest-results artifacts/coverage-shard/pytest-results.json
          --durations artifacts/coverage-shard/durations.json
          --stress-results
          artifacts/coverage-shard/postgres-stress-results.json
          --github-output "${GITHUB_OUTPUT}"
      - name: Sign PostgreSQL coverage shard gate
        if: github.event_name == 'push'
        run: >-
          cosign sign-blob --yes
          --bundle artifacts/coverage-shard/coverage-shard-gate.bundle.json
          artifacts/coverage-shard/coverage-shard-gate.json
      - name: Verify PostgreSQL coverage shard signature
        if: github.event_name == 'push'
        run: >-
          cosign verify-blob
          --bundle artifacts/coverage-shard/coverage-shard-gate.bundle.json
          --certificate-identity
          "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/ci.yml@refs/heads/main"
          --certificate-oidc-issuer
          "https://token.actions.githubusercontent.com"
          artifacts/coverage-shard/coverage-shard-gate.json
      - name: Verify PostgreSQL coverage shard content identity
        run: >-
          python scripts/ci_coverage_gate.py verify
          --shard postgres
          --postgres-container "${{ job.services.postgres.id }}"
          --artifact-root artifacts/coverage-shard
          --gate artifacts/coverage-shard/coverage-shard-gate.json
      - name: Upload PostgreSQL coverage shard
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.build_shard.outputs.artifact_name }}
          path: artifacts/coverage-shard/
          if-no-files-found: error
          retention-days: 30

  unit:
    needs:
      - coverage
      - postgres
    runs-on: ubuntu-latest
    # id-token: write mints the OIDC token cosign signs the unit domain gate
    # with; artifacts are downloaded from this same run, so no actions: read.
    permissions:
      contents: read
      id-token: write
    outputs:
      unit_gate_artifact: ${{ steps.build_unit_gate.outputs.artifact_name }}
      unit_gate_identity: ${{ steps.build_unit_gate.outputs.identity }}
      unit_gate_reused: ${{ steps.build_unit_gate.outputs.reused }}
    env:
      PYTHONPYCACHEPREFIX: /tmp/gpu-fault-pycache
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: >-
          python -m pip install --require-hashes
          --requirement requirements/build.lock
      - run: >-
          python -m pip install
          '.[dev,collectors,postgres,performance]'
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
        if: github.event_name == 'push'
      - name: Download coverage shards
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: gpu-fault-coverage-*
          path: artifacts/coverage-shards
      - name: Verify coverage shard signatures
        if: github.event_name == 'push'
        run: |
          while IFS= read -r -d '' gate; do
            root="$(dirname "${gate}")"
            cosign verify-blob \
              --bundle "${root}/coverage-shard-gate.bundle.json" \
              --certificate-identity \
              "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/ci.yml@refs/heads/main" \
              --certificate-oidc-issuer \
              "https://token.actions.githubusercontent.com" \
              "${gate}"
          done < <(find artifacts/coverage-shards \
            -name coverage-shard-gate.json -print0)
      - name: Combine branch coverage and enforce floor
        run: >-
          make coverage-combine PYTHON=python
          COVERAGE_SHARDS_ROOT=artifacts/coverage-shards
          COVERAGE_COMBINED_ROOT=artifacts/coverage-combined
      - name: Build fault report from combined pytest results
        run: >-
          make fault-test-cases-ci PYTHON=python
          FAULT_TEST_PYTEST_RESULTS=artifacts/coverage-combined/pytest-case-results.json
          FAULT_TEST_REPORT=artifacts/coverage-combined/fault-report.json
      - name: Build unit domain gate
        id: build_unit_gate
        if: github.event_name == 'push'
        run: >-
          python scripts/ci_unit_gate.py build
          --artifact-root artifacts/ci-unit-gate
          --shards-root artifacts/coverage-shards
          --coverage-summary artifacts/coverage-combined/coverage.json
          --pytest-results
          artifacts/coverage-combined/pytest-case-results.json
          --fault-report artifacts/coverage-combined/fault-report.json
          --durations artifacts/coverage-combined/test-durations.json
          --require-run-id "${GITHUB_RUN_ID}"
          --github-output "${GITHUB_OUTPUT}"
      - name: Sign unit domain gate
        if: github.event_name == 'push'
        run: >-
          cosign sign-blob --yes
          --bundle artifacts/ci-unit-gate/unit-gate.bundle.json
          artifacts/ci-unit-gate/unit-gate.json
      - name: Verify unit domain gate signature
        if: github.event_name == 'push'
        run: >-
          cosign verify-blob
          --bundle artifacts/ci-unit-gate/unit-gate.bundle.json
          --certificate-identity
          "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/ci.yml@refs/heads/main"
          --certificate-oidc-issuer
          "https://token.actions.githubusercontent.com"
          artifacts/ci-unit-gate/unit-gate.json
      - name: Verify embedded coverage shard signatures
        if: github.event_name == 'push'
        run: |
          while IFS= read -r -d '' gate; do
            root="$(dirname "${gate}")"
            cosign verify-blob \
              --bundle "${root}/coverage-shard-gate.bundle.json" \
              --certificate-identity \
              "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/ci.yml@refs/heads/main" \
              --certificate-oidc-issuer \
              "https://token.actions.githubusercontent.com" \
              "${gate}"
          done < <(find artifacts/ci-unit-gate/shards \
            -name coverage-shard-gate.json -print0)
      - name: Verify unit domain content identity
        if: github.event_name == 'push'
        run: >-
          python scripts/ci_unit_gate.py verify
          --expected-identity
          "${{ steps.build_unit_gate.outputs.identity }}"
          --artifact-root artifacts/ci-unit-gate
          --gate artifacts/ci-unit-gate/unit-gate.json
      - name: Upload signed unit domain gate
        if: github.event_name == 'push'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.build_unit_gate.outputs.artifact_name }}
          path: artifacts/ci-unit-gate/
          if-no-files-found: error
          retention-days: 30
      - name: Upload coverage timing evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-evidence
          path: |
            artifacts/coverage-combined/coverage.json
            artifacts/coverage-combined/test-durations.json
          if-no-files-found: error
          retention-days: 30
      - name: Upload fault test report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fault-test-report
          path: artifacts/coverage-combined/fault-report.json
          if-no-files-found: error
          retention-days: 30

  # Every other test job runs the suite in the same order: fixed shards, and a
  # worksteal distribution that always starts from the same collection. A test
  # that quietly depends on another one having run first (module-level cache,
  # lru_cache, in-process singleton, a global someone else monkeypatched) stays
  # green in that order forever and only fails the day an unrelated test is
  # added. This job is the only thing that looks.
  shuffle:
    name: shuffled-order
    runs-on: ${{ vars.CI_TEST_RUNNER || 'ubuntu-latest' }}
    env:
      # Seeded from the run id rather than from chance, so re-running this
      # workflow reproduces the same order and a failure can be triaged instead
      # of merely observed. A different push gets a different order.
      GPU_FAULT_TEST_SHUFFLE_SEED: ${{ github.run_id }}
      PYTEST_DURATIONS: "50"
      PYTEST_XDIST_DIST: worksteal
      PYTEST_XDIST_WORKERS: ${{ vars.CI_PYTEST_WORKERS || '4' }}
      PYTHONPYCACHEPREFIX: /tmp/gpu-fault-pycache
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: >-
          python -m pip install --require-hashes
          --requirement requirements/build.lock
      - run: >-
          python -m pip install
          '.[dev,collectors,postgres,performance]'
      - run: make test-shuffled PYTHON=python

  artifact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: >-
          python -m pip install --require-hashes
          --requirement requirements/build.lock
      - run: >-
          python -m pip install
          '.[dev,collectors,postgres,performance]'
      - name: Cache deployment-host wheelhouse
        if: github.event_name == 'push'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .cache/deploy-host-wheelhouse
          key: deploy-host-wheelhouse-${{ runner.os }}-${{ runner.arch }}-py312-${{ hashFiles('requirements/build.lock', 'requirements/deploy-host.lock') }}
      - run: make artifact-check PYTHON=python
      - name: Build unsigned deployment-host bundle
        if: github.event_name == 'push'
        run: |
          platform="$(python -c 'from scripts.deploy_host_bundle import bundle_platform_id; print(bundle_platform_id())')"
          python scripts/build-deploy-host-bundle.py \
            --python python \
            --wheelhouse .cache/deploy-host-wheelhouse \
            --output "dist/gpu-fault-deploy-host-${platform}.tar.gz"
      - name: Upload component candidate
        if: github.event_name == 'push'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gpu-fault-component-artifacts
          path: dist/
          if-no-files-found: error
          retention-days: 30

  test:
    if: always()
    needs:
      - static
      - unit
      - shuffle
      - artifact
    runs-on: ubuntu-latest
    # id-token: write mints the OIDC token cosign signs the final CI gate with.
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Require all CI gates
        run: |
          test "${{ needs.static.result }}" = "success"
          test "${{ needs.unit.result }}" = "success"
          test "${{ needs.shuffle.result }}" = "success"
          test "${{ needs.artifact.result }}" = "success"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: github.event_name == 'push'
        with:
          fetch-depth: 0
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
        if: github.event_name == 'push'
      - name: Download component candidate
        if: github.event_name == 'push'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: gpu-fault-component-artifacts
          path: dist
      - name: Download signed unit domain gate
        if: github.event_name == 'push'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ needs.unit.outputs.unit_gate_artifact }}
          path: dist/ci-domains/unit
      - name: Verify unit domain gate signature
        if: github.event_name == 'push'
        run: >-
          cosign verify-blob
          --bundle dist/ci-domains/unit/unit-gate.bundle.json
          --certificate-identity
          "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/ci.yml@refs/heads/main"
          --certificate-oidc-issuer
          "https://token.actions.githubusercontent.com"
          dist/ci-domains/unit/unit-gate.json
      - name: Verify embedded coverage shard signatures
        if: github.event_name == 'push'
        run: |
          while IFS= read -r -d '' gate; do
            root="$(dirname "${gate}")"
            cosign verify-blob \
              --bundle "${root}/coverage-shard-gate.bundle.json" \
              --certificate-identity \
              "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/ci.yml@refs/heads/main" \
              --certificate-oidc-issuer \
              "https://token.actions.githubusercontent.com" \
              "${gate}"
          done < <(find dist/ci-domains/unit/shards \
            -name coverage-shard-gate.json -print0)
      - name: Verify unit domain gate identity
        if: github.event_name == 'push'
        run: >-
          python scripts/ci_unit_gate.py verify
          --expected-identity "${{ needs.unit.outputs.unit_gate_identity }}"
          --artifact-root dist/ci-domains/unit
          --gate dist/ci-domains/unit/unit-gate.json
      - name: Build CI gate
        if: github.event_name == 'push'
        run: >-
          python scripts/ci_gate.py build
          --dist dist
          --unit-gate dist/ci-domains/unit/unit-gate.json
          --output dist/ci-gate.json
      - name: Sign CI gate
        if: github.event_name == 'push'
        run: >-
          cosign sign-blob --yes
          --bundle dist/ci-gate.bundle.json
          dist/ci-gate.json
      - name: Upload trusted CI candidate
        if: github.event_name == 'push'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gpu-fault-ci-candidate
          path: dist/
          if-no-files-found: error
          retention-days: 30
