apiVersion: v1
kind: Pod
metadata:
  name: gpu-fault-cross-outside-xid79-node00
  namespace: gpu-fault-system
  labels:
    gpu-fault.io/test-case: cross-fault-outside-window
spec:
  nodeSelector:
    gpu-fault.io/e2e-target-a: "true"
  restartPolicy: Never
  tolerations:
    - key: gpu-fault.io/quarantined
      operator: Exists
      effect: NoSchedule
  containers:
    - name: injector
      resources:
        requests:
          cpu: "10m"
          memory: 32Mi
        limits:
          cpu: "200m"
          memory: 128Mi
      image: public.ecr.aws/docker/library/busybox:1.36
      command: ["/bin/sh", "-c"]
      args:
        - |
          set -eu
          date -u +"xid79_written_at=%Y-%m-%dT%H:%M:%SZ"
          printf '%s\n' \
            'NVRM: Xid (PCI:0000:59:00): 79, pid=5252, name=python, GPU has fallen off the bus' \
            > /host-dev-kmsg
      securityContext:
        privileged: true
      volumeMounts:
        - name: dev-kmsg
          mountPath: /host-dev-kmsg
  volumes:
    - name: dev-kmsg
      hostPath:
        path: /dev/kmsg
        type: CharDevice
