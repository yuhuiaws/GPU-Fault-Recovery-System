apiVersion: v1
kind: Pod
metadata:
  name: gpu-fault-kmsg-inject-xid74-live-20260725
  namespace: gpu-fault-system
spec:
  nodeSelector:
    gpu-fault.io/e2e-target-a: "true"
  restartPolicy: Never
  containers:
    - name: inject
      resources:
        requests:
          cpu: "10m"
          memory: 32Mi
        limits:
          cpu: "200m"
          memory: 128Mi
      image: public.ecr.aws/docker/library/busybox:1.36
      command: ["/bin/sh", "-c"]
      args:
        - >-
          printf "%s\n"
          "NVRM: Xid (PCI:0000:5A:00): 74, pid=1234, name=python, 0x100 0x0 0x0 0x0 0x0 0x0 0x0"
          > /host-dev-kmsg
          && echo written
      securityContext:
        privileged: true
      volumeMounts:
        - name: dev-kmsg
          mountPath: /host-dev-kmsg
  volumes:
    - name: dev-kmsg
      hostPath:
        path: /dev/kmsg
        type: CharDevice
