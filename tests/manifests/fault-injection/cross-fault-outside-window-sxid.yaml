apiVersion: v1
kind: Pod
metadata:
  name: gpu-fault-cross-outside-sxid10003-node05
  namespace: gpu-fault-system
  labels:
    gpu-fault.io/test-case: cross-fault-outside-window
spec:
  nodeSelector:
    gpu-fault.io/e2e-target-b: "true"
  restartPolicy: Never
  containers:
    - name: injector
      resources:
        requests:
          cpu: "10m"
          memory: 32Mi
        limits:
          cpu: "200m"
          memory: 128Mi
      image: public.ecr.aws/docker/library/busybox:1.36
      command: ["/bin/sh", "-c"]
      args:
        - |
          set -eu
          date -u +"sxid10003_written_at=%Y-%m-%dT%H:%M:%SZ"
          printf '%s\n' \
            'nvidia-nvswitch3: SXid (PCI:0000:c1:00.0): 10003, Fatal, Link 46 Host_unhandled_interrupt' \
            >> /host-fabricmanager-log
      securityContext:
        privileged: true
      volumeMounts:
        - name: fabricmanager-log
          mountPath: /host-fabricmanager-log
  volumes:
    - name: fabricmanager-log
      hostPath:
        path: /var/log/fabricmanager.log
        type: File
