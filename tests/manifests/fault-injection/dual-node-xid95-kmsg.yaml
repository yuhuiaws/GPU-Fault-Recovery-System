apiVersion: v1
kind: Pod
metadata:
  name: gpu-fault-inject-xid95-node00
  namespace: gpu-fault-system
spec:
  nodeSelector:
    gpu-fault.io/e2e-target-a: "true"
  restartPolicy: Never
  hostPID: true
  containers:
    - name: injector
      resources:
        requests:
          cpu: "10m"
          memory: 32Mi
        limits:
          cpu: "200m"
          memory: 128Mi
      image: public.ecr.aws/docker/library/python:3.12-slim
      securityContext:
        privileged: true
      command:
        - /bin/sh
        - -c
        - |
          sleep 10
          printf '%s\n' '<3>NVRM: Xid (PCI:0000:59:00): 95' > /host/dev/kmsg
      volumeMounts:
        - name: host-dev
          mountPath: /host/dev
  volumes:
    - name: host-dev
      hostPath:
        path: /dev
        type: Directory
---
