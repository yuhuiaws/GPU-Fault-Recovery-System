apiVersion: v1
kind: Pod
metadata:
  name: gpu-fault-kmsg-inject-xid79-reboot-resume-0723
  namespace: gpu-fault-system
spec:
  nodeSelector:
    gpu-fault.io/e2e-target-b: "true"
  restartPolicy: Never
  tolerations:
    - key: node.kubernetes.io/not-ready
      operator: Exists
      effect: NoExecute
      tolerationSeconds: 300
    - key: node.kubernetes.io/unreachable
      operator: Exists
      effect: NoExecute
      tolerationSeconds: 300
  containers:
    - name: inject
      resources:
        requests:
          cpu: "10m"
          memory: 32Mi
        limits:
          cpu: "200m"
          memory: 128Mi
      image: public.ecr.aws/docker/library/busybox:1.36
      command:
        - /bin/sh
        - -c
      args:
        - >-
          printf "%s\n"
          "NVRM: Xid (PCI:0000:59:00): 79, pid=5252, name=python, GPU has fallen off the bus"
          > /host-dev-kmsg
          && echo written
      securityContext:
        privileged: true
      volumeMounts:
        - name: dev-kmsg
          mountPath: /host-dev-kmsg
  volumes:
    - name: dev-kmsg
      hostPath:
        path: /dev/kmsg
        type: CharDevice
