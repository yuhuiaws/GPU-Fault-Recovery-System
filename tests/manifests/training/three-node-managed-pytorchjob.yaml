# ANNOTATED MANIFEST: already enrolled for the documented acceptance workflow.
# Apply directly only when that workflow calls for this exact managed fixture.
# Resource profile assumes p5en-class nodes with 8 GPUs and 16 EFA devices per Pod.
apiVersion: kubeflow.org/v1
kind: PyTorchJob
metadata:
  name: gpu-fault-three-node-pytorch
  namespace: gpu-fault-system
  labels:
    gpu-fault.io/managed: 'true'
    gpu-fault.io/job-id: gpu-fault-three-node-managed
    gpu-fault.io/attempt-id: gpu-fault-three-node-managed-a001
  annotations: {}
spec:
  runPolicy:
    cleanPodPolicy: None
  pytorchReplicaSpecs:
    Master:
      replicas: 1
      restartPolicy: Never
      template:
        metadata:
          labels:
            app: gpu-fault-three-node-pytorch
            gpu-fault.io/managed: 'true'
            gpu-fault.io/job-id: gpu-fault-three-node-managed
            gpu-fault.io/attempt-id: gpu-fault-three-node-managed-a001
            gpu-fault.io/role: master
            gpu-fault.io/critical: 'true'
          annotations:
            gpu-fault.io/expected-critical-ranks: '3'
            gpu-fault.io/training-container: pytorch
            gpu-fault.io/runtime-profile-version: hyperpod-v1
            gpu-fault.io/rank-offset: '0'
            gpu-fault.io/restart-budget: '1'
        spec:
          restartPolicy: Never
          affinity:
            podAntiAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
              - labelSelector:
                  matchLabels:
                    app: gpu-fault-three-node-pytorch
                topologyKey: kubernetes.io/hostname
          volumes:
          - name: dshm
            emptyDir:
              medium: Memory
              sizeLimit: 8Gi
          containers:
          - name: pytorch
            image: public.ecr.aws/deep-learning-containers/pytorch-training@sha256:ff2c928a2e7b3b290b7c3e353085a373b3cfc7f6b165e338b9be4df439feae38
            imagePullPolicy: IfNotPresent
            volumeMounts:
            - name: dshm
              mountPath: /dev/shm
            command:
            - /bin/bash
            - -lc
            - "cat >/tmp/three_node_train.py <<'PY'\nimport os\nimport socket\n\n\
              import torch\nimport torch.distributed as dist\nfrom torch.nn.parallel\
              \ import DistributedDataParallel\n\ndist.init_process_group(backend=\"\
              nccl\")\nrank = dist.get_rank()\nworld_size = dist.get_world_size()\n\
              local_rank = int(os.environ[\"LOCAL_RANK\"])\ntorch.cuda.set_device(local_rank)\n\
              \ndevice = torch.device(\"cuda\", local_rank)\ntotal = torch.tensor([rank\
              \ + 1.0], device=device)\ndist.all_reduce(total)\nexpected = world_size\
              \ * (world_size + 1) / 2\nassert total.item() == expected\n\ntorch.manual_seed(20260722)\n\
              model = torch.nn.Linear(16, 1).to(device)\nmodel = DistributedDataParallel(\n\
              \    model, device_ids=[local_rank]\n)\noptimizer = torch.optim.SGD(model.parameters(),\
              \ lr=0.01)\nfor step in range(3):\n    features = torch.ones(8, 16,\
              \ device=device)\n    target = torch.full((8, 1), 0.5, device=device)\n\
              \    optimizer.zero_grad()\n    loss = torch.nn.functional.mse_loss(\n\
              \        model(features), target\n    )\n    loss.backward()\n    optimizer.step()\n\
              \    print(\n        f\"rank={rank} step={step} \"\n        f\"loss={loss.item():.6f}\"\
              ,\n        flush=True,\n    )\n\ndist.barrier()\nprint(\n    f\"SUCCESS\
              \ rank={rank}/{world_size} \"\n    f\"node={socket.gethostname()} \"\
              \n    f\"all_reduce={total.item()}\",\n    flush=True,\n)\ndist.destroy_process_group()\n\
              PY\nexec torchrun \\\n  --nnodes=\"${WORLD_SIZE}\" \\\n  --nproc-per-node=8\
              \ \\\n  --node-rank=\"${RANK}\" \\\n  --master-addr=\"${MASTER_ADDR}\"\
              \ \\\n  --master-port=\"${MASTER_PORT}\" \\\n  /tmp/three_node_train.py\n"
            env:
            - name: NCCL_DEBUG
              value: INFO
            - name: TORCH_NCCL_TRACE_BUFFER_SIZE
              value: '20000'
            - name: TORCH_NCCL_DEBUG_INFO_PIPE_FILE
              value: /tmp/torch_nccl_debug_pipe_
            - name: TORCH_NCCL_DUMP_ON_TIMEOUT
              value: '1'
            - name: FI_PROVIDER
              value: efa
            - name: FI_EFA_USE_DEVICE_RDMA
              value: '1'
            - name: FI_EFA_FORK_SAFE
              value: '1'
            resources:
              requests:
                cpu: '8'
                memory: 32Gi
                nvidia.com/gpu: '8'
                vpc.amazonaws.com/efa: '16'
              limits:
                cpu: '16'
                memory: 64Gi
                nvidia.com/gpu: '8'
                vpc.amazonaws.com/efa: '16'
    Worker:
      replicas: 2
      restartPolicy: Never
      template:
        metadata:
          labels:
            app: gpu-fault-three-node-pytorch
            gpu-fault.io/managed: 'true'
            gpu-fault.io/job-id: gpu-fault-three-node-managed
            gpu-fault.io/attempt-id: gpu-fault-three-node-managed-a001
            gpu-fault.io/role: worker
            gpu-fault.io/critical: 'true'
          annotations:
            gpu-fault.io/expected-critical-ranks: '3'
            gpu-fault.io/training-container: pytorch
            gpu-fault.io/runtime-profile-version: hyperpod-v1
            gpu-fault.io/rank-offset: '1'
            gpu-fault.io/restart-budget: '1'
        spec:
          restartPolicy: Never
          affinity:
            podAntiAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
              - labelSelector:
                  matchLabels:
                    app: gpu-fault-three-node-pytorch
                topologyKey: kubernetes.io/hostname
          volumes:
          - name: dshm
            emptyDir:
              medium: Memory
              sizeLimit: 8Gi
          containers:
          - name: pytorch
            image: public.ecr.aws/deep-learning-containers/pytorch-training@sha256:ff2c928a2e7b3b290b7c3e353085a373b3cfc7f6b165e338b9be4df439feae38
            imagePullPolicy: IfNotPresent
            volumeMounts:
            - name: dshm
              mountPath: /dev/shm
            command:
            - /bin/bash
            - -lc
            - "cat >/tmp/three_node_train.py <<'PY'\nimport os\nimport socket\n\n\
              import torch\nimport torch.distributed as dist\nfrom torch.nn.parallel\
              \ import DistributedDataParallel\n\ndist.init_process_group(backend=\"\
              nccl\")\nrank = dist.get_rank()\nworld_size = dist.get_world_size()\n\
              local_rank = int(os.environ[\"LOCAL_RANK\"])\ntorch.cuda.set_device(local_rank)\n\
              \ndevice = torch.device(\"cuda\", local_rank)\ntotal = torch.tensor([rank\
              \ + 1.0], device=device)\ndist.all_reduce(total)\nexpected = world_size\
              \ * (world_size + 1) / 2\nassert total.item() == expected\n\ntorch.manual_seed(20260722)\n\
              model = torch.nn.Linear(16, 1).to(device)\nmodel = DistributedDataParallel(\n\
              \    model, device_ids=[local_rank]\n)\noptimizer = torch.optim.SGD(model.parameters(),\
              \ lr=0.01)\nfor step in range(3):\n    features = torch.ones(8, 16,\
              \ device=device)\n    target = torch.full((8, 1), 0.5, device=device)\n\
              \    optimizer.zero_grad()\n    loss = torch.nn.functional.mse_loss(\n\
              \        model(features), target\n    )\n    loss.backward()\n    optimizer.step()\n\
              \    print(\n        f\"rank={rank} step={step} \"\n        f\"loss={loss.item():.6f}\"\
              ,\n        flush=True,\n    )\n\ndist.barrier()\nprint(\n    f\"SUCCESS\
              \ rank={rank}/{world_size} \"\n    f\"node={socket.gethostname()} \"\
              \n    f\"all_reduce={total.item()}\",\n    flush=True,\n)\ndist.destroy_process_group()\n\
              PY\nexec torchrun \\\n  --nnodes=\"${WORLD_SIZE}\" \\\n  --nproc-per-node=8\
              \ \\\n  --node-rank=\"${RANK}\" \\\n  --master-addr=\"${MASTER_ADDR}\"\
              \ \\\n  --master-port=\"${MASTER_PORT}\" \\\n  /tmp/three_node_train.py\n"
            env:
            - name: NCCL_DEBUG
              value: INFO
            - name: TORCH_NCCL_TRACE_BUFFER_SIZE
              value: '20000'
            - name: TORCH_NCCL_DEBUG_INFO_PIPE_FILE
              value: /tmp/torch_nccl_debug_pipe_
            - name: TORCH_NCCL_DUMP_ON_TIMEOUT
              value: '1'
            - name: FI_PROVIDER
              value: efa
            - name: FI_EFA_USE_DEVICE_RDMA
              value: '1'
            - name: FI_EFA_FORK_SAFE
              value: '1'
            resources:
              requests:
                cpu: '8'
                memory: 32Gi
                nvidia.com/gpu: '8'
                vpc.amazonaws.com/efa: '16'
              limits:
                cpu: '16'
                memory: 64Gi
                nvidia.com/gpu: '8'
                vpc.amazonaws.com/efa: '16'
