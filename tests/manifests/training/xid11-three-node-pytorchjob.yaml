# SOURCE MANIFEST: run gpu-training-submit or gpu-fault-workload-annotate first.
# Direct kubectl apply starts training but does not enroll it in fault management.
# Long-running XID 11 fixture; assumes p5en-class 8-GPU/16-EFA Pods.
apiVersion: kubeflow.org/v1
kind: PyTorchJob
metadata:
  name: gpu-fault-xid11-three-node
  namespace: gpu-fault-system
spec:
  runPolicy:
    cleanPodPolicy: None
  pytorchReplicaSpecs:
    Master:
      replicas: 1
      restartPolicy: Never
      template:
        metadata:
          labels:
            app: gpu-fault-xid11-three-node
        spec:
          restartPolicy: Never
          affinity:
            podAntiAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchLabels:
                      app: gpu-fault-xid11-three-node
                  topologyKey: kubernetes.io/hostname
          volumes:
            - name: dshm
              emptyDir:
                medium: Memory
                sizeLimit: 8Gi
          containers:
            - name: pytorch
              image: public.ecr.aws/deep-learning-containers/pytorch-training@sha256:ff2c928a2e7b3b290b7c3e353085a373b3cfc7f6b165e338b9be4df439feae38
              imagePullPolicy: IfNotPresent
              volumeMounts:
                - name: dshm
                  mountPath: /dev/shm
              command:
                - /bin/bash
                - -lc
                - |
                  cat >/tmp/xid11_train.py <<'PY'
                  import os
                  import socket
                  import time

                  import torch
                  import torch.distributed as dist

                  dist.init_process_group(backend="nccl")
                  rank = dist.get_rank()
                  world_size = dist.get_world_size()
                  local_rank = int(os.environ["LOCAL_RANK"])
                  torch.cuda.set_device(local_rank)
                  device = torch.device("cuda", local_rank)
                  started = time.time()

                  for step in range(300):
                      value = torch.tensor(
                          [rank + 1.0], device=device
                      )
                      dist.all_reduce(value)
                      expected = world_size * (world_size + 1) / 2
                      assert value.item() == expected
                      if local_rank == 0:
                          print(
                              f"HEARTBEAT rank={rank} step={step} "
                              f"node={socket.gethostname()} "
                              f"all_reduce={value.item()} "
                              f"elapsed={time.time() - started:.1f}",
                              flush=True,
                          )
                      time.sleep(2)

                  dist.barrier()
                  print(
                      f"SUCCESS rank={rank}/{world_size} "
                      f"node={socket.gethostname()}",
                      flush=True,
                  )
                  dist.destroy_process_group()
                  PY
                  exec torchrun \
                    --nnodes="${WORLD_SIZE}" \
                    --nproc-per-node=8 \
                    --node-rank="${RANK}" \
                    --master-addr="${MASTER_ADDR}" \
                    --master-port="${MASTER_PORT}" \
                    /tmp/xid11_train.py
              env:
                - name: NCCL_DEBUG
                  value: INFO
                - name: FI_PROVIDER
                  value: efa
                - name: FI_EFA_USE_DEVICE_RDMA
                  value: "1"
                - name: FI_EFA_FORK_SAFE
                  value: "1"
              resources:
                requests:
                  cpu: "8"
                  memory: 32Gi
                  nvidia.com/gpu: "8"
                  vpc.amazonaws.com/efa: "16"
                limits:
                  cpu: "16"
                  memory: 64Gi
                  nvidia.com/gpu: "8"
                  vpc.amazonaws.com/efa: "16"
    Worker:
      replicas: 2
      restartPolicy: Never
      template:
        metadata:
          labels:
            app: gpu-fault-xid11-three-node
        spec:
          restartPolicy: Never
          affinity:
            podAntiAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchLabels:
                      app: gpu-fault-xid11-three-node
                  topologyKey: kubernetes.io/hostname
          volumes:
            - name: dshm
              emptyDir:
                medium: Memory
                sizeLimit: 8Gi
          containers:
            - name: pytorch
              image: public.ecr.aws/deep-learning-containers/pytorch-training@sha256:ff2c928a2e7b3b290b7c3e353085a373b3cfc7f6b165e338b9be4df439feae38
              imagePullPolicy: IfNotPresent
              volumeMounts:
                - name: dshm
                  mountPath: /dev/shm
              command:
                - /bin/bash
                - -lc
                - |
                  cat >/tmp/xid11_train.py <<'PY'
                  import os
                  import socket
                  import time

                  import torch
                  import torch.distributed as dist

                  dist.init_process_group(backend="nccl")
                  rank = dist.get_rank()
                  world_size = dist.get_world_size()
                  local_rank = int(os.environ["LOCAL_RANK"])
                  torch.cuda.set_device(local_rank)
                  device = torch.device("cuda", local_rank)
                  started = time.time()

                  for step in range(300):
                      value = torch.tensor(
                          [rank + 1.0], device=device
                      )
                      dist.all_reduce(value)
                      expected = world_size * (world_size + 1) / 2
                      assert value.item() == expected
                      if local_rank == 0:
                          print(
                              f"HEARTBEAT rank={rank} step={step} "
                              f"node={socket.gethostname()} "
                              f"all_reduce={value.item()} "
                              f"elapsed={time.time() - started:.1f}",
                              flush=True,
                          )
                      time.sleep(2)

                  dist.barrier()
                  print(
                      f"SUCCESS rank={rank}/{world_size} "
                      f"node={socket.gethostname()}",
                      flush=True,
                  )
                  dist.destroy_process_group()
                  PY
                  exec torchrun \
                    --nnodes="${WORLD_SIZE}" \
                    --nproc-per-node=8 \
                    --node-rank="${RANK}" \
                    --master-addr="${MASTER_ADDR}" \
                    --master-port="${MASTER_PORT}" \
                    /tmp/xid11_train.py
              env:
                - name: NCCL_DEBUG
                  value: INFO
                - name: FI_PROVIDER
                  value: efa
                - name: FI_EFA_USE_DEVICE_RDMA
                  value: "1"
                - name: FI_EFA_FORK_SAFE
                  value: "1"
              resources:
                requests:
                  cpu: "8"
                  memory: 32Gi
                  nvidia.com/gpu: "8"
                  vpc.amazonaws.com/efa: "16"
                limits:
                  cpu: "16"
                  memory: 64Gi
                  nvidia.com/gpu: "8"
                  vpc.amazonaws.com/efa: "16"
