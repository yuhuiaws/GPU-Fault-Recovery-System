# Control-plane metrics and remote-command alert delivery.
#
# This collector implements path B only: scrape gpu-fault-api-ha /metrics ->
# remote_write to AMP -> AMP rules -> Alertmanager -> SNS. It carries the
# operational capacity signals (queue depth, Store I/O, p95) and the
# gpu_fault_remote_command_* gauges.
#
# It is NOT required for the solution to function:
#   - The control plane never talks to this collector. Interaction is one
#     directional pull over pod-IP service discovery; api.py has no OTEL/AMP
#     configuration at all and does not know whether anything scrapes it.
#   - Administrator email (path A) goes straight from control-plane code to
#     SES (notifications.py -> AdvisoryNotificationService -> SesEmailNotifier)
#     and does not involve this collector, AMP or SNS in any way.
#
# Consequence of leaving it at 0: every path-B alert is inert, including
# GpuFaultRemoteCommandUnclaimed. A recovery action that is never executed
# then produces no signal whatsoever (see GF-REGIONAL-BOOT-015 附带发现 2).
#
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gpu-fault-adot
  namespace: gpu-fault-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: gpu-fault-adot-discovery
  namespace: gpu-fault-system
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gpu-fault-adot-discovery
  namespace: gpu-fault-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: gpu-fault-adot-discovery
subjects:
  - kind: ServiceAccount
    name: gpu-fault-adot
    namespace: gpu-fault-system
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: gpu-fault-adot
  namespace: gpu-fault-system
data:
  collector.yaml: |
    receivers:
      prometheus:
        config:
          scrape_configs:
            - job_name: gpu-fault-control-plane
              scrape_interval: 15s
              scrape_timeout: 5s
              # /metrics is no longer anonymous: it names every cluster
              # and node and costs a query per cluster, so on the
              # internet-facing NLB it requires the operator token.
              # Loopback (kubectl exec) is still exempt; this scraper
              # comes over the pod IP and must present the credential.
              authorization:
                type: Bearer
                credentials_file: /etc/gpu-fault/execution-token
              kubernetes_sd_configs:
                - role: pod
                  namespaces:
                    names: [gpu-fault-system]
              relabel_configs:
                # All three tiers must be scraped. The main worker claims
                # the processor queue, while the dedicated spool worker
                # drains routine telemetry; scraping only ingress reports
                # both consumers as idle.
                - action: keep
                  source_labels:
                    - __meta_kubernetes_pod_label_app
                  regex: gpu-fault-api-ha|gpu-fault-control-worker|gpu-fault-telemetry-spool-worker
                - action: keep
                  source_labels:
                    - __meta_kubernetes_pod_container_port_name
                  regex: http
                # The app label IS the tier. Keep it as an explicit
                # label so a query can tell an ingress sample from a
                # worker sample: gpu-fault-api-ha AND
                # gpu-fault-control-worker both run uvicorn
                # --workers 4 behind one port, so the process-local
                # families (gpu_fault_store_io_*,
                # gpu_fault_event_loop_lag_*,
                # gpu_fault_processor_admission_rejections_*) are a
                # sample of ONE of four processes per scrape and must
                # not be fed to rate(). Only
                # gpu-fault-telemetry-spool-worker runs --workers 1,
                # so its series are whole.
                - action: replace
                  source_labels:
                    - __meta_kubernetes_pod_label_app
                  target_label: service_role
                - action: replace
                  source_labels:
                    - __meta_kubernetes_pod_name
                  target_label: pod
                - action: replace
                  source_labels:
                    - __meta_kubernetes_pod_node_name
                  target_label: node
                - action: replace
                  target_label: control_plane_cluster
                  replacement: gpu-fault-regional-control-plane
                - action: replace
                  target_label: region
                  replacement: REPLACE_WITH_AWS_REGION
              metric_relabel_configs:
                # This keep list is the only thing that reaches AMP, so a
                # metric family missing here is unalertable no matter what
                # amp-rules.yaml says. gpu_fault_remote_command_.+ carries
                # the never-claimed remote command gauges; without it a
                # recovery that silently never happens produces no signal
                # at all (GF-REGIONAL-BOOT-015).
                #
                # The last four families are recovery *outcomes* rather than
                # component health: workflow status counts, closed-loop
                # milestone latency, notification delivery results and
                # remediation budget waiting. Every family before them
                # describes a component that broke. Without these, a control
                # plane whose every component is green while no GPU node
                # actually returns to the training pool reaches AMP as
                # silence, so the gpu-fault-recovery-outcome group in
                # amp-rules.yaml would be dead configuration.
                #
                # gpu_fault_fleet_rollout_.+ is the fleet rollout fence, which
                # blocks every destructive remediation for a cluster while a
                # deployment there is non-terminal. A rollout abandoned before
                # its first wave held a live cluster for 36 hours on 2026-09-03
                # and the only trace was a WARNING on one worker.
                #
                # gpu_fault_completion_.+ (decision census per DecisionStatus,
                # completion events with no decision), gpu_fault_incidents_.+
                # (incident census per IncidentState) and gpu_fault_gpu_findings_.+
                # (CRITICAL findings that became no incident, by reason) are the
                # 2026-09-06 closed-loop gauges. gpu_fault_incident_.+ does NOT
                # match gpu_fault_incidents_by_state -- the plural is one letter
                # away from the dangling-pointer family and the keep regex has
                # no tolerance for that -- so the family is named separately.
                - action: keep
                  source_labels: [__name__]
                  regex: up|gpu_fault_processor_.+|gpu_fault_telemetry_spool_.+|gpu_fault_store_io_.+|gpu_fault_remote_command_.+|gpu_fault_collector_.+|gpu_fault_policy_.+|gpu_fault_ambiguous_attempt_ownership_.+|gpu_fault_stale_attempt_observations|gpu_fault_attempt_observation_scan_.+|gpu_fault_workflow_.+|gpu_fault_closed_loop_.+|gpu_fault_notification_.+|gpu_fault_remediation_budget_.+|gpu_fault_fleet_rollout_.+|gpu_fault_postgres_.+|gpu_fault_periodic_.+|gpu_fault_health_signal_.+|gpu_fault_ingest_.+|gpu_fault_control_record_.+|gpu_fault_orphan_.+|gpu_fault_incident_.+|gpu_fault_incidents_.+|gpu_fault_completion_.+|gpu_fault_gpu_findings_.+|gpu_fault_capacity_.+
                # Dropped because they describe the collector, not the fleet.
                # The receiver stamps every metric with the instrumentation
                # scope it arrived under, and those labels then take part in
                # alert series identity: upgrading the ADOT image changes
                # otel_scope_version, which resolves every firing alert and
                # re-fires it as new, invalidating the silences an operator put
                # in place mid-incident. Nothing in amp-rules.yaml selects on
                # them.
                - action: labeldrop
                  regex: otel_scope_name|otel_scope_version

            # The collector's own pipeline counters. Nothing else can report
            # them: `retry_on_failure` below gives up after `max_elapsed_time`
            # and drops the batch, and the only record of that drop is a counter
            # on the self-telemetry endpoint. Until this job existed an AMP
            # workspace that was rejecting writes was indistinguishable from a
            # fleet with nothing to report.
            #
            # Total failure is still reported by absence rather than by these
            # counters -- if remote_write is entirely down they cannot reach AMP
            # either, which is what GpuFaultAdotSelfMetricsMissing and
            # GpuFaultControlPlaneMetricsMissing are for. What this job adds is
            # the partial case, which absence cannot see: some batches land and
            # some are dropped, so every other rule in amp-rules.yaml keeps
            # evaluating and quietly does it on holes.
            #
            # The reader is bound to loopback (service.telemetry below) and this
            # is its only reader, so unlike the control-plane job there is no
            # credential and nothing is reachable from the pod network.
            - job_name: gpu-fault-adot-self
              scrape_interval: 30s
              scrape_timeout: 5s
              static_configs:
                - targets: ["127.0.0.1:8889"]
              relabel_configs:
                # `up` carries the target's label set, so these have to be added
                # here rather than in metric_relabel_configs for
                # GpuFaultAdotSelfMetricsMissing to group like every other rule.
                - action: replace
                  target_label: control_plane_cluster
                  replacement: gpu-fault-regional-control-plane
                - action: replace
                  target_label: region
                  replacement: REPLACE_WITH_AWS_REGION
              metric_relabel_configs:
                # Unsuffixed on purpose: the pinned aws-otel-collector v0.49.0
                # (core v0.156.0) publishes its own counters without `_total` on
                # :8889, and `add_metric_suffixes: false` below means nothing adds
                # one before AMP either. Verified by running the pinned image and
                # reading the endpoint -- the names cannot be guessed from the
                # upstream documentation, which describes a suffixed form.
                - action: keep
                  source_labels: [__name__]
                  regex: up|otelcol_exporter_send_failed_metric_points|otelcol_exporter_sent_metric_points|otelcol_exporter_queue_size|otelcol_exporter_queue_capacity
                # Same argument as the job above, with two labels that are worse:
                # service_instance_id is a UUID the collector regenerates on
                # every start and service_version moves with the image, so a
                # restart or an image bump would resolve and re-fire these alerts
                # as new series and drop the silences an operator put in place
                # mid-incident.
                - action: labeldrop
                  regex: otel_scope_name|otel_scope_version|service_instance_id|service_version

    processors:
      batch:
        timeout: 5s
        send_batch_size: 1000
        send_batch_max_size: 2000

    exporters:
      prometheusremotewrite:
        endpoint: https://aps-workspaces.REPLACE_WITH_AWS_REGION.amazonaws.com/workspaces/REPLACE_WITH_AMP_WORKSPACE_ID/api/v1/remote_write
        add_metric_suffixes: false
        auth:
          authenticator: sigv4auth
        retry_on_failure:
          enabled: true
          initial_interval: 1s
          max_interval: 10s
          # After 120s of retries the batch is dropped. That bound stays: the
          # container is capped at 256Mi with GOMEMLIMIT 220MiB, and this
          # exporter applies backpressure rather than spooling to disk, so a
          # longer window buys nothing except a larger in-memory backlog and an
          # OOMKill instead of a gap. The drop is deliberate; what was wrong was
          # that it was silent, which the gpu-fault-adot-self scrape job above and
          # GpuFaultTelemetryRemoteWriteFailing now fix.
          max_elapsed_time: 120s

    extensions:
      sigv4auth:
        region: REPLACE_WITH_AWS_REGION
        service: aps
      health_check:
        endpoint: 0.0.0.0:8090
        path: /health

    service:
      extensions: [sigv4auth, health_check]
      pipelines:
        metrics:
          receivers: [prometheus]
          processors: [batch]
          exporters: [prometheusremotewrite]
      telemetry:
        logs:
          level: info
        metrics:
          level: detailed
          readers:
            - pull:
                exporter:
                  prometheus:
                    # Loopback, not 0.0.0.0: the only reader is the
                    # gpu-fault-adot-self scrape job in this same container, and
                    # the endpoint carries no authentication of its own, so
                    # binding the pod IP would publish the collector's internals
                    # to anything in the namespace for no gain.
                    host: 127.0.0.1
                    port: 8889
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gpu-fault-adot
  namespace: gpu-fault-system
  annotations:
    gpu-fault.io/cleanup-phase: auxiliary
    gpu-fault.io/cleanup-order: "10"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gpu-fault-adot
  template:
    metadata:
      labels:
        app: gpu-fault-adot
    spec:
      serviceAccountName: gpu-fault-adot
      containers:
        - name: collector
          image: REPLACE_WITH_ADOT_IMAGE
          args:
            - --config=/etc/otel/collector.yaml
          env:
            - name: GOGC
              value: "50"
            - name: GOMEMLIMIT
              value: 220MiB
          ports:
            - name: health
              containerPort: 8090
          readinessProbe:
            httpGet:
              path: /health
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: health
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/otel
              readOnly: true
            - name: execution-token
              mountPath: /etc/gpu-fault
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: gpu-fault-adot
        # /metrics requires the operator token for any caller that is not
        # on loopback. gpu-fault-control-plane-active is the Secret
        # deploy.sh creates it in (alongside allowed-email); only that
        # one key is projected.
        - name: execution-token
          secret:
            secretName: gpu-fault-control-plane-active
            items:
              - key: execution-token
                path: execution-token
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: gpu-fault-adot
  namespace: gpu-fault-system
spec:
  # `minAvailable: 1` against `replicas: 1` is unsatisfiable by construction:
  # evicting the only Pod leaves zero available, so the API server refuses every
  # eviction and `kubectl drain` on whichever node happens to host the collector
  # blocks forever -- including the drain a node replacement or an EKS version
  # upgrade needs. The budget was reaching for "do not take the collector down",
  # but a budget cannot keep a single-replica workload up; it can only forbid the
  # disruption, and forbidding all of them is an operator dead end.
  #
  # What is actually worth expressing is a cap on *concurrent* voluntary
  # disruptions, which `maxUnavailable: 1` says without ever reaching zero
  # allowed disruptions, and which keeps meaning something if the Deployment is
  # ever scaled out. The cost is a scrape gap while the Pod reschedules: path B
  # is pull-based and stateless, so that is a gap in graphs, not lost fault data
  # (see the header -- the control plane never talks to this collector).
  maxUnavailable: 1
  selector:
    matchLabels:
      app: gpu-fault-adot
