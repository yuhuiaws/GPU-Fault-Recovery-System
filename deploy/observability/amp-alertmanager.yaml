alertmanager_config: |
  route:
    receiver: gpu-fault-sns
    group_by:
      - alertname
      - severity
      - control_plane_cluster
      - region
      - cluster_id
      - gpu_node
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
    routes:
      - receiver: gpu-fault-sns
        matchers:
          - alertname="GpuFaultExclusiveNodeOwnershipInvariantViolation"
        group_wait: 5s
        group_interval: 1m
        repeat_interval: 4h
  receivers:
    - name: gpu-fault-sns
      sns_configs:
        - topic_arn: REPLACE_WITH_SNS_TOPIC_ARN
          sigv4:
            region: REPLACE_WITH_AWS_REGION
          send_resolved: true
