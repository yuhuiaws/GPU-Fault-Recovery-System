# Every rule in this file must carry an `annotations.summary`, an
# `annotations.description` and an `annotations.runbook_url` pointing at
# `docs/管理员日常运维.md#<alert name lowercased>`. The value is a
# repository-relative path rather than an absolute URL on purpose: this file is
# published with the repository and has no single canonical hosting origin, so
# an absolute URL would pin one fork's web address into the alert payload. An
# on-call operator reads the section from the checkout the runbook already tells
# them to keep. `scripts/verify-regional-alerting.py` fails the build when an
# alert is missing the annotation, when the annotation does not match the alert
# name, when the target heading does not exist, or when a heading exists with no
# alert pointing at it.
groups:
  - name: gpu-fault-collector-health
    rules:
      - alert: GpuFaultCollectorSilent
        expr: max by (control_plane_cluster, region, cluster_id, collector, channel) (gpu_fault_collector_silent_nodes) > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: A required GPU fault collector is missing or stale
          runbook_url: docs/管理员日常运维.md#gpufaultcollectorsilent
          description: >-
            Check the node systemd service, TLS trust, regional token,
            collector outbox and the last successful batch timestamp.
      # Silence and failure are different states. A collector that reports a
      # collection error every cycle is still delivering batches on time, so
      # `GpuFaultCollectorSilent` only notices it once its last success has aged
      # past that channel's threshold -- and it then says "missing or stale",
      # which sends the operator to look at connectivity instead of at the error
      # the node already reported. `warning` rather than `critical`: the node is
      # reachable and reporting, so the loss is partial.
      - alert: GpuFaultCollectorCollectionErrors
        expr: max by (control_plane_cluster, region, cluster_id, collector, channel) (gpu_fault_collector_erroring_nodes) > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: A GPU fault collector is reporting collection errors
          runbook_url: docs/管理员日常运维.md#gpufaultcollectorcollectionerrors
          description: >-
            The collector is delivering batches whose newest state is a
            failure. Read the per-node errors from the collector status
            details and the node's collector journal.
      - alert: GpuFaultCollectorMetricsSnapshotStale
        expr: absent(gpu_fault_collector_metrics_snapshot_age_seconds) or min by (control_plane_cluster, region) (gpu_fault_collector_metrics_snapshot_age_seconds) > 120
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: GPU fault collector metrics snapshots are stale
          runbook_url: docs/管理员日常运维.md#gpufaultcollectormetricssnapshotstale
          description: >-
            Ensure the metrics scraper targets ingress replicas and check
            ingress connectivity to the shared control-plane store.
  # Health of the delivery path itself, read from the collector's own counters
  # (the gpu-fault-adot-self scrape job). Every other group in this file assumes
  # that what AMP holds is what the control plane published; when that stops
  # being true the rules keep evaluating on holes and report nothing, so this
  # group has to exist for any of them to mean anything.
  - name: gpu-fault-telemetry-pipeline
    rules:
      # The name has no `_total`: the self-telemetry reader in the pinned
      # aws-otel-collector v0.49.0 (core v0.156.0) publishes its counters
      # unsuffixed, and `add_metric_suffixes: false` on the remote_write exporter
      # means nothing adds one on the way to AMP either. Verified by running the
      # pinned image and reading :8889; the same read is why there is no
      # `enqueue_failed` clause here -- that counter does not exist in this
      # version, and a queue that overflows is reported as a permanent send
      # failure, which this expression already covers.
      - alert: GpuFaultTelemetryRemoteWriteFailing
        expr: >-
          sum by (control_plane_cluster, region)
          (rate(otelcol_exporter_send_failed_metric_points[5m])) > 0
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: ADOT is dropping metric points on the way to AMP
          runbook_url: docs/管理员日常运维.md#gpufaulttelemetryremotewritefailing
          description: >-
            Points that keep failing past the exporter's 120s retry window are
            dropped and never resent. What AMP holds is therefore incomplete, so
            every other rule in this file is evaluating over gaps and a quiet
            dashboard is not evidence of a quiet fleet. Check the sigv4 role and
            the AMP workspace ingestion limits; do not treat the drop as resolved
            because the counter stopped rising, since it also stops when the
            collector restarts.
      - alert: GpuFaultTelemetryRemoteWriteQueueSaturated
        expr: >-
          max by (control_plane_cluster, region)
          (otelcol_exporter_queue_size / otelcol_exporter_queue_capacity) > 0.8
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: The ADOT export queue is close to dropping metric points
          runbook_url: docs/管理员日常运维.md#gpufaulttelemetryremotewritequeuesaturated
          description: >-
            The retry queue is over 80% full, so AMP is being written slower than
            the control plane is scraped and the next backlog is dropped rather
            than delayed. This is the leading edge of
            GpuFaultTelemetryRemoteWriteFailing and the only warning before data
            loss. Check AMP ingestion throttling first; the queue cannot be
            enlarged for free, since the container is capped at 256Mi.
      - alert: GpuFaultAdotSelfMetricsMissing
        expr: absent(up{job="gpu-fault-adot-self"} == 1)
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: The ADOT collector's own telemetry is missing from AMP
          runbook_url: docs/管理员日常运维.md#gpufaultadotselfmetricsmissing
          description: >-
            Either the collector is not running or remote_write is failing
            completely, and in the second case GpuFaultTelemetryRemoteWriteFailing
            cannot fire because its own counters travel the same path. Compare
            with GpuFaultControlPlaneMetricsMissing: both absent means the
            collector or the write path is down, this one alone means the
            self-telemetry reader or its keep filter changed.
      # The data-plane scrape path itself. One collector per GPU cluster
      # (deploy/dataplane/adot-dataplane.yaml, job `gpu-fault-dataplane`) is
      # what puts every gpu_fault_completion_* / gpu_fault_node_installer_* /
      # gpu_fault_cluster_executor_* series into AMP; with it gone the watcher
      # rules below evaluate over nothing and read as healthy. This alert has
      # two sources under ONE name. The static half here is a live collector
      # none of whose targets in one cluster answers (`max by (gpu_cluster) ==
      # 0`; `max` not `min`, because the executor port reads `up == 0` until
      # its metrics server ships). The absence half is NOT in this file: a
      # global `absent(up{job="gpu-fault-dataplane"} == 1)` fired forever on
      # every site with an AMP workspace and no collector yet, i.e. an SNS page
      # every four hours for a component the site had deliberately not
      # enabled. Instead the release renders one
      # `absent(up{job="gpu-fault-dataplane", gpu_cluster="<id>"} == 1)` rule
      # per cluster whose target carries an adot_irsa_role_arn
      # (regional_dataplane_observability.render_dataplane_expected_rules) and
      # the installer puts them under the rule-groups namespace
      # `gpu-fault-dataplane-expected`, re-put whenever the observability
      # digest moves and deleted when no cluster is expected. Those per-cluster
      # rules are also what catches one dead collector beside a live one: the
      # dead one produces no series at all, so no static rule can see it, but a
      # rule that names the cluster can. `for: 15m` on both matches the
      # watcher rules they guard: a release re-applies the collector and a
      # rollout restarts it well inside that. Warning, not critical: nothing is
      # lost while the watcher stays up, the loss is that its alerts are blind.
      - alert: GpuFaultDataplaneCollectorMissing
        expr: >-
          max by (control_plane_cluster, region, gpu_cluster)
          (up{job="gpu-fault-dataplane"}) == 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: The data-plane metrics collector is not scraping a GPU cluster
          runbook_url: docs/管理员日常运维.md#gpufaultdataplanecollectormissing
          description: >-
            The per-GPU-cluster ADOT collector (job gpu-fault-dataplane) in
            {{ $labels.gpu_cluster }} is alive but every target it scrapes is
            down. (A collector that writes nothing at all is reported by the
            same alert name from the release-rendered per-cluster rules in
            namespace gpu-fault-dataplane-expected, one per cluster with an
            `adot_irsa_role_arn`; a cluster without the role is skipped by
            design and has no rule.) While this fires the Completion Watcher
            alerts (GpuFaultCompletionActiveStateUnavailable,
            GpuFaultCompletionOutboxAppendFailures) are blind for that cluster
            and a quiet dashboard is not evidence. Check the scrape targets'
            `metrics` ports and their `prometheus.io/scrape` annotations on
            that cluster; the executor's port reads `up == 0` until its metrics
            server ships, which is why the rule requires every target of a
            cluster to be down before it fires. If the collector itself is the
            problem, read deployment/gpu-fault-adot-dataplane in
            gpu-fault-system (IRSA token, sigv4 errors, the /health probe) and
            fix it through `gpu-fault-admin deploy --state-dir STATE_DIR`
            (`gpu-fault-admin plan` shows `dataplane_observability` per
            cluster), never by applying the raw manifest.
      # Scrape dependency: the Completion Watcher exposes these series on port
      # 9109 inside the fault-domain cluster. They reach AMP through the
      # per-GPU-cluster collector, deploy/dataplane/adot-dataplane.yaml (job
      # `gpu-fault-dataplane`), which the regional release applies to every
      # cluster target that carries an `adot_irsa_role_arn`; adot-control-plane
      # .yaml runs in the control-plane cluster and never sees these Pods. That
      # collector stamps control_plane_cluster and region with the same values
      # the control-plane collector uses -- the `by (control_plane_cluster,
      # region, gpu_cluster)` clauses below and Alertmanager's grouping depend
      # on it -- plus gpu_cluster, kept in the aggregation so a firing rule
      # names the cluster whose watcher it is. A cluster whose release skipped
      # the collector (no IRSA role yet) contributes no series and these rules
      # stay silent for it; the release prints that skip, and
      # GpuFaultDataplaneCollectorMissing above is the alert for the path.
      # The Completion Watcher persists two ConfigMaps and only one of them is
      # load-bearing at runtime: the write-ahead log carries critical events,
      # while `gpu-fault-completion-watcher-outbox-active` carries the routine
      # attempt state that a restart reads back. Because nothing on the
      # delivery path touches the second one, a missing object or a Role that
      # does not name it degrades in silence rather than crashing the watcher,
      # and this gauge is the only report of it. The watcher re-probes the
      # object once a minute, so `for: 15m` is roughly fifteen retries: long
      # enough that a rollout or a ConfigMap re-apply passes unnoticed, short
      # enough to reach an operator inside one shift. Warning, not critical:
      # nothing is lost while the watcher stays up.
      - alert: GpuFaultCompletionActiveStateUnavailable
        expr: >-
          max by (control_plane_cluster, region, gpu_cluster)
          (gpu_fault_completion_active_state_unavailable) == 1
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: Completion Watcher attempt state is not being persisted
          runbook_url: docs/管理员日常运维.md#gpufaultcompletionactivestateunavailable
          description: >-
            The routine attempt-state ConfigMap
            (gpu-fault-completion-watcher-outbox-active), or the Role that names
            it, is refusing with 404/403 on {{ $labels.gpu_cluster }}, so
            attempt state is not persisted.
            Delivery and the write-ahead log are unaffected, but a watcher
            restart in this window re-derives its attempts from live Pods only:
            a fault on an attempt whose Pods are already gone then resolves the
            node as IDLE instead of ACTIVE, and the reset plan built from that
            would skip STOP_WORKLOADS. Recover with the deploy command, not
            kubectl: from the deployed release checkout with no pending
            changes run `gpu-fault-admin deploy --state-dir STATE_DIR`; its
            NOOP release re-creates the missing state ConfigMap and re-applies
            the ClusterRole on every GPU cluster and touches nothing else.
            Never `kubectl apply` deploy/dataplane/completion-watcher.yaml on
            a live cluster: the unrendered Deployment recreates the watcher on
            the placeholder image and loses the very attempt memory this alert
            protects. The watcher retries once a minute by itself, so no
            restart is needed and the gauge clears on the first call that
            succeeds.
      # Same scrape dependency as the rule above: the counter arrives through
      # the data-plane collector (adot-dataplane.yaml), so it is live only on
      # clusters where that collector is applied.
      # The write-ahead copy is what lets a critical completion event survive a
      # watcher restart: buffered before the POST and cleared after it. A
      # failed append no longer vetoes the POST, so the event is still
      # delivered and this counter is the only trace that the log did not hold
      # it. Any increase at all is a hole, hence `> 0` over a 10m window; the
      # 15m `for` means one conflict during a rollout resolves by itself while
      # a ConfigMap that is full or unwritable keeps the alert up. It is a
      # warning because the loss needs a restart to become real.
      - alert: GpuFaultCompletionOutboxAppendFailures
        expr: >-
          sum by (control_plane_cluster, region, gpu_cluster)
          (increase(gpu_fault_completion_outbox_append_failures_total[10m])) > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: Completion Watcher write-ahead appends are failing
          runbook_url: docs/管理员日常运维.md#gpufaultcompletionoutboxappendfailures
          description: >-
            {{ $value }} critical completion event(s) on {{ $labels.gpu_cluster }}
            in the last 10 minutes got no write-ahead ConfigMap copy, so a
            restart of that watcher can lose
            an event it never delivered or replay one it already did. Check the
            outbox ConfigMap's size against the object ceiling and the watcher
            Role's verbs on it before restarting anything: a restart is the one
            action that turns this gap into an actual lost or duplicated event.
      # The collector's own memory (H2-4). The container is capped at 256Mi
      # with GOMEMLIMIT 220MiB; a cardinality growth that pushes it into an
      # OOMKill loop is otherwise invisible, because each restart lands a
      # batch before dying, so neither absent(up) nor the drop counter fires.
      # 200MiB leaves ~10% below GOMEMLIMIT for the alert to fire before the
      # runtime starts thrashing the GC.
      - alert: GpuFaultAdotMemoryHigh
        expr: >-
          max by (control_plane_cluster, region)
          (otelcol_process_memory_rss) > 209715200
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: The ADOT collector is close to its memory limit
          runbook_url: docs/管理员日常运维.md#gpufaultadotmemoryhigh
          description: >-
            The collector's resident memory has stayed above 200MiB for ten
            minutes against a 256Mi container limit (GOMEMLIMIT 220MiB). The
            next step is an OOMKill loop in which every restart still lands a
            batch, so the absence alerts stay quiet while AMP fills with gaps.
            Check the Pod restart count and the series cardinality reaching the
            keep filter (new cluster_id or pod labels); raise the limit only
            with the cardinality understood.
  - name: gpu-fault-control-plane-capacity
    rules:
      - alert: GpuFaultControlPlaneMetricsMissing
        expr: absent(up{job="gpu-fault-control-plane"} == 1)
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: GPU fault control-plane metrics are missing
          runbook_url: docs/管理员日常运维.md#gpufaultcontrolplanemetricsmissing
          description: >-
            The whole regional control plane is invisible to monitoring, so
            every other rule in this file is simultaneously inert. Check the
            ingress Pod state and startup guard log, target discovery, and the
            namespace and port in the scrape config. Absence of alerts must not
            be read as absence of faults while this is firing.
      # One Pod's /metrics failing (H2-1). ``absent(up == 1)`` above only fires
      # when every target is gone; a single control-worker whose scrape times
      # out or returns 500 simply disappears from every ``min by (pod)`` and
      # ``sum(...)`` rule -- including GpuFaultProcessorUnhealthy, which was
      # written for exactly that Pod. ``up`` carries pod and service_role from
      # the target relabels, so this is per replica by construction.
      - alert: GpuFaultControlPlaneReplicaScrapeFailing
        expr: up{job="gpu-fault-control-plane"} == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: A control-plane replica's /metrics scrape is failing
          runbook_url: docs/管理员日常运维.md#gpufaultcontrolplanereplicascrapefailing
          description: >-
            Pod {{ $labels.pod }} ({{ $labels.service_role }}) has not answered
            a scrape for five minutes: the request timed out or returned a
            non-200. Every per-Pod rule is blind to this Pod meanwhile, so its
            processor health and loop liveness are unknown, not healthy. Check
            the Pod's readiness, its /metrics by kubectl exec on loopback, and
            gpu_fault_metrics_contributor_errors_total on its neighbours for a
            store-side cause; a pool that lost its slots to a rotated password
            shows up here first.
      # A contributor that raises is skipped and counted rather than failing
      # the scrape (G-8). The counter is summed over the Pod's processes;
      # increase() over 10m
      # catches a contributor failing every scrape without paging on one
      # transient store error.
      - alert: GpuFaultMetricsContributorFailing
        expr: >-
          sum by (control_plane_cluster, region, pod, service_role, contributor)
          (increase(gpu_fault_metrics_contributor_errors_total[10m])) > 3
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: A /metrics contributor keeps failing on one replica
          runbook_url: docs/管理员日常运维.md#gpufaultmetricscontributorfailing
          description: >-
            Contributor {{ $labels.contributor }} on Pod {{ $labels.pod }} has
            raised on most scrapes for ten minutes, so its families are missing
            from AMP while the rest of the endpoint still renders. The first
            failure is logged with a traceback under
            gpu_fault.app.metric_contributors; the usual cause is a store read
            failing (pool timeout, failover, schema drift). Treat the missing
            families as unknown, not zero.
      - alert: GpuFaultProcessorQueueDepthHigh
        expr: max(gpu_fault_processor_queue_depth) > 7000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Regional GPU fault processor queue exceeds 70 percent
          runbook_url: docs/管理员日常运维.md#gpufaultprocessorqueuedepthhigh
          description: >-
            Nothing is rejected yet, but queueing delay is already growing.
            Check control-worker replicas and lane occupancy, Aurora latency,
            and whether the backlog is one cluster's fault storm rather than
            global load. Scale through `gpu-fault-admin config`; do not lower
            the threshold or enable a queue bypass.
      - alert: GpuFaultProcessorQueueDepthCritical
        expr: max(gpu_fault_processor_queue_depth) > 9000
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Regional GPU fault processor queue exceeds 90 percent
          runbook_url: docs/管理员日常运维.md#gpufaultprocessorqueuedepthcritical
          description: >-
            One step away from admission rejection, at which point fault events
            depend on client redelivery. Check the same signals as
            GpuFaultProcessorQueueDepthHigh plus whether workers are blocking
            each other on a lane
            (gpu_fault_processor_lane_wait_seconds_max). Adding worker replicas
            outside a maintenance window is permitted here, still with a change
            record and a rollback plan.
      - alert: GpuFaultProcessorOldestRequestDelayed
        expr: max(gpu_fault_processor_queue_oldest_age_seconds) > 30
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Oldest GPU fault processor request is delayed
          runbook_url: docs/管理员日常运维.md#gpufaultprocessoroldestrequestdelayed
          description: >-
            Queue depth may be entirely normal: this catches tail starvation,
            usually one slow request holding a lane. Locate the phase with
            gpu_fault_processor_phase_oldest_seconds, check whether
            gpu_fault_processor_claimed_not_started is non-zero, and check the
            Aurora connection pool wait. Capture the stuck phase and request ID
            before restarting anything.
      - alert: GpuFaultProcessorClusterBacklogHigh
        expr: max by (cluster_id) (gpu_fault_processor_cluster_queue_depth) > 700
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: A GPU cluster processor backlog exceeds 70 percent
          runbook_url: docs/管理员日常运维.md#gpufaultprocessorclusterbackloghigh
          description: >-
            Cluster {{ $labels.cluster_id }} is using over 70 percent of its own
            quota, so the backlog is concentrated in one cluster rather than
            global overload. Check whether that cluster's collectors are
            replaying, whether its executor is claiming, and whether a
            node-level fault storm is in progress. The per-cluster quota is an
            isolation mechanism: do not widen it to clear this alert, because
            that spends other clusters' capacity.
      # The workflow table outgrew the /metrics scan budget, so the step,
      # duration and milestone families now describe only its newest slice.
      # Without this alert those families would quietly stop being a census and
      # nothing else in the pipeline would say so.
      - alert: GpuFaultWorkflowMetricScanTruncated
        expr: max by (control_plane_cluster, region) (gpu_fault_workflow_scan_truncated) == 1
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: Workflow metric scan is truncated
          runbook_url: docs/管理员日常运维.md#gpufaultworkflowmetricscantruncated
          description: >-
            gpu_fault_workflow_step_total,
            gpu_fault_workflow_duration_seconds and
            gpu_fault_closed_loop_milestone_seconds now describe only the newest
            slice of the workflow table, not the whole census.
            gpu_fault_workflow_total is a database-side aggregate and stays
            exact. Compare gpu_fault_workflow_scan_size against
            gpu_fault_workflow_scan_limit and decide whether retention stopped
            reclaiming or the fleet genuinely grew; raising
            GPU_FAULT_METRICS_WORKFLOW_SCAN_LIMIT alone just moves the cost to
            Aurora and to every scrape.
      # The attempt-observation table is retained for a week by default
      # (GPU_FAULT_ATTEMPT_OBSERVATION_MAX_AGE_SECONDS), so the ownership
      # family's scan is the one most likely to hit its budget on a busy fleet.
      # When it does, the exclusive-ownership invariant is being evaluated
      # against a slice, and GpuFaultExclusiveNodeOwnershipInvariantViolation
      # can go quiet without anything else saying so.
      - alert: GpuFaultAttemptObservationMetricScanTruncated
        expr: max by (control_plane_cluster, region) (gpu_fault_attempt_observation_scan_truncated) == 1
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: Attempt observation metric scan is truncated
          runbook_url: docs/管理员日常运维.md#gpufaultattemptobservationmetricscantruncated
          description: >-
            gpu_fault_ambiguous_attempt_ownership_current and
            gpu_fault_stale_attempt_observations are computed from the newest
            slice of the attempt-observation table rather than all of it, so an
            ownership conflict among older observations would not be reported.
            Compare gpu_fault_attempt_observation_scan_size against
            gpu_fault_attempt_observation_scan_limit and check whether the
            observation retention sweep is still running; the slice keeps the
            newest rows, which is where both families' signal lives, so the
            alert is a warning rather than a loss of the invariant.
      - alert: GpuFaultProcessorAdmissionRejected
        expr: sum(rate(gpu_fault_processor_admission_rejections_total[5m])) > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: GPU fault processor rejected requests due to capacity
          runbook_url: docs/管理员日常运维.md#gpufaultprocessoradmissionrejected
          description: >-
            Rejected fault events depend on client redelivery, so this is a real
            detection loss window, not just a capacity signal. Check the
            rejection distribution by path and cluster
            (gpu_fault_processor_admission_rejections_by_path_total,
            _by_cluster_total) and whether the telemetry spool is rejecting at
            the same time. Restore capacity first, then go back over the window
            for XID/SXID events that were never processed.
      - alert: GpuFaultStoreIoSaturated
        expr: max(gpu_fault_store_io_in_flight / gpu_fault_store_io_max_in_flight) > 0.9
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: GPU fault control-plane Store I/O exceeds 90 percent
          runbook_url: docs/管理员日常运维.md#gpufaultstoreiosaturated
          description: >-
            The Store I/O lane is nearly full, so the processor may start
            refusing Store operations at any moment. Check Aurora CPU and
            connection pool wait, whether a full-table-scan request is in
            flight, and gpu_fault_store_io_admission_wait_seconds_max. Confirm
            it is not a single slow query before widening the lane; widening it
            only moves the pressure onto Aurora.
      - alert: GpuFaultStoreIoRejected
        expr: sum(rate(gpu_fault_store_io_rejections_total[5m])) > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: GPU fault control-plane rejected Store I/O work
          runbook_url: docs/管理员日常运维.md#gpufaultstoreiorejected
          description: >-
            The write path is incomplete while this fires, so orchestration
            state may lag the real cluster state. Check the same signals as
            GpuFaultStoreIoSaturated and whether workflows moved to retry or
            fail-closed as a result. After recovery, reconcile the workflows
            from that window against actual node state.
      - alert: GpuFaultProcessorP95Slow
        expr: histogram_quantile(0.95, sum by (le) (rate(gpu_fault_processor_request_processing_seconds_bucket[5m]))) > 5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: GPU fault processor p95 request duration exceeds 5 seconds
          runbook_url: docs/管理员日常运维.md#gpufaultprocessorp95slow
          description: >-
            The earliest leading indicator among the capacity alerts. Check
            event loop lag, Aurora connection pool wait, and whether a release
            just landed (compare the release digest). On its own this is a
            warning; alongside a queue or Store alert, handle it at that
            alert's priority.
      # Two lease-and-counter invariants of the processor queue that used to be
      # repaired silently. A queued request is LEASED to one worker for
      # GPU_FAULT_PROCESSOR_LEASE_SECONDS; if that worker dies or stalls, the
      # periodic reclaim job (GPU_FAULT_PROCESSOR_LEASE_RECLAIM_SECONDS) returns
      # the request to PENDING and counts it. Every non-zero increase is a
      # worker that did not finish what it claimed, and the request was
      # delayed by at least one lease -- a fact no queue-depth rule can see,
      # because the depth does not change when a lease is reclaimed.
      #
      # `sum by` over `increase`: the counter is summed over a Pod's processes,
      # so a process that restarts drops the Pod's series and every replica
      # reclaims on behalf of
      # the same queue. Ten minutes is long enough that one lease expiry from a
      # rolling restart is still visible and short enough to name the deploy.
      - alert: GpuFaultProcessorExpiredLeasesReclaimed
        expr: >-
          sum by (control_plane_cluster, region)
          (increase(gpu_fault_processor_expired_leases_reclaimed_total[10m])) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: Expired processor leases were returned to PENDING
          runbook_url: docs/管理员日常运维.md#gpufaultprocessorexpiredleasesreclaimed
          description: >-
            {{ $value }} queued request(s) sat LEASED past their lease and were
            reclaimed by the periodic job, so a processor worker died or
            stalled mid-request. The requests are not lost, but each waited at
            least one lease longer. Find the worker Pod that restarted or the
            request phase that hung; do not lengthen the lease to quiet this.
      # The per-cluster queue depth gauges are read from shard counters, not
      # from a COUNT(*) over the queue table, and the two can drift when a
      # batch commit touches the table without its counter row. Drift makes
      # every quota decision (GpuFaultProcessorClusterBacklogHigh, admission by
      # cluster) act on the wrong number. Both gauges are refreshed by one
      # periodic job (GPU_FAULT_PROCESSOR_COUNTER_DRIFT_SCAN_SECONDS) rather
      # than in the scrape, and a single sample can straddle a commit, so
      # `min_over_time` over five minutes asks for drift that never returned
      # to zero in the window. Two clauses because the two gauges answer
      # different questions -- how far, and how many clusters -- and either
      # alone being non-zero is the defect.
      - alert: GpuFaultProcessorCounterDrift
        expr: >-
          max by (control_plane_cluster, region)
          (min_over_time(gpu_fault_processor_counter_drift_abs[5m])) > 0
          or
          max by (control_plane_cluster, region)
          (min_over_time(gpu_fault_processor_counter_mismatched_clusters[5m])) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: Processor queue shard counters disagree with the queue table
          runbook_url: docs/管理员日常运维.md#gpufaultprocessorcounterdrift
          description: >-
            For five minutes the shard counters have not matched a real count
            of PENDING/LEASED rows, so per-cluster queue depth and quota
            decisions are being made on a wrong number. Read
            gpu_fault_processor_counter_drift_abs for the size and
            gpu_fault_processor_counter_mismatched_clusters for the spread;
            the counters are rebuilt from the table by the backfill path, not
            by editing counter rows.
      - alert: GpuFaultTelemetrySpoolListenerDown
        expr: min(gpu_fault_telemetry_spool_notifications_enabled{pod=~"gpu-fault-telemetry-spool-worker-.*"}) == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: Telemetry spool consumer fell back to polling
          runbook_url: docs/管理员日常运维.md#gpufaulttelemetryspoollistenerdown
          description: >-
            The spool consumer's LISTEN/NOTIFY connection dropped and it is
            polling instead. Behaviour is still correct, latency is worse. Check
            whether a middlebox cut the Aurora connection, the spool worker Pod
            restart history, and the rate of
            gpu_fault_telemetry_spool_fallback_polls_total. Polling is the
            degraded path, not the target state; do not clear this by disabling
            notifications.
      - alert: GpuFaultTelemetrySpoolDataLoss
        expr: increase(gpu_fault_telemetry_spool_dropped_total[5m]) > 0
        labels:
          severity: critical
        annotations:
          summary: Telemetry spool dropped routine samples
          runbook_url: docs/管理员日常运维.md#gpufaulttelemetryspooldataloss
          description: >-
            Dropping applies to routine telemetry only, never to fault events,
            but host and network trends now have a hole in them. Check whether
            gpu_fault_telemetry_spool_depth and _bytes hit their ceilings and
            whether GpuFaultTelemetrySpoolDrainDelayed fired first. Host-health
            conclusions covering the drop window are not usable as evidence
            afterwards.
      - alert: GpuFaultTelemetrySpoolAdmissionRejected
        expr: sum(increase(gpu_fault_telemetry_spool_rejected_total[5m])) > 0
        labels:
          severity: critical
        annotations:
          summary: Telemetry spool rejected routine samples
          runbook_url: docs/管理员日常运维.md#gpufaulttelemetryspooladmissionrejected
          description: >-
            Rejection at the spool ingress is one link earlier than
            GpuFaultTelemetrySpoolDataLoss. Check the ingress batch parameters,
            the in-flight byte ceiling, and whether one cluster is flooding.
            Restore capacity first, then scope the resulting telemetry hole.
      - alert: GpuFaultTelemetrySpoolReplayError
        expr: increase(gpu_fault_telemetry_spool_errors_total[5m]) > 0
        labels:
          severity: critical
        annotations:
          summary: Telemetry spool replay failed
          runbook_url: docs/管理员日常运维.md#gpufaulttelemetryspoolreplayerror
          description: >-
            Samples that were already durably spooled did not make it into the
            processing path. Read the exception type in the spool worker log,
            compare _abandoned_total against _superseded_total, and check
            whether the Store schema version matches the deployed wheel. Replay
            failure is often version drift, so run the REG-10A artifact
            consistency check before anything else.
      - alert: GpuFaultTelemetrySpoolDrainDelayed
        expr: max(gpu_fault_telemetry_spool_oldest_age_seconds) > 60
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Telemetry spool has not drained within 60 seconds
          runbook_url: docs/管理员日常运维.md#gpufaulttelemetryspooldraindelayed
          description: >-
            The leading indicator for both spool rejection and spool data loss.
            Check spool worker replicas and lane occupancy, and Aurora write
            latency. Warning severity, but treat a persistent one as a capacity
            problem rather than waiting for GpuFaultTelemetrySpoolDataLoss.
      # Every progress gauge above is written by the loop it describes, so a
      # thread that died leaves each one frozen at the last healthy value it
      # had: pending age 0, no errors, no drift. The `_last_cycle_timestamp_`
      # gauges are stamped at the top of every cycle and are the one thing a
      # dead loop cannot keep fresh (ARCH-E E3). `max` across replicas: the
      # stamp is 0 on replicas whose loop never ran (ingress), and a Pod's
      # /metrics reports the newest stamp over its four processes, so only
      # "no process anywhere has ticked for five minutes" fires.
      - alert: GpuFaultWorkflowDispatcherStalled
        expr: >-
          time()
          - max by (control_plane_cluster, region)
          (gpu_fault_workflow_dispatch_last_cycle_timestamp_seconds) > 300
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: No workflow dispatcher has completed a cycle for five minutes
          runbook_url: docs/管理员日常运维.md#gpufaultworkflowdispatcherstalled
          description: >-
            gpu_fault_workflow_pending_age_seconds_max and every dispatch counter
            are stale from this moment: the thread that writes them is not
            running on any control-worker replica. Nothing will claim a PENDING
            workflow or enforce a deadline. Check the control-worker Pods are
            Ready and their gpu-fault-workflow-dispatcher thread is alive; a
            replica that is up but not ticking is a wedged store call.
      - alert: GpuFaultPeriodicRunnerStalled
        expr: >-
          time()
          - max by (control_plane_cluster, region)
          (gpu_fault_periodic_last_cycle_timestamp_seconds) > 300
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: No periodic service runner has ticked for five minutes
          runbook_url: docs/管理员日常运维.md#gpufaultperiodicrunnerstalled
          description: >-
            Training health, spare health, identity refresh, cleanup, archive,
            collector-silence detection, lease reclaim and counter drift all
            run from this one thread, and none of their counters will move
            while it is down.
            gpu_fault_periodic_job_last_run_timestamp_seconds says which job
            ran last. Check the control-worker Pods and the runner thread;
            one blocked store call inside a job stops all eight.
      # Signals the control plane has exported for a long time with no rule
      # reading them (ARCH-E E4). Per-replica families from metrics_sections.py:
      # which Pod is affected is the point, so they carry `pod`.
      - alert: GpuFaultProcessorUnhealthy
        expr: >-
          min by (control_plane_cluster, region, pod)
          (gpu_fault_processor_healthy{pod=~"gpu-fault-control-worker-.*"}) == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: A control-worker replica has marked its processor unhealthy
          runbook_url: docs/管理员日常运维.md#gpufaultprocessorunhealthy
          description: >-
            Pod {{ $labels.pod }} refuses to claim processor requests and sits
            out every periodic job. The reason is in its /healthz body and the
            processor log; the usual causes are a lost store connection or a
            schema version the wheel does not accept. Its share of the queue is
            being served by the other replicas until it recovers or restarts.
      # Process up, claim rounds flat (B-6). The consumer loop had no liveness
      # signal of its own: a thread that died or wedged on one store call kept
      # ``gpu_fault_processor_healthy`` at 1 while the replica claimed nothing.
      # 30 s is several times the loop's longest voluntary wait (5 s
      # notification fallback, 2 s idle backoff).
      - alert: GpuFaultProcessorConsumerStalled
        expr: >-
          min by (control_plane_cluster, region, pod)
          (gpu_fault_processor_consumer_running{pod=~"gpu-fault-control-worker-.*"}) == 0
          or
          max by (control_plane_cluster, region, pod)
          (gpu_fault_processor_consumer_last_cycle_age_seconds{pod=~"gpu-fault-control-worker-.*"}) > 30
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: A control-worker's processor consumer loop is dead or wedged
          runbook_url: docs/管理员日常运维.md#gpufaultprocessorconsumerstalled
          description: >-
            Pod {{ $labels.pod }} reports its processor consumer loop as not
            running, or has not started a claim cycle for over 30 seconds, for
            two minutes. Its share of the queue is not being claimed while its
            health gauge may still read 1. /livez on that Pod names
            processor-consumer as the dead thread and kubelet restarts it; if
            it keeps recurring, read gpu_fault_processor_consumer_cycle_errors_total
            and the processor log for the store call the loop blocks on.
      - alert: GpuFaultProcessorNoActiveConsumer
        expr: >-
          sum by (control_plane_cluster, region)
          (gpu_fault_processor_active_consumer) == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: No replica is consuming the processor queue
          runbook_url: docs/管理员日常运维.md#gpufaultprocessornoactiveconsumer
          description: >-
            Fault events are being accepted and queued and nothing is claiming
            them, so detection has stopped while every ingress health check
            stays green. Check that the control-worker Deployment has Ready
            replicas with GPU_FAULT_SERVICE_ROLE=worker and that they pass
            their startup guard; the queue depth alerts follow this one.
      - alert: GpuFaultTelemetrySpoolConsumerStopped
        expr: >-
          min by (control_plane_cluster, region, pod)
          (gpu_fault_telemetry_spool_consumer_running{pod=~"gpu-fault-telemetry-spool-worker-.*"}) == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: A telemetry spool worker has no running consumer loop
          runbook_url: docs/管理员日常运维.md#gpufaulttelemetryspoolconsumerstopped
          description: >-
            Pod {{ $labels.pod }} is up but its spool consumer loop has exited,
            so routine telemetry spooled to it is not being replayed and
            GpuFaultTelemetrySpoolDrainDelayed will follow. Read the Pod log
            for the exception that ended run_telemetry_spool; the loop is not
            restarted in place.
      # The spool worker runs one process, so its counters are whole. Its loop
      # does a claim round at least every
      # GPU_FAULT_TELEMETRY_SPOOL_NOTIFICATION_FALLBACK_SECONDS (2-5s) even when
      # idle, so ten minutes without one while the loop says it is running is a
      # loop that is wedged, not idle.
      - alert: GpuFaultTelemetrySpoolConsumerStalled
        expr: >-
          min by (control_plane_cluster, region, pod)
          (gpu_fault_telemetry_spool_consumer_running{pod=~"gpu-fault-telemetry-spool-worker-.*"}) == 1
          and on (control_plane_cluster, region, pod)
          sum by (control_plane_cluster, region, pod)
          (increase(gpu_fault_telemetry_spool_claim_rounds_total{pod=~"gpu-fault-telemetry-spool-worker-.*"}[10m])) == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: A telemetry spool consumer loop is running but no longer claiming
          runbook_url: docs/管理员日常运维.md#gpufaulttelemetryspoolconsumerstalled
          description: >-
            Pod {{ $labels.pod }} reports a live consumer loop that has issued
            no claim round in ten minutes, when an idle loop claims every few
            seconds. The loop is blocked -- usually inside a store call or a
            replay future that never completes. Capture the thread dump
            (py-spy) before restarting the Pod so the blocked call is known.
      # Lease renewal is how a worker keeps a request it is still executing.
      # A refusal means another owner holds the lane, so the same request may
      # be running twice; an error means the store could not be asked. Both
      # were counted and never watched. These counters live in the processor,
      # which publishes no last-seen timestamp yet, so this rule has the same
      # sampled-counter exposure as GpuFaultProcessorExpiredLeasesReclaimed
      # above (see the ARCH-E fragment for the hook that removes it).
      - alert: GpuFaultProcessorLeaseRenewalFailing
        expr: >-
          sum by (control_plane_cluster, region)
          (increase(gpu_fault_processor_renewal_fenced_total[15m])) > 0
          or
          sum by (control_plane_cluster, region)
          (increase(gpu_fault_processor_renewal_errors_total[15m])) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: Processor lease renewals were refused or failed
          runbook_url: docs/管理员日常运维.md#gpufaultprocessorleaserenewalfailing
          description: >-
            {{ $value }} lease renewal(s) in 15 minutes were fenced (another
            owner holds the lane, so a request may have run on two workers) or
            hit a store error. Compare with GpuFaultProcessorExpiredLeasesReclaimed:
            a reclaim followed by a fence is a worker that stalled past its lease
            and then resumed. Do not lengthen the lease to quiet this.
      # A fault-layer event the ingress answered 202 and the processor then
      # completed with a 4xx is a fault the node reported and the control plane
      # dropped without a decision (ARCH-G1). The counter lives in the
      # processor, which publishes no last-seen timestamp for it, so this rule
      # has the same sampled-counter exposure as
      # GpuFaultProcessorLeaseRenewalFailing above: the Pod's /metrics sums
      # the counter over its four processes, so scrapes no longer interleave,
      # but one process restarting drops the sum and increase() reads that as
      # a reset. A missed alert, never a false one.
      - alert: GpuFaultProcessorFaultEventsRejected
        expr: >-
          sum by (control_plane_cluster, region)
          (increase(gpu_fault_processor_fault_rejections_total[15m])) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: Fault-layer collector events were rejected after the ingress 202
          runbook_url: docs/管理员日常运维.md#gpufaultprocessorfaulteventsrejected
          description: >-
            {{ $value }} fault-layer event(s) in 15 minutes were accepted at the
            ingress and then completed with a 4xx on replay, so the fault they
            carried reached no policy decision. The processor log line
            "rejected-event" names request_id, path, status and the Pydantic
            detail (no payload); the node's collector status carries the same
            prefix in its errors. Compare
            gpu_fault_processor_completions_by_path_status_total by path: a
            4xx on one path after a release is a schema drift between the
            collector and the control plane, not a node fault.
      # Timestamps, not increase(): see GpuFaultNotificationExpiredUnsent for
      # why the newest event's stamp is the robust read of a process-local
      # counter.
      - alert: GpuFaultPeriodicServiceErrors
        expr: >-
          time()
          - max by (control_plane_cluster, region)
          (gpu_fault_periodic_lease_error_last_seen_timestamp_seconds) < 900
          or
          time()
          - max by (control_plane_cluster, region, job)
          (gpu_fault_periodic_job_error_last_seen_timestamp_seconds) < 900
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: A periodic service job raised or could not take its task lease
          runbook_url: docs/管理员日常运维.md#gpufaultperiodicserviceerrors
          description: >-
            A periodic tick ended in an exception ({{ $labels.job }}) or could
            not take a task lease from the store {{ $value | humanizeDuration }}
            ago; gpu_fault_periodic_job_errors_total and
            gpu_fault_periodic_lease_errors_total say how often. The runner keeps
            going, so the job is skipped for the tick and the service it
            provides (training health, spare health, cleanup, reclaim)
            is late by one interval per failure. Read the control-worker log
            for the traceback.
  # The regional control plane deliberately does not run Prometheus
  # Operator, so deploy/control-plane/regional/processor-alerts.yaml is
  # never loaded here. Any alert that must fire on the CPU control plane
  # has to exist in THIS file as well; a rule that lives only in the
  # PrometheusRule is dead configuration. Discovered by
  # GF-REGIONAL-BOOT-015 on 2026-08-01.
  - name: gpu-fault-remote-command
    rules:
      # A PENDING remote command whose execution_owner no adapter in the
      # target GPU cluster advertises is never claimed. The periodic sweep
      # does dead-letter it -- FAILED with status_source
      # unclaimed-deadline-exceeded once it is older than
      # GPU_FAULT_REMOTE_COMMAND_CLAIM_DEADLINE_SECONDS (default 900s), counted
      # on gpu_fault_remote_command_unclaimed_expired and alerted below -- but
      # that is the workflow failing, not recovering. This rule is the earlier
      # signal, while the command can still be claimed. 600s is five times the
      # default GPU_FAULT_CLUSTER_EXECUTOR_LEASE_SECONDS of 120 and short of the
      # sweep's deadline.
      - alert: GpuFaultRemoteCommandUnclaimed
        expr: >-
          max by (control_plane_cluster, region, cluster_id)
          (gpu_fault_remote_command_oldest_unclaimed_seconds) > 600
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: A GPU cluster remote command was never claimed by an executor
          runbook_url: docs/管理员日常运维.md#gpufaultremotecommandunclaimed
          description: >-
            Check that the runtime profile owner for the stuck step is
            advertised by an adapter the target cluster executor actually
            constructed, and that the executor can reach the control plane
            over TLS. Left alone, the periodic sweep fails the command at
            GPU_FAULT_REMOTE_COMMAND_CLAIM_DEADLINE_SECONDS and
            GpuFaultRemoteCommandUnclaimedExpired fires.
      # The sweep's verdict: a remote command nobody claimed within the deadline
      # was failed on the workflow's behalf. The gauge counts retained rows with
      # that status_source and falls as retention removes them, so the alert
      # reads the change of the aggregate, not its level; a negative step from
      # retention cannot fire it (ARCH-E E4).
      - alert: GpuFaultRemoteCommandUnclaimedExpired
        expr: >-
          delta(
            (
              max by (control_plane_cluster, region)
              (gpu_fault_remote_command_unclaimed_expired)
            )[30m:1m]
          ) > 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: A remote command was dead-lettered because no executor ever claimed it
          runbook_url: docs/管理员日常运维.md#gpufaultremotecommandunclaimedexpired
          description: >-
            {{ $value }} remote command(s) passed
            GPU_FAULT_REMOTE_COMMAND_CLAIM_DEADLINE_SECONDS still PENDING and
            were failed with status_source=unclaimed-deadline-exceeded, so their
            workflows failed without any node action being attempted. Find the
            execution_owner in the command's error and the adapter that should
            advertise it; the workflow is ESCALATED and is not retried by
            clearing this alert.
      - alert: GpuFaultRemoteCommandExecutorInternalError
        expr: >-
          time() -
          max by (control_plane_cluster, region)
          (gpu_fault_remote_command_executor_internal_error_last_seen_timestamp_seconds)
          < 900
        labels:
          severity: critical
        annotations:
          summary: A cluster executor failed a command through an internal defect
          runbook_url: docs/管理员日常运维.md#gpufaultremotecommandexecutorinternalerror
          description: >-
            The failure is an executor bug, not a refused recovery action.
            Read the executor Pod log stack trace before retrying. The alert
            uses the newest retained error timestamp so terminal-record cleanup
            cannot look like a counter reset.
  - name: gpu-fault-policy-coverage
    rules:
      - alert: GpuFaultUnknownProductFamily
        expr: >-
          sum by (control_plane_cluster, region, product)
          (increase(gpu_fault_policy_unknown_product_total[15m])) > 0
        labels:
          severity: critical
        annotations:
          summary: A GPU product is not mapped to an NVIDIA Catalog family
          runbook_url: docs/管理员日常运维.md#gpufaultunknownproductfamily
          description: >-
            Add the product prefix to spec.catalog.productFamilies in the
            pinned XID catalog before enabling automated XID recovery.
  - name: gpu-fault-orchestration-invariants
    rules:
      # Aggregated even though the threshold is per node: every control-plane
      # replica publishes this same Store-derived series, so an unaggregated
      # expression turns one ambiguous node into one alert per replica and grows
      # the notification with the replica count. `by` keeps the labels the
      # description reads and the ones amp-alertmanager.yaml groups on.
      - alert: GpuFaultExclusiveNodeOwnershipInvariantViolation
        expr: >-
          max by (control_plane_cluster, region, cluster_id, gpu_node)
          (gpu_fault_ambiguous_attempt_ownership_current) > 1
        labels:
          severity: critical
        annotations:
          summary: Multiple fresh active attempts claim the same GPU node
          runbook_url: docs/管理员日常运维.md#gpufaultexclusivenodeownershipinvariantviolation
          description: >-
            Recovery is currently fail-closed for cluster
            {{ $labels.cluster_id }} GPU node {{ $labels.gpu_node }} because
            {{ $value }} fresh attempts claim it. Stale observations are
            excluded from ownership and alerted separately.
      - alert: GpuFaultStaleAttemptObservation
        expr: >-
          max by (control_plane_cluster, region, cluster_id, gpu_node)
          (gpu_fault_stale_attempt_observations) > 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: Stale active attempt observations remain
          runbook_url: docs/管理员日常运维.md#gpufaultstaleattemptobservation
          description: >-
            Cluster {{ $labels.cluster_id }} GPU node
            {{ $labels.gpu_node }} retains {{ $value }} active-phase
            observations older than the ownership freshness window. They are
            excluded from node mutation ownership. Check the live training Pod,
            Completion Watcher health/logs, and observation delivery; do not
            delete Store rows to silence this warning.
      # The fleet rollout fence refuses every destructive remediation for a
      # cluster while a fleet deployment there is non-terminal. That is the right
      # default and it was completely silent: a WARNING on whichever worker
      # polled, and `gpu-fault-admin status` does not mention fleet deployments
      # at all. On 2026-09-03 an upgrade created its deployment record, died
      # before starting a wave, and fenced a live cluster for 36 hours.
      #
      # Age, not a count: a healthy regional roll legitimately holds a
      # deployment open, so a count cannot tell working from stuck. 2h is well
      # past the longest observed roll for this fleet (about 7 minutes for four
      # p5en nodes) and far short of the hours a real stranding costs.
      #
      # `_never_started` is the diagnosis, not a second alert. It separates "the
      # rollout is stuck mid-wave" from "nothing was ever in flight", which are
      # different runbook entries, so it is carried in the description instead of
      # firing on its own.
      # F-B3: a PENDING workflow whose incident is gone or names another
      # workflow, and which no successor names as predecessor, is reachable
      # from nothing: no dispatcher scan orders it, no fence covers it, no
      # sweep closes it. Young records are excluded by the aggregation window
      # before counting, so anything left is a real orphan.
      - alert: GpuFaultOrphanWorkflows
        expr: >-
          max by (control_plane_cluster, region)
          (gpu_fault_orphan_workflows) > 0
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: Workflows exist that nothing will dispatch, fence or sweep
          runbook_url: docs/管理员日常运维.md#gpufaultorphanworkflows
          description: >-
            {{ $value }} PENDING or SAFETY_PENDING workflow(s) past the
            aggregation window have an incident that is gone or points
            elsewhere and no successor. Each may still hold a node claim.
            List them with the orphan inspection in gpu-fault-admin
            workflow-reconcile --dry-run and terminalize through it; do not
            delete rows.
      - alert: GpuFaultIncidentDanglingWorkflowPointers
        expr: >-
          max by (control_plane_cluster, region)
          (gpu_fault_incident_dangling_workflow_pointers) > 0
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: Incidents point at workflow rows that do not exist
          runbook_url: docs/管理员日常运维.md#gpufaultincidentdanglingworkflowpointers
          description: >-
            {{ $value }} incident(s) carry a workflow_request_id no workflow row
            answers to. A later event on the same node follows that pointer,
            finds nothing, and the duplicate-event fast path has to rebuild the
            chain (gpu_fault_ingest_stale_event_link_repairs_total). Read the
            incidents with workflow-reconcile --dry-run; a pointer is repaired
            through it, never by editing the incident row.
      # An ACTIVE agent whose heartbeat lease has lapsed is a node the control
      # plane still counts as a remediation target and cannot reach. Minutes of
      # it are a reboot; a quarter of an hour is an agent that did not come
      # back, or a fleet whose token or TLS trust broke.
      - alert: GpuFaultStaleAgents
        expr: >-
          max by (control_plane_cluster, region)
          (gpu_fault_stale_agents) > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: ACTIVE node agents have stopped heartbeating
          runbook_url: docs/管理员日常运维.md#gpufaultstaleagents
          description: >-
            {{ $value }} ACTIVE agent(s) have no live heartbeat lease. Every
            node action on those nodes fails readiness and the collector
            silence alerts for them follow. List them with GET /v1/fleet/agents
            and check the node's gpu-fault-node-agent unit, its cluster token
            and TLS trust; drain or revoke agents for nodes that are gone.
      # PIN_AHEAD_OF_FLEET: the control plane pins an agent version, artifact,
      # policy, profile or config digest that no live agent in the cluster runs.
      # Every node action there fails readiness with a hint that used to be the
      # only trace of the condition (ARCH-E E5). NODE_STALE is the other verdict
      # and is a node problem, so it is carried in the description, not paged.
      - alert: GpuFaultFleetPinAheadOfFleet
        expr: >-
          max by (control_plane_cluster, region, cluster_id)
          (gpu_fault_fleet_pin_drift_nodes{kind="PIN_AHEAD_OF_FLEET"}) > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: A control-plane pin names a build no live agent runs
          runbook_url: docs/管理员日常运维.md#gpufaultfleetpinaheadoffleet
          description: >-
            Cluster {{ $labels.cluster_id }}: {{ $value }} node(s) fail
            readiness because a pinned value (agent version, artifact sha256,
            policy, profile or config digest) is run by no live agent in the
            cluster, so the pin -- not the nodes -- is what changed. Correct
            the pin or roll the build out; the gauge clears on the next
            readiness evaluation. Compare kind="NODE_STALE" for nodes that are
            simply behind their peers.
      - alert: GpuFaultFleetRolloutFenceStuck
        expr: >-
          max by (control_plane_cluster, region, cluster_id)
          (gpu_fault_fleet_rollout_fence_age_seconds) > 7200
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: A fleet rollout has fenced destructive remediation for hours
          runbook_url: docs/管理员日常运维.md#gpufaultfleetrolloutfencestuck
          description: >-
            Cluster {{ $labels.cluster_id }} has a non-terminal fleet deployment
            {{ $value | humanizeDuration }} old, so every destructive
            remediation there is fenced. Read
            gpu_fault_fleet_rollout_never_started for the same cluster: nonzero
            means no wave was ever started and the record was abandoned by its
            creator. Terminalize it through the release engine; do not delete
            Store rows and do not disable the fence.
      # The regional registry has two sources: the Secret a Pod starts from and
      # the durable head that join/remove publish to. The head wins, so a
      # release that only rewrote the Secret changed nothing the running
      # registry reads, and a Pod restarted from that Secret would come up on a
      # stale cluster list until its first refresh (ARCH-H2/H3). The flag is
      # per process; `max by` keeps the grouping labels and the role.
      - alert: GpuFaultRegionalRegistrySecretDrift
        expr: >-
          max by (control_plane_cluster, region, service_role)
          (gpu_fault_regional_registry_secret_drift) == 1
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: The regional registry Secret drifts from the durable registry head
          runbook_url: docs/管理员日常运维.md#gpufaultregionalregistrysecretdrift
          description: >-
            Role {{ $labels.service_role }} started from a registry Secret whose
            digest differs from the durable registry head for 15 minutes. The
            head is authoritative, so the running registry is correct; the
            release config is what is stale. Compare secret_config_sha256 with
            durable_config_sha256 in /healthz regional_registry, then bring the
            release config back in line with the head (join/remove the cluster
            it disagrees on, or a release whose REGISTRY component stages and
            publishes the Secret durably) so the next Pod restart does not come
            up on the old cluster list. Do not edit the Secret by hand.
  # Every group above alerts on a component: a collector went quiet, a queue
  # filled up, an executor crashed. None of them fires when every component is
  # healthy and recovery still is not finishing — a fail-closed workflow parked
  # in BLOCKED, a closed loop that takes an hour, an escalation e-mail nobody
  # received, a remediation budget that never releases. Those are the outcomes
  # the system exists to deliver, so they get their own group and their own
  # thresholds, expressed against the closed-loop metrics the control plane
  # already publishes.
      # Control-plane review 2026-09-08 counters that used to be log lines only.
      # Each ``increase`` is summed across replicas: the periodic and archive
      # jobs run on whichever worker holds the lease, the dispatcher and the
      # outbox drainer on any worker.
      - alert: GpuFaultRemoteCommandStaleFenceSwept
        expr: >-
          sum by (control_plane_cluster, region)
          (increase(gpu_fault_periodic_cleanup_rows_total{job="stale_fence_remote_commands"}[30m])) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: A remote command was failed by the stale-fence sweep
          runbook_url: docs/管理员日常运维.md#gpufaultremotecommandstalefenceswept
          description: >-
            {{ $value }} LEASED remote command(s) whose workflow moved to
            another fencing token had their lease lapse without the data plane
            reporting a result, and the periodic sweep failed them with
            status_source=stale-fence (D-9). Each one is a node action that ran
            on a superseded generation with nobody collecting its outcome:
            read result_details.stale_fence_swept on the command and check the
            node for an overlapping action before treating the workflow's
            current generation as clean.
      - alert: GpuFaultNotificationDeliveryErrors
        expr: >-
          sum by (control_plane_cluster, region)
          (increase(gpu_fault_notification_delivery_errors_total[15m])) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: Notification outbox deliveries are raising
          runbook_url: docs/管理员日常运维.md#gpufaultnotificationdeliveryerrors
          description: >-
            {{ $value }} outbox deliveries in fifteen minutes raised inside the
            provider call or the bookkeeping after it (F-3); each row was
            released for retry and the rest of the batch continued, so this is
            a slower outbox, not a lost one, unless it keeps firing. The
            exception is logged by gpu_fault.notification_service; SES timeouts
            and Secret/IAM errors are the usual causes.
      - alert: GpuFaultControlRecordArchiveErrors
        expr: >-
          sum by (control_plane_cluster, region)
          (increase(gpu_fault_control_record_archive_errors_total[1h])) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: The control-record archiver is failing on candidates
          runbook_url: docs/管理员日常运维.md#gpufaultcontrolrecordarchiveerrors
          description: >-
            {{ $value }} archive candidate(s) in the last hour failed with an
            exception other than a safety refusal (F-8); the run continued and
            the incident stays in the database for the next run. Read the
            reason label (exception type) and the archiver log; S3 permission
            or bucket errors keep every candidate failing, so retention
            silently stops reclaiming.
  - name: gpu-fault-recovery-outcome
    rules:
      # BLOCKED is the fail-closed terminal state: the workflow stopped because
      # evidence, identity or workload state was not conclusive enough to keep
      # mutating a node. It is a correct outcome, and it is also a GPU node that
      # stays out of the training pool until an administrator acts. A single
      # BLOCKED workflow is normal; a backlog means nobody is acting on them.
      #
      # This used to read `gpu_fault_workflow_total{status="BLOCKED"} > 3`, which
      # is the trap `GpuFaultClosedLoopSlow` below documents, in its absolute
      # form. That gauge counts every workflow ever persisted, and BLOCKED is
      # terminal, so the bucket falls only when an operator runs
      # `gpu-fault-admin workflow-reconcile` or the incident is archived out of
      # the table. A backlog that was handled correctly therefore kept the
      # expression true forever and re-notified every `repeat_interval`, while
      # the description's "each one holds a GPU node" had already stopped being
      # true. `gpu_fault_workflow_blocked_unreconciled` counts only the BLOCKED
      # workflows with no verified restore successor -- the same predicate the
      # release preflight uses to decide whether a BLOCKED record still holds a
      # node -- so it drops on its own the moment scheduling is restored, and a
      # value that stays above the threshold is a real, current backlog.
      #
      # `max by` rather than a bare expression: every control-plane replica
      # publishes this same cluster-level aggregate, so unaggregated it produced
      # one entry per replica for one fact. The `by` labels are the two
      # per-series labels amp-alertmanager.yaml groups on; dropping them would
      # degrade that grouping instead.
      - alert: GpuFaultRecoveryBlockedBacklog
        expr: >-
          max by (control_plane_cluster, region)
          (gpu_fault_workflow_blocked_unreconciled) > 3
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: Fail-closed recovery workflows are accumulating
          runbook_url: docs/管理员日常运维.md#gpufaultrecoveryblockedbacklog
          description: >-
            {{ $value }} recovery workflows are BLOCKED with no verified restore
            successor, so each one still holds a GPU node out of the training
            pool. Read the blocking reason per workflow; do not clear BLOCKED by
            editing Store rows.
      # The ratio is configuration arithmetic (threads that may hold a
      # connection / pool ceiling) and the worker role has run at ~1.5x since
      # the day it was deployed without ever queueing on checkout, so it is
      # information, not a page (G-7). The two rules after it read the live
      # pool: callers actually waiting, and connection attempts actually
      # failing -- the shape a rotated password or a failover takes.
      - alert: GpuFaultPostgresPoolOversubscribed
        expr: >-
          max by (control_plane_cluster, region, service_role)
          (gpu_fault_postgres_pool_oversubscription_ratio) > 1
        for: 10m
        labels:
          severity: info
        annotations:
          summary: A control-plane role can hold more connections than its pool has
          runbook_url: docs/管理员日常运维.md#gpufaultpostgrespooloversubscribed
          description: >-
            Role {{ $labels.service_role }}: the threads that can each hold a pooled PostgreSQL connection
            outnumber the pool ceiling by {{ $value }}x; under load callers queue
            on checkout and the request deadline, not the database, becomes the
            limit. Informational: GpuFaultPostgresPoolCheckoutQueueing says
            whether anyone is actually waiting.
      - alert: GpuFaultPostgresPoolCheckoutQueueing
        expr: >-
          max by (control_plane_cluster, region, service_role, pod)
          (gpu_fault_postgres_pool_requests_waiting) > 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: Callers are queueing for a PostgreSQL pool connection
          runbook_url: docs/管理员日常运维.md#gpufaultpostgrespoolcheckoutqueueing
          description: >-
            Pod {{ $labels.pod }} ({{ $labels.service_role }}) has had callers
            blocked on pool checkout on every sample for two minutes: every
            pooled connection is in use and the next PoolTimeout turns into a
            503 or a stalled worker thread. Compare gpu_fault_postgres_pool_size
            with gpu_fault_postgres_pool_max_size -- a pool below its ceiling
            is losing slots (see GpuFaultPostgresPoolConnectionErrors), a pool
            at its ceiling is genuinely saturated; then read Aurora latency
            and the lane wait summary before adding connections.
      - alert: GpuFaultPostgresPoolConnectionErrors
        expr: >-
          sum by (control_plane_cluster, region, service_role, pod)
          (increase(gpu_fault_postgres_pool_connections_errors_total[5m])) > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: A PostgreSQL pool cannot open new connections
          runbook_url: docs/管理员日常运维.md#gpufaultpostgrespoolconnectionerrors
          description: >-
            Pod {{ $labels.pod }} ({{ $labels.service_role }}) has failed to open
            pooled connections for five minutes. After a master password
            rotation this is the pool re-dialling with the old password; the
            pool re-reads the mounted Secret on each failure
            (gpu_fault_postgres_credential_rotations_total rises when the file
            changed), so a rising counter with no rotation means the Secret was
            never updated -- check GpuFaultAuroraCredentialRefreshStale and the
            refresher CronJob. During a failover the counter rises briefly and
            stops; sustained growth with an unchanged Secret is DNS, security
            group or Aurora availability.
      # The refresher's last verdict, read from the Secret it writes (H1-2).
      # Hourly CronJob; three missed hours means the next rotation (every 7
      # days) will reach the pools before the Secret does.
      - alert: GpuFaultAuroraCredentialRefreshStale
        expr: >-
          max by (control_plane_cluster, region)
          (gpu_fault_aurora_credential_refresh_last_success_age_seconds) > 10800
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: The Aurora credential refresher has not succeeded for three hours
          runbook_url: docs/管理员日常运维.md#gpufaultauroracredentialrefreshstale
          description: >-
            The hourly gpu-fault-aurora-credential-refresh CronJob last
            verified and published the master password more than three hours
            ago, so the mounted Secret may not survive the next rotation.
            gpu_fault_aurora_credential_refresh_last_attempt_failed says
            whether it is failing or simply not being scheduled; read the
            failure_reason in last-refresh-status.json and the newest Job's log,
            then run the Job by hand once the cause is fixed.
      # The status file only records the last run, so a failed run withholds
      # the success age above; this is the companion that fires on consecutive
      # failures rather than on age.
      - alert: GpuFaultAuroraCredentialRefreshFailing
        expr: >-
          max by (control_plane_cluster, region)
          (gpu_fault_aurora_credential_refresh_last_run_ok) == 0
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: The Aurora credential refresher's last run failed
          runbook_url: docs/管理员日常运维.md#gpufaultauroracredentialrefreshfailing
          description: >-
            The most recent gpu-fault-aurora-credential-refresh run finished
            with a non-ok status and no later run has succeeded in fifteen
            minutes, so the mounted Secret will not follow the next master
            password rotation. The error text (password redacted) is in the
            Secret's last-refresh-status.json and the Job log; typical causes
            are the Secrets Manager read, the verify connection (network,
            CA bundle) or RBAC on the Secret patch.
      - alert: GpuFaultBranchEscalationBudgetRefused
        expr: >-
          sum by (control_plane_cluster, region)
          (increase(gpu_fault_workflow_branch_escalation_budget_refusals_total[30m])) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: A node branch went to an operator because the cluster budget was full
          runbook_url: docs/管理员日常运维.md#gpufaultbranchescalationbudgetrefused
          description: >-
            {{ $value }} node branch(es) could not take their next rung
            (reboot or replacement) because the cluster remediation budget was
            full, and were retired to an operator instead of exceeding it.
      - alert: GpuFaultWorkflowLifetimeExceeded
        expr: >-
          sum by (control_plane_cluster, region)
          (increase(gpu_fault_workflow_lifetime_exceeded_total[30m])) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: A recovery workflow ran out of its hard lifetime
          runbook_url: docs/管理员日常运维.md#gpufaultworkflowlifetimeexceeded
          description: >-
            {{ $value }} workflow(s) failed in the last 30 minutes because their
            lifetime deadline passed. Each is now ESCALATED to an operator and
            later events for the same node or job are only recorded on the
            incident until it is closed.
      - alert: GpuFaultJobWorkflowNodeBusyTimeout
        expr: >-
          sum by (control_plane_cluster, region)
          (increase(gpu_fault_workflow_dispatch_node_busy_timeouts_total[30m])) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: A training job was stopped because its nodes stayed under repair
          runbook_url: docs/管理员日常运维.md#gpufaultjobworkflownodebusytimeout
          description: >-
            {{ $value }} job workflow(s) waited out the node-busy window and were
            failed by suspending the job. The job owner sees a controller-initiated
            stop; the node remediation that held the node keeps running.
      # F-B4 (3): an unrecognised exception in a dispatch attempt leaves the
      # workflow executable with a backoff and counts here. It is a bug on this
      # replica -- a wiring gap, a missing capability -- and the workflow keeps
      # retrying into it until another replica takes it, so it was invisible
      # unless someone read the traceback in the log.
      - alert: GpuFaultWorkflowDispatchInternalErrors
        expr: >-
          time()
          - max by (control_plane_cluster, region)
          (gpu_fault_workflow_dispatch_internal_error_last_seen_timestamp_seconds) < 900
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: Workflow dispatch attempts are raising internal errors
          runbook_url: docs/管理员日常运维.md#gpufaultworkflowdispatchinternalerrors
          description: >-
            A dispatch attempt raised an error the dispatcher does not
            recognise {{ $value | humanizeDuration }} ago;
            gpu_fault_workflow_dispatch_internal_errors_total says how many. The
            workflows stay executable with a backoff, so recovery is delayed,
            not lost, and the same attempt repeats until the defect is fixed.
            Read the control-worker log for "workflow dispatch hit an internal
            error" and its traceback.
      # F-A6: a failed workflow's failure handler kept raising and was given up
      # on. The workflow is terminal but its failure side effects -- the
      # escalation, the incident state, the notification -- did not happen.
      - alert: GpuFaultWorkflowFailureHandlingAbandoned
        expr: >-
          time()
          - max by (control_plane_cluster, region)
          (gpu_fault_workflow_dispatch_failure_handling_abandoned_last_seen_timestamp_seconds) < 1800
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: A failed workflow's failure handling was abandoned
          runbook_url: docs/管理员日常运维.md#gpufaultworkflowfailurehandlingabandoned
          description: >-
            A failed workflow's failure handler gave up after repeated
            exceptions {{ $value | humanizeDuration }} ago
            (gpu_fault_workflow_dispatch_failure_handling_abandoned_total says
            how many), so the incident may still read ACTION_PENDING and no
            operator was notified about a node that is still out of the pool.
            Find the workflow ids in the control-worker log ("failure handling
            abandoned") and reconcile each by hand.
      - alert: GpuFaultProcessorRetryHorizonFailures
        expr: >-
          sum by (control_plane_cluster, region)
          (increase(gpu_fault_processor_retry_horizon_failures_total[30m])) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: Processor requests kept failing past the retry horizon
          runbook_url: docs/管理员日常运维.md#gpufaultprocessorretryhorizonfailures
          description: >-
            {{ $value }} queued request(s) were completed as failed (503) because
            their releases kept failing for longer than the retry horizon. The
            lane is no longer blocked, but the request's side effects were never
            confirmed; read the completion body for the failure reason.
      # `gpu_fault_closed_loop_milestone_seconds` is emitted as `_count`/`_sum`
      # over every persisted workflow, so its lifetime average never recovers
      # once one slow incident lands. `delta` over a 6h window gives the mean
      # for the workflows that reached the milestone recently instead. The
      # window is long because containment milestones are rare events, and
      # `clamp_min` keeps the denominator away from zero. Record retention can
      # move the gauge down, in which case the ratio goes negative and the alert
      # stays silent — a missed alert, never a false one.
      #
      # Both halves aggregate before `delta` for the same reason as the two rules
      # around it: the summary is a Store-derived aggregate that every replica
      # publishes, so a per-series ratio is the same number repeated once per
      # replica, and a replica that restarts inside the window contributes a step
      # from zero to the whole persisted history.
      - alert: GpuFaultClosedLoopSlow
        expr: >-
          delta(
            (
              max by (control_plane_cluster, region)
              (gpu_fault_closed_loop_milestone_seconds_sum{milestone="containment"})
            )[6h:5m]
          )
          /
          clamp_min(
            delta(
              (
                max by (control_plane_cluster, region)
                (gpu_fault_closed_loop_milestone_seconds_count{milestone="containment"})
              )[6h:5m]
            ),
            1
          )
          > 900
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: Recent GPU fault containment took over 15 minutes on average
          runbook_url: docs/管理员日常运维.md#gpufaultclosedloopslow
          description: >-
            Containment is the first closed-loop milestone: the faulty GPU node
            stops accepting new work. Detection-to-containment above 15 minutes
            means later training attempts kept landing on a node already known
            to be faulty.
      # Notifications are how an administrator learns that a workflow needs a
      # decision (GPU count change, spare exhaustion, mechanical check). A
      # failed delivery is therefore a silent stall of the human half of the
      # loop, which no component alert covers.
      #
      # A FAILED result row is terminal since ARCH-E E1: the outbox writes it
      # only when a delivery is retired DEAD after
      # GPU_FAULT_NOTIFICATION_MAX_ATTEMPTS, or when an inline send fails with
      # no retry behind it. It used to be written on every attempt, so one
      # provider hiccup on a row the outbox retried a minute later fired this
      # critical page. The retry state now lives on
      # gpu_fault_notification_delivery_total{status="RETRY"} and is watched by
      # the age and drain rules below instead.
      #
      # `gpu_fault_notification_total` is a Store-derived gauge, not a per-Pod
      # counter, so `delta` has to be taken over the aggregate: applied per
      # series it also reports the step a restarted replica makes when its first
      # scrape publishes the whole history at once. The subquery aggregates
      # first and then measures the 15m change of that single series. `for`
      # holds the page through one scrape of a replica that is still catching
      # up; a dead letter stays visible in the window for the full 15m.
      - alert: GpuFaultNotificationDeliveryFailing
        expr: >-
          delta(
            (
              max by (control_plane_cluster, region)
              (gpu_fault_notification_total{status="FAILED"})
            )[15m:1m]
          ) > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Business notifications were given up on undelivered
          runbook_url: docs/管理员日常运维.md#gpufaultnotificationdeliveryfailing
          description: >-
            {{ $value }} notification(s) reached a terminal FAILED result in the
            last 15 minutes: the outbox exhausted its delivery attempts
            (gpu_fault_notification_dead_lettered_total) or an inline send
            failed with nothing behind it to retry. An administrator decision
            request was not delivered and nothing will retry it on its own.
            Check the SES identity and sending quota, then re-send through
            POST /v1/advisory-notifications/dispatch; a workflow waiting on that
            decision is not progressing.
      # The leading edge of the rule above. A notification in PENDING, RETRY or
      # LEASED is one the outbox still owes; the shelf life
      # (GPU_FAULT_NOTIFICATION_TTL_SECONDS, 6h) is when it is thrown away
      # unsent, so 30 minutes is well inside the window in which it can still be
      # rescued. The age is measured from when the row was queued or last
      # re-queued, so a retry backoff cannot reset it.
      - alert: GpuFaultNotificationUndeliveredTooLong
        expr: >-
          max by (control_plane_cluster, region)
          (gpu_fault_notification_oldest_pending_age_seconds) > 1800
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: A business notification has waited over 30 minutes to be delivered
          runbook_url: docs/管理员日常运维.md#gpufaultnotificationundeliveredtoolong
          description: >-
            The oldest undelivered notification has waited
            {{ $value | humanizeDuration }} and its shelf life will expire it
            unsent at GPU_FAULT_NOTIFICATION_TTL_SECONDS. Read
            gpu_fault_notification_delivery_total by status: RETRY means the
            provider keeps refusing (check SES and the delivery row's
            last_error), PENDING or LEASED means the dispatcher is not getting
            to it (GpuFaultNotificationOutboxNotDraining).
      # Undelivered rows and no dispatcher cycle for five minutes is the
      # configuration the delivery-mode log line warns about at startup: mail
      # queued to the outbox with nothing draining it. The cycle stamp is per
      # process and 0 on replicas that never dispatch, so `max` finds the one
      # replica that does; a deployment that delivers inline has no undelivered
      # rows and stays quiet.
      - alert: GpuFaultNotificationOutboxNotDraining
        expr: >-
          max by (control_plane_cluster, region)
          (gpu_fault_notification_delivery_total{status=~"PENDING|RETRY"}) > 0
          and on (control_plane_cluster, region)
          (
            time()
            - max by (control_plane_cluster, region)
            (gpu_fault_notification_dispatch_last_cycle_timestamp_seconds)
          ) > 300
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Notifications are queued but no dispatcher is draining the outbox
          runbook_url: docs/管理员日常运维.md#gpufaultnotificationoutboxnotdraining
          description: >-
            {{ $value }} notification(s) are PENDING or RETRY and no replica has
            started a dispatch cycle for five minutes. Either
            GPU_FAULT_NOTIFICATION_DISPATCHER_ENABLED is on no control-worker
            replica, or the dispatcher thread died; read the startup line
            "notification delivery:" on the control-worker Pods and check the
            gpu-fault-notification-dispatcher thread is alive.
      # Expiry is deliberate: mail about a node recovered six hours ago is noise
      # and reads as an attack to the mail provider. It is still a notification
      # nobody received, and a steady trickle of them says the outbox drains
      # slower than it fills. Read as the newest expiry's timestamp rather than
      # increase() of the counter: the Pod's /metrics sums the counter over
      # its four processes, but the sum still drops when a process restarts
      # and a rollout of six replicas is six resets; max() of a timestamp is
      # the newest event whichever replica reported it and survives all of
      # them.
      - alert: GpuFaultNotificationExpiredUnsent
        expr: >-
          time()
          - max by (control_plane_cluster, region)
          (gpu_fault_notification_expired_last_seen_timestamp_seconds) < 1800
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: Notifications were retired unsent past their shelf life
          runbook_url: docs/管理员日常运维.md#gpufaultnotificationexpiredunsent
          description: >-
            A notification was claimed only after its
            GPU_FAULT_NOTIFICATION_TTL_SECONDS shelf life and retired with a
            SKIPPED result instead of being mailed, {{ $value | humanizeDuration }}
            ago; gpu_fault_notification_expired_total says how many. The
            notifications are still readable at /v1/advisory-notifications.
            Find out what blocked the outbox during the window (dispatcher off,
            SES denied, a wedged replica) before widening the TTL.
      # Between a step's own retry counter and the workflow's hour-long
      # execution budget there was nothing: no per-step bound and no signal. On
      # 2026-09-05 one occupied warm spare parked a REPLACE_NODE step
      # indefinitely because the counter it was bounded by was read back from a
      # record whose key never advanced, so the count never rose and the step
      # never failed. Every component was healthy throughout and no alert fired.
      #
      # Age of a still-WAITING step, not a count of them: waiting is normal and a
      # count cannot separate a node that is rebooting from one that will never
      # answer.
      #
      # Compared against the exported threshold rather than a literal, because the
      # threshold is per-operation: a delegated REPLACE_NODE waits on the provider
      # for GPU_FAULT_HYPERPOD_MANAGED_RECOVERY_TIMEOUT_SECONDS while everything
      # else is capped at GPU_FAULT_WORKFLOW_STEP_TIMEOUT_SECONDS, and one literal
      # can only be right for one of them -- at the default cap it would fire on
      # every healthy node replacement. The control plane publishes
      # gpu_fault_workflow_step_waiting_warning_seconds with the same labels, so
      # this expression cannot go stale when either window is retuned.
      #
      # `for` is well inside the lead time the two settings define (the cap minus
      # the warning, 300s at the defaults), so the alert still arrives while the
      # step is waiting rather than after the cap has already failed it -- the
      # point is to reach an operator before the recovery is abandoned.
      - alert: GpuFaultWorkflowStepStalled
        expr: >-
          max by (control_plane_cluster, region, operation)
          (gpu_fault_workflow_step_waiting_seconds
          - gpu_fault_workflow_step_waiting_warning_seconds) > 0
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: A recovery workflow step has been waiting far too long
          runbook_url: docs/管理员日常运维.md#gpufaultworkflowstepstalled
          description: >-
            A {{ $labels.operation }} step has been WAITING
            {{ $value | humanizeDuration }} longer than that operation is
            expected to wait, without reaching a terminal outcome, so the faulted
            node is still held and its workload is still suspended. Read that
            step's details for what it is waiting on and whether the thing it
            polls has already answered; do not raise the per-step cap to clear
            this.
      # The companion invariant. The per-step cap above is what should end a
      # stalled step, and execution_deadline is the outer bound behind it -- but
      # for the whole life of this system that outer bound could not fire against
      # a workflow that was still being redispatched, because the only thing
      # enforcing it had to take a lease that the dispatch loop renewed on every
      # tick. Anything above zero here for more than a few minutes means a
      # deadline passed and neither the lease holder nor the watchdog acted on it,
      # which is the condition that made a 60-minute stall look like a 60-minute
      # timeout.
      - alert: GpuFaultWorkflowDeadlineNotEnforced
        expr: >-
          max by (control_plane_cluster, region)
          (gpu_fault_workflow_overdue_seconds) > 300
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: A recovery workflow outlived its execution deadline
          runbook_url: docs/管理员日常运维.md#gpufaultworkflowdeadlinenotenforced
          description: >-
            A non-terminal workflow is {{ $value | humanizeDuration }} past its
            execution_deadline, so the bound that is supposed to terminalize it
            is not working. Check whether its executor is still claiming it
            (execution_owner_id with a lease in the future) and read the
            control-worker log for the deadline and watchdog lines. Do not edit
            execution_deadline or delete the record to clear this.
      # The remediation budget caps how many nodes the system mutates at once.
      # Workflows waiting on it are correct behaviour under load and a stall
      # when the budget is never released — for instance because a claim holder
      # died without its lease expiring.
      - alert: GpuFaultRemediationBudgetStarved
        expr: >-
          max by (control_plane_cluster, region)
          (gpu_fault_remediation_budget_waiting_workflows) > 0
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: Recovery workflows have waited 30 minutes for remediation capacity
          runbook_url: docs/管理员日常运维.md#gpufaultremediationbudgetstarved
          description: >-
            {{ $value }} workflows are held by a remediation budget. Compare
            gpu_fault_remediation_budget_active_claims against the configured
            scope limits and check whether an active claim belongs to a
            workflow that is no longer making progress.
      # S1: the per-cluster remediation budget is a safety limit (five
      # concurrent remediations per cluster as shipped). A correlated
      # whole-cluster fault -- one AZ, 500+ nodes -- therefore drains five at a
      # time and is EXPECTED to hold this alert for hours; what it adds over
      # GpuFaultRemediationBudgetStarved is which cluster is saturated, so the
      # operator can estimate the drain time instead of guessing at it. Both
      # sides are Store-derived, so both are `max by` with the grouping labels;
      # the limit gauge carries no cluster_id and is joined with `group_left`.
      - alert: GpuFaultRemediationBudgetClusterSaturated
        expr: >-
          max by (control_plane_cluster, region, cluster_id)
          (gpu_fault_remediation_budget_cluster_waiting_workflows) > 0
          and on (control_plane_cluster, region, cluster_id)
          (
            max by (control_plane_cluster, region, cluster_id)
            (gpu_fault_remediation_budget_cluster_active_claims)
            >= on (control_plane_cluster, region) group_left
            max by (control_plane_cluster, region)
            (gpu_fault_remediation_budget_cluster_limit)
          )
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: One GPU cluster's remediation budget has been saturated for 30 minutes
          runbook_url: docs/管理员日常运维.md#gpufaultremediationbudgetclustersaturated
          description: >-
            Cluster {{ $labels.cluster_id }} has {{ $value }} recovery workflows
            waiting on its remediation budget while its active claims sit at
            the per-cluster limit. This is EXPECTED during a correlated
            whole-cluster fault: the cluster drains at
            gpu_fault_remediation_budget_cluster_limit remediations at a time,
            so the drain time is roughly waiting / limit times the
            per-remediation duration (see
            gpu_fault_workflow_duration_seconds), which for hundreds of nodes
            is tens of hours. The per-cluster limit is a safety limit on how
            many nodes the system mutates at once and must not be widened just
            to clear this alert. Check
            gpu_fault_remediation_budget_cluster_active_claims against the
            limit for this cluster, confirm the active claims belong to
            workflows that are still progressing (a claim holder whose lease
            never expires is GpuFaultRemediationBudgetStarved territory), and
            read the oldest waiting workflow via
            gpu_fault_workflow_pending_age_seconds_max and its
            remediation_budget_last_blocked_reason.
      # A completion event with no decision row at all. Every persisted event
      # is meant to be decided in the same transaction; one without a decision
      # was recorded and then never judged, and nothing downstream will ever
      # look at it again. 30m because an event can legitimately be a scrape
      # ahead of its decision, never half an hour ahead.
      - alert: GpuFaultCompletionEventsWithoutDecision
        expr: >-
          max by (control_plane_cluster, region)
          (gpu_fault_completion_events_without_decision) > 0
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: Completion events were recorded but never decided
          runbook_url: docs/管理员日常运维.md#gpufaultcompletioneventswithoutdecision
          description: >-
            {{ $value }} completion event(s) have had no decision for 30
            minutes. The attempt outcome was stored but its decision was never
            written, so a failed attempt may be sitting with no recovery
            planned. Match the events to their attempts before replaying them;
            do not delete the event rows.
      # ESCALATED is where an incident parks when the system has handed a
      # decision to a person: budget refused the next rung, the lifetime ran
      # out, a mechanical check is needed. It is a designed, correct state and
      # it is never auto-resolved, so a count is not a fault -- but an
      # escalation that nobody has acted on for a day is a GPU node (or a job)
      # that everyone has forgotten. A day, warning, and no `critical` route:
      # this is a reminder that a queue of human work exists.
      - alert: GpuFaultIncidentsAwaitingOperator
        expr: >-
          max by (control_plane_cluster, region)
          (gpu_fault_incidents_by_state{state="ESCALATED"}) > 0
        for: 24h
        labels:
          severity: warning
        annotations:
          summary: Escalated incidents have waited a day for an operator
          runbook_url: docs/管理员日常运维.md#gpufaultincidentsawaitingoperator
          description: >-
            {{ $value }} incident(s) have been ESCALATED for at least 24 hours.
            Each one is a decision the control plane deliberately handed to a
            person and will not take back. Work the list in §9; an incident
            leaves this state only through an operator action, never through a
            retention sweep.
      # PENDING is the state a workflow waits in for a dispatcher to pick it up.
      # The dispatcher observes the age of the oldest PENDING workflow on every
      # tick and warns past a threshold; this is the same fact in AMP. Thirty
      # minutes of nothing claiming it is not queueing delay -- the dispatcher
      # ticks in seconds -- it is a workflow no dispatcher will take: a
      # predecessor that never terminalized, a retired generation awaiting an
      # operator, or a dispatcher that is itself stuck.
      - alert: GpuFaultWorkflowPendingAge
        expr: >-
          max by (control_plane_cluster, region)
          (gpu_fault_workflow_pending_age_seconds_max) > 1800
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: A recovery workflow has waited over 30 minutes to be dispatched
          runbook_url: docs/管理员日常运维.md#gpufaultworkflowpendingage
          description: >-
            The oldest PENDING workflow is {{ $value | humanizeDuration }} old
            and no dispatcher has claimed it. Read its predecessor_workflow_id
            and the retired-generation gauge
            (gpu_fault_workflow_retired_generation_awaiting_operator) before
            looking at dispatcher health; do not delete or hand-edit the
            workflow row.
