apiVersion: batch/v1
kind: Job
metadata:
  name: gpu-fault-aurora-migration
  namespace: gpu-fault-system
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          resources:
            requests:
              cpu: "250m"
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          image: public.ecr.aws/docker/library/python:3.12-slim
          command: ["/bin/sh", "-c"]
          args:
            - >-
              exec gpu-fault-store-migrate
              --source-postgres-url "$SOURCE_POSTGRES_URL"
          env:
            - name: PATH
              value: >-
                /opt/gpu-fault/control-plane/bin:/opt/app-root/bin:/opt/app-root/src/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
            - name: SOURCE_POSTGRES_URL
              valueFrom:
                secretKeyRef:
                  name: gpu-fault-postgres
                  key: postgres-url
            - name: GPU_FAULT_STORE_URL
              valueFrom:
                secretKeyRef:
                  name: gpu-fault-aurora
                  key: postgres-url
          volumeMounts:
            - name: artifact
              mountPath: /artifact
              readOnly: true
      volumes:
        - name: artifact
          configMap:
            name: gpu-fault-control-plane-wheel-0100
