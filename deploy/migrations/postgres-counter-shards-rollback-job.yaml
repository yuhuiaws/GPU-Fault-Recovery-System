apiVersion: batch/v1
kind: Job
metadata:
  name: gpu-fault-postgres-counter-shards-rollback
  namespace: gpu-fault-system
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 720
  template:
    metadata:
      labels:
        app: gpu-fault-postgres-counter-shards-rollback
    spec:
      restartPolicy: Never
      serviceAccountName: gpu-fault-control-plane
      containers:
        - name: migrate
          image: public.ecr.aws/docker/library/python:3.12-slim
          command: ["gpu-fault-store-migrate"]
          args: ["--restore-legacy-processor-counters"]
          env:
            - name: PATH
              value: >-
                /opt/gpu-fault/control-plane/bin:/opt/app-root/bin:/opt/app-root/src/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
            - name: GPU_FAULT_STORE_URL
              valueFrom:
                secretKeyRef:
                  name: gpu-fault-aurora
                  key: postgres-url
            # The Aurora DSN uses sslmode=verify-full, so the RDS CA bundle
            # mounted below must be readable at this path.
            - name: GPU_FAULT_RDS_CA_BUNDLE
              value: /etc/gpu-fault/rds/ca-bundle.pem
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: artifact
              mountPath: /artifact
              readOnly: true
            - name: rds-ca-bundle
              mountPath: /etc/gpu-fault/rds
              readOnly: true
      volumes:
        - name: artifact
          configMap:
            name: REPLACE_WITH_WHEEL_CONFIGMAP
        - name: rds-ca-bundle
          configMap:
            name: gpu-fault-rds-ca-bundle
