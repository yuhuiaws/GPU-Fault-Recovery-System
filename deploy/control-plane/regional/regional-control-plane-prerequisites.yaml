apiVersion: v1
kind: Namespace
metadata:
  name: gpu-fault-system
  labels:
    # The AWS Load Balancer Controller injects a readiness gate into Pods a
    # TargetGroupBinding selects (the api-ha ingress behind the NLB): such a
    # Pod is Ready only once its NLB target is healthy, so a rolling update
    # never counts a Pod the load balancer cannot reach yet.
    elbv2.k8s.aws/pod-readiness-gate-inject: enabled
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gpu-fault-control-plane
  namespace: gpu-fault-system
---
apiVersion: v1
kind: Service
metadata:
  name: gpu-fault-api
  namespace: gpu-fault-system
spec:
  type: ClusterIP
  selector:
    app: gpu-fault-api-ha
  ports:
    - name: http
      port: 8080
      targetPort: http
