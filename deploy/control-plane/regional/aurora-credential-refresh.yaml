# REQUIRED when the Aurora cluster was created with
# --manage-master-user-password (which deploy/hyperpod/deploy.sh does).
#
# RDS rotates the managed master password on a schedule — 7 days by default.
# The control plane reads its DSN from the gpu-fault-aurora Secret only once,
# when PostgresStore.__init__ builds the connection pool, so a rotation does
# not disturb running replicas. It breaks the NEXT restart: the new process
# authenticates with the stale password and exits, and every replica ends up
# in CrashLoopBackOff hours or days after the rotation, with a misleading
# psycopg_pool.PoolTimeout in the log (the pool swallows the auth failure).
#
# This CronJob reads AWSCURRENT from Secrets Manager, and when it differs from
# the Secret, verifies the new password against the database, writes the
# Secret, and restarts the Deployment (GPU_FAULT_STORE_URL is an env from a
# secretKeyRef, so it is not hot-reloaded). The Secret and every database
# consumer carry the same refresh annotation, allowing a later run to resume
# only the Deployment rollouts that an earlier Kubernetes API failure missed.
# When the Secret and all consumers are converged it exits without patching.
#
# The schedule MUST stay shorter than the rotation period, with enough margin
# that a few consecutive failed runs still leave time to react -- but that is
# only the floor. The real bound is the window between a rotation and the next
# tick: for that whole window every NEW control-plane Pod dies on
# `FATAL: password authentication failed`, so a rollout that lands inside it
# fails for a reason that looks exactly like a broken release. The twice-daily
# schedule this file used to carry left a gap of up to 12 h, and on 2026-09-07
# a release transaction hit it: the re-apply failed, the automatic rollback
# restarted control-worker, its Pods could not authenticate, and the release
# ended in `rollback-failed`. Hourly caps the gap at one hour, and the release
# orchestrator additionally runs this CronJob synchronously (create job
# --from=cronjob, fail closed) before every upgrade and rollback, so a
# transaction never starts on a stale password. If you change the rotation
# window, revisit this schedule:
#
#   aws secretsmanager describe-secret --region "${AWS_REGION}" \
#     --secret-id "${AURORA_MASTER_SECRET_ARN}" \
#     --query '{rules:RotationRules,next:NextRotationDate}'
#
# The alternative to running this is to stop rotating at all
# (aws secretsmanager cancel-rotate-secret), which trades the moving part for
# a password that is never replaced. See docs/部署和运维手册.md and
# GF-REGIONAL-BOOT-016 附带发现 2.
#
# The ServiceAccount needs an IAM role with
# secretsmanager:GetSecretValue on the cluster's managed master secret, and
# kms:Decrypt on the key that secret is encrypted with, associated via EKS
# Pod Identity. See docs/部署和运维手册.md for the exact commands.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gpu-fault-aurora-credential-refresh
  namespace: gpu-fault-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: gpu-fault-aurora-credential-refresh
  namespace: gpu-fault-system
rules:
  # resourceNames confines this to the one Secret holding the DSN: the job
  # has no reason to read node-action-secret, execution-token or the cluster
  # registry, and this Role is the only thing standing between a compromised
  # refresher and all of them.
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["gpu-fault-aurora"]
    verbs: ["get", "patch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames:
      - gpu-fault-api-ha
      - gpu-fault-control-worker
      - gpu-fault-telemetry-spool-worker
    verbs: ["get", "patch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gpu-fault-aurora-credential-refresh
  namespace: gpu-fault-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: gpu-fault-aurora-credential-refresh
subjects:
  - kind: ServiceAccount
    name: gpu-fault-aurora-credential-refresh
    namespace: gpu-fault-system
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: gpu-fault-aurora-credential-refresh
  namespace: gpu-fault-system
  annotations:
    gpu-fault.io/cleanup-phase: auxiliary
    gpu-fault.io/cleanup-order: "20"
spec:
  # Every hour at :17 UTC. Off the hour so it does not pile onto whatever else
  # the cluster does at :00. Hourly, not twice daily: see the header for the
  # 12 h stale-password gap that broke a live release.
  schedule: "17 * * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  # A missed window is not worth catching up on: the next run does the same
  # work, and a burst of concurrent refreshers each restarting the Deployment
  # would be worse than being an hour late. Shorter than the hourly interval so
  # a late start can never collide with the next tick.
  startingDeadlineSeconds: 1800
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      # Bounded so a hung run cannot block the next window under
      # concurrencyPolicy: Forbid.
      activeDeadlineSeconds: 900
      template:
        metadata:
          labels:
            app: gpu-fault-aurora-credential-refresh
        spec:
          restartPolicy: Never
          serviceAccountName: gpu-fault-aurora-credential-refresh
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
          containers:
            - name: refresh
              image: public.ecr.aws/docker/library/python:3.12-slim
              command: ["gpu-fault-aurora-credential-refresh"]
              env:
                - name: PATH
                  value: >-
                    /opt/gpu-fault/control-plane/bin:/opt/app-root/bin:/opt/app-root/src/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
                # AWS_REGION is not set here on purpose: both EKS Pod Identity
                # and IRSA inject it into the pod, and hardcoding a region in
                # a manifest that is otherwise region-agnostic is how a
                # copy-pasted deployment ends up reading the wrong account's
                # secret. Set GPU_FAULT_AWS_REGION only to override.
                - name: GPU_FAULT_NAMESPACE
                  value: gpu-fault-system
                - name: GPU_FAULT_AURORA_SECRET
                  value: gpu-fault-aurora
                - name: GPU_FAULT_CONTROL_PLANE_DEPLOYMENT
                  value: gpu-fault-api-ha
                - name: GPU_FAULT_AURORA_RESTART_DEPLOYMENTS
                  value: >-
                    gpu-fault-api-ha,
                    gpu-fault-control-worker,
                    gpu-fault-telemetry-spool-worker
                - name: GPU_FAULT_AURORA_REFRESH_MAX_ATTEMPTS
                  value: "3"
                - name: GPU_FAULT_AURORA_MASTER_SECRET_ARN
                  value: REPLACE_WITH_AURORA_MASTER_SECRET_ARN
                # The refresher opens the Aurora DSN via verify_dsn, which
                # honours the sslmode=verify-full baked into postgres-url, so
                # it needs the same RDS CA bundle the control plane mounts.
                - name: GPU_FAULT_RDS_CA_BUNDLE
                  value: /etc/gpu-fault/rds/ca-bundle.pem
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  cpu: "500m"
                  memory: 512Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: artifact
                  mountPath: /artifact
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
                - name: rds-ca-bundle
                  mountPath: /etc/gpu-fault/rds
                  readOnly: true
          volumes:
            # Same wheel ConfigMap the control plane installs from, so the
            # refresher can never run a different build of the shared DSN
            # handling than the process it is refreshing for.
            - name: artifact
              configMap:
                name: gpu-fault-control-plane-wheel-0100
            - name: tmp
              emptyDir: {}
            # The RDS CA bundle at /etc/gpu-fault/rds/ca-bundle.pem, so the
            # refresher can verify the server certificate when it opens the DSN.
            - name: rds-ca-bundle
              configMap:
                name: gpu-fault-rds-ca-bundle
