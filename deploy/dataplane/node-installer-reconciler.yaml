apiVersion: v1
kind: ConfigMap
metadata:
  name: gpu-fault-node-installer-wave
  namespace: gpu-fault-system
data:
  allowed-nodes: "REPLACE_WITH_INSTALLER_ALLOWED_NODES"
  max-unavailable: "REPLACE_WITH_INSTALLER_MAX_UNAVAILABLE"
  generation: "REPLACE_WITH_INSTALLER_WAVE_GENERATION"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gpu-fault-node-installer-reconciler
  namespace: gpu-fault-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: gpu-fault-node-installer-reconciler
# Nodes only. The installer Jobs and the two ConfigMaps the reconciler reads
# all live in its own namespace, so those grants are the namespaced Role
# below: a cluster-wide `jobs create` would let this identity schedule
# arbitrary Jobs in every namespace, which nothing here needs.
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: gpu-fault-node-installer-reconciler
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: gpu-fault-node-installer-reconciler
subjects:
  - kind: ServiceAccount
    name: gpu-fault-node-installer-reconciler
    namespace: gpu-fault-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: gpu-fault-node-installer-reconciler
  namespace: gpu-fault-system
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames:
      - "gpu-fault-node-installer-template"
      - "gpu-fault-node-installer-wave"
    verbs: ["get"]
  # Read-only, and namespaced to the installer Jobs' own namespace. The
  # reconciler has no `secrets` grant on purpose, so it cannot check whether a
  # node has an entry in gpu-fault-node-action-keys; it reads the consequence
  # off the Job's Pod instead (CreateContainerConfigError and the other
  # never-started waiting reasons) and marks that node failed-permanent instead
  # of burning an install slot for the full activeDeadlineSeconds every cycle.
  # Without this grant that classification silently degrades to plain backoff.
  # No `watch` (the pass is a poll), no `delete` (Job deletion cascades).
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gpu-fault-node-installer-reconciler
  namespace: gpu-fault-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: gpu-fault-node-installer-reconciler
subjects:
  - kind: ServiceAccount
    name: gpu-fault-node-installer-reconciler
    namespace: gpu-fault-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gpu-fault-node-installer-reconciler
  namespace: gpu-fault-system
  annotations:
    gpu-fault.io/cleanup-phase: producer
    gpu-fault.io/cleanup-order: "10"
    gpu-fault.io/deploy-mode: regional_reconciler
spec:
  replicas: 1
  # Recreate, not RollingUpdate: this controller rewrites the software
  # on every GPU host, and its target bundle comes from env
  # (GPU_FAULT_INSTALLER_CONFIG_DIGEST) plus the template ConfigMap.
  # Under RollingUpdate the surge pod and the terminating pod hold
  # *different* digests, so both create their own installer Job for the
  # same node -- the Job names differ because the digest is part of the
  # name, so nothing collides and nothing serialises them. Whichever
  # lands second wins the venv, while the new pod sees its own Job
  # Complete and annotates the node with the new digest. The node then
  # runs the old wheel while claiming the new one, and reconcile
  # reports "current" forever. maxUnavailable alone cannot fix this:
  # any overlap at all is enough. This controller is a singleton by
  # design; replicas stays 1 and scale-out is not a supported lever.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: gpu-fault-node-installer-reconciler
  template:
    metadata:
      # Scrape declaration for the per-cluster ADOT collector
      # (deploy/dataplane/adot-dataplane.yaml): it discovers Pods by this
      # annotation pair plus the container port named `metrics` below, and
      # keeps the gpu_fault_node_installer_.+ family. The /metrics server
      # behind :9110 ships in the same batch as this declaration; until it
      # listens the target reads `up == 0`, which is the honest value.
      # Liveness stays file-based (below) and is not tied to this port.
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "9110"
      labels:
        app: gpu-fault-node-installer-reconciler
    spec:
      serviceAccountName: gpu-fault-node-installer-reconciler
      priorityClassName: system-cluster-critical
      # A bare `operator: Exists` also tolerated node.kubernetes.io/not-ready
      # and unreachable, so taint-based eviction never took this singleton off
      # a dead node: the Deployment saw its one Pod and rescheduled nothing
      # until the Node object itself was deleted, and no GPU node in the fleet
      # was reconciled meanwhile. These are the two taints the other data-plane
      # singletons tolerate, plus a bounded window on the node-death taints.
      tolerations:
        - key: gpu-fault.io/quarantined
          operator: Exists
          effect: NoSchedule
        - key: node.kubernetes.io/unschedulable
          operator: Exists
          effect: NoSchedule
        - key: node.kubernetes.io/not-ready
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 60
        - key: node.kubernetes.io/unreachable
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 60
      containers:
        - name: reconciler
          image: public.ecr.aws/docker/library/python:3.12-slim
          command: ["/bin/sh", "-c"]
          args:
            - >-
              touch /tmp/reconciler-ready
              && exec gpu-fault-node-installer-reconciler
          env:
            - name: PATH
              value: >-
                /opt/gpu-fault/executor/bin:/opt/app-root/bin:/opt/app-root/src/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
            - name: GPU_FAULT_NAMESPACE
              value: gpu-fault-system
            - name: GPU_FAULT_CLUSTER_ID
              value: REPLACE_WITH_CLUSTER_ID
            - name: GPU_FAULT_HYPERPOD_CLUSTER
              value: REPLACE_WITH_HYPERPOD_CLUSTER
            - name: GPU_FAULT_INSTALLER_VERSION
              value: REPLACE_WITH_INSTALLER_VERSION
            - name: GPU_FAULT_INSTALLER_CONFIG_DIGEST
              value: REPLACE_WITH_INSTALLER_CONFIG_DIGEST
            - name: GPU_FAULT_INSTALLER_ARTIFACT_SHA256
              value: REPLACE_WITH_INSTALLER_ARTIFACT_SHA256
            - name: GPU_FAULT_INSTALLER_BUNDLE_SHA256
              value: REPLACE_WITH_INSTALLER_BUNDLE_SHA256
            - name: GPU_FAULT_INSTALLER_TEMPLATE_SHA256
              value: REPLACE_WITH_INSTALLER_TEMPLATE_SHA256
            # SHA-256 of the exact job.yaml the deploy placed in the template
            # ConfigMap below. The reconciler hashes what it loads and refuses
            # to start on a mismatch or when this is missing: the template
            # becomes a privileged hostPath Pod with the node's HMAC key on
            # every GPU node, so the ConfigMap alone must not be trusted.
            # Distinct from GPU_FAULT_INSTALLER_TEMPLATE_SHA256, which is the
            # release-wide template-inputs digest stamped on nodes.
            - name: GPU_FAULT_INSTALLER_TEMPLATE_CONTENT_SHA256
              value: REPLACE_WITH_INSTALLER_TEMPLATE_CONTENT_SHA256
            - name: GPU_FAULT_INSTALLER_TEMPLATE_CONFIG_MAP
              value: REPLACE_WITH_INSTALLER_TEMPLATE_CONFIG_MAP
            - name: GPU_FAULT_INSTALLER_TEMPLATE_PATH
              value: /etc/gpu-fault/installer-template/job.yaml
            - name: GPU_FAULT_NODE_ACTION_KEYS_SECRET
              value: gpu-fault-node-action-keys
            - name: GPU_FAULT_DCGM_METRICS_URL
              value: REPLACE_WITH_DCGM_METRICS_URL
            - name: GPU_FAULT_RECONCILE_SECONDS
              value: "5"
            - name: GPU_FAULT_INSTALL_RETRY_SECONDS
              value: "300"
            - name: GPU_FAULT_INSTALLER_MAX_UNAVAILABLE
              value: "1"
            - name: GPU_FAULT_INSTALLER_ACTIVE_DEADLINE_SECONDS
              value: "REPLACE_WITH_INSTALLER_ACTIVE_DEADLINE_SECONDS"
            - name: GPU_FAULT_INSTALLER_ALLOWED_NODES
              value: "*"
            - name: GPU_FAULT_INSTALLER_WAVE_CONFIG_MAP
              value: gpu-fault-node-installer-wave
          ports:
            - name: metrics
              containerPort: 9110
              protocol: TCP
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - test -f /tmp/reconciler-ready
            initialDelaySeconds: 2
            periodSeconds: 5
          # Readiness is a start-up breadcrumb and cannot answer "is the loop
          # turning". The apiserver calls do pass a request timeout
          # (REQUEST_TIMEOUT = (5, 60)), so a half-open connection now raises
          # instead of blocking forever; what is left is everything a per-call
          # timeout cannot bound -- a wedged wait, a lock never released, a
          # thread stuck outside the client -- which keeps the Pod Running and
          # Ready while no GPU node is reconciled again.
          # /tmp/reconciler-heartbeat is refreshed at the end of *every*
          # pass, including a pass that failed closed -- liveness answers
          # whether the loop is alive, not whether reconciliation succeeded.
          # 300 s is ~60 passes at GPU_FAULT_RECONCILE_SECONDS=5, so an idle or
          # merely slow reconciler is never restarted; the initial delay covers
          # the template load and the first LIST on a large cluster. No
          # control-plane call: a regional outage must not restart every
          # cluster's reconciler at once.
          livenessProbe:
            exec:
              command:
                - python
                - -c
                - >-
                  import os, sys, time;
                  p = "/tmp/reconciler-heartbeat";
                  sys.exit(0 if os.path.exists(p)
                  and time.time() - os.path.getmtime(p) < 300 else 1)
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: artifact
              mountPath: /artifact
              readOnly: true
            - name: installer-template
              mountPath: /etc/gpu-fault/installer-template
              readOnly: true
      volumes:
        - name: artifact
          configMap:
            name: gpu-fault-executor-wheel-0100
        - name: installer-template
          configMap:
            name: REPLACE_WITH_INSTALLER_TEMPLATE_CONFIG_MAP
