apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: gpu-fault-dcgm-exporter
  namespace: gpu-fault-system
  annotations:
    gpu-fault.io/cleanup-phase: producer
    gpu-fault.io/cleanup-order: "70"
spec:
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  selector:
    matchLabels:
      app: gpu-fault-dcgm-exporter
  template:
    metadata:
      labels:
        app: gpu-fault-dcgm-exporter
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      # The exporter is what makes a GPU node gradable: the node installer's
      # dcgm_ready check fails without it, the install Job fails, and the
      # reconciler recreates it every 300 s forever. A single-value
      # nodeSelector pinned that to one instance type, so every other
      # supported GPU type got zero Pods while `rollout status` passed
      # trivially. The list below is rendered by
      # regional_release_rendering.render_dcgm_exporter_manifest -- the one
      # renderer behind both the plan payload and the apply, so the DaemonSet an
      # approver reads is the one that lands -- from
      # node_installer_reconciler._INVENTORY, the same table the installer sizes
      # GPU/EFA counts from, with and without the `ml.` prefix, because HyperPod
      # labels nodes `ml.<type>` and self-managed EKS does not. It stays
      # fail-closed twice over: an unsupported instance type still gets no
      # exporter Pod at all, and a render that leaves the placeholder behind
      # fails the release instead of shipping this file verbatim.
      priorityClassName: system-node-critical
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node.kubernetes.io/instance-type
                    operator: In
                    values: [REPLACE_WITH_SUPPORTED_INSTANCE_TYPES]
      tolerations:
        - operator: Exists
      containers:
        - name: exporter
          image: nvcr.io/nvidia/k8s/dcgm-exporter:4.4.1-4.5.2-ubuntu22.04
          # -a 127.0.0.1:9400: hostNetwork puts this bind in the node's own
          # namespace, and the only consumer is the node's collector, which
          # dials loopback. Binding 0.0.0.0 published GPU UUIDs and hostnames
          # to the VPC unauthenticated.
          # -c 15000: DCGM's default collection interval is 30 s while the
          # collector scrapes every 15 s, so half of every throttling episode
          # was a repeat of the previous sample and could not be graded. Kept
          # in step with -c 15000 in
          # deploy/systemd/gpu-fault-dcgm-exporter.service.
          args: ["-a", "127.0.0.1:9400", "-c", "15000"]
          env:
            - name: DCGM_REMOTE_HOSTENGINE_INFO
              value: "127.0.0.1:5555"
            - name: DCGM_EXPORTER_COLLECTORS
              value: /etc/dcgm-exporter/gpu-fault-counters.csv
          ports:
            - name: metrics
              containerPort: 9400
              hostPort: 9400
          readinessProbe:
            httpGet:
              host: 127.0.0.1
              path: /metrics
              port: metrics
            initialDelaySeconds: 2
            periodSeconds: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: counters
              mountPath: /etc/dcgm-exporter/gpu-fault-counters.csv
              subPath: gpu-fault-counters.csv
              readOnly: true
      volumes:
        - name: counters
          configMap:
            name: gpu-fault-dcgm-counters
