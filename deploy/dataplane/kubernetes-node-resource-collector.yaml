apiVersion: v1
kind: ServiceAccount
metadata:
  name: gpu-fault-kubernetes-node-resource-collector
  namespace: gpu-fault-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: gpu-fault-kubernetes-node-resource-collector
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: gpu-fault-kubernetes-node-resource-collector
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: gpu-fault-kubernetes-node-resource-collector
subjects:
  - kind: ServiceAccount
    name: gpu-fault-kubernetes-node-resource-collector
    namespace: gpu-fault-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gpu-fault-kubernetes-node-resource-collector
  namespace: gpu-fault-system
  annotations:
    gpu-fault.io/cleanup-phase: producer
    gpu-fault.io/cleanup-order: "30"
    gpu-fault.io/deploy-mode: regional_rollout
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gpu-fault-kubernetes-node-resource-collector
  template:
    metadata:
      labels:
        app: gpu-fault-kubernetes-node-resource-collector
    spec:
      serviceAccountName: gpu-fault-kubernetes-node-resource-collector
      tolerations:
        - key: gpu-fault.io/quarantined
          operator: Exists
          effect: NoSchedule
        - key: node.kubernetes.io/unschedulable
          operator: Exists
          effect: NoSchedule
      initContainers:
        - name: install
          resources:
            requests:
              cpu: "25m"
              memory: 64Mi
            limits:
              cpu: "250m"
              memory: 256Mi
          image: public.ecr.aws/docker/library/python:3.12-slim
          command: ["/bin/sh", "-c"]
          args:
            - >-
              python -m venv /venv
              && /venv/bin/python -m pip install --no-cache-dir
              '/artifact/gpu_fault_control_plane-0.10.0-py3-none-any.whl[collectors]'
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: artifact
              mountPath: /artifact
              readOnly: true
            - name: venv
              mountPath: /venv
      containers:
        - name: collector
          image: public.ecr.aws/docker/library/python:3.12-slim
          command: ["/venv/bin/gpu-fault-collector"]
          args: ["kubernetes-node-resources"]
          env:
            - name: GPU_FAULT_CONTROL_PLANE_URL
              valueFrom:
                secretKeyRef:
                  name: gpu-fault-regional-connection
                  key: control-plane-url
            - name: GPU_FAULT_CLUSTER_ID
              valueFrom:
                secretKeyRef:
                  name: gpu-fault-regional-connection
                  key: cluster-id
            - name: GPU_FAULT_CONTROL_PLANE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: gpu-fault-regional-connection
                  key: cluster-token
            - name: GPU_FAULT_RUNTIME_PROFILE_VERSION
              value: REPLACE_WITH_RUNTIME_PROFILE_VERSION
            - name: GPU_FAULT_KUBERNETES_RESOURCE_INTERVAL_SECONDS
              value: "15"
            - name: GPU_FAULT_KUBERNETES_EFA_MISMATCH_SAMPLES
              value: "2"
            - name: GPU_FAULT_KUBERNETES_EFA_HEALTH_SUMMARY_SECONDS
              value: "300"
            - name: SSL_CERT_FILE
              value: /etc/gpu-fault/tls/ca.crt
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: artifact
              mountPath: /artifact
              readOnly: true
            - name: venv
              mountPath: /venv
              readOnly: true
            - name: control-plane-ca
              mountPath: /etc/gpu-fault/tls
              readOnly: true
            # Writable state directory for the durable event outbox.
            - name: collector-state
              mountPath: /var/lib/gpu-fault
      volumes:
        - name: artifact
          configMap:
            name: gpu-fault-control-plane-wheel-0100
        - name: control-plane-ca
          secret:
            secretName: gpu-fault-regional-connection
            items:
              - key: ca.crt
                path: ca.crt
        - name: venv
          emptyDir: {}
        - name: collector-state
          emptyDir:
            sizeLimit: 256Mi
