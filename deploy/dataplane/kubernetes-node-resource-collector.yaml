apiVersion: v1
kind: ServiceAccount
metadata:
  name: gpu-fault-kubernetes-node-resource-collector
  namespace: gpu-fault-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: gpu-fault-kubernetes-node-resource-collector
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: gpu-fault-kubernetes-node-resource-collector
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: gpu-fault-kubernetes-node-resource-collector
subjects:
  - kind: ServiceAccount
    name: gpu-fault-kubernetes-node-resource-collector
    namespace: gpu-fault-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gpu-fault-kubernetes-node-resource-collector
  namespace: gpu-fault-system
  annotations:
    gpu-fault.io/cleanup-phase: producer
    gpu-fault.io/cleanup-order: "30"
    gpu-fault.io/deploy-mode: regional_rollout
spec:
  replicas: 1
  # Singleton by design; Recreate, not RollingUpdate. All of the collector's
  # edge state lives in the process: per node/resource consecutive-mismatch
  # counters, the last persistent/healthy verdict, the last delivery time
  # and the next health-summary slot. A second replica overlapping during a
  # rollout starts with none of that, so on its first sample it re-posts a
  # `baseline:*` host-telemetry batch for every GPU node in the cluster,
  # and for as long as both run every edge and every health summary is
  # delivered twice -- each batch_id carries its own observed_at, so the
  # control plane sees two distinct batches and nothing deduplicates them.
  # `replicas` must stay 1; horizontal scale-out is not a supported lever
  # because the per-cluster load is one paginated node LIST plus one
  # managed-pod LIST per interval, not per-node work, so a second replica
  # doubles the posts without splitting the work. If the collector lags,
  # raise GPU_FAULT_KUBERNETES_RESOURCE_INTERVAL_SECONDS or
  # GPU_FAULT_KUBERNETES_NODE_LIST_PAGE_SIZE instead.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: gpu-fault-kubernetes-node-resource-collector
  template:
    metadata:
      labels:
        app: gpu-fault-kubernetes-node-resource-collector
    spec:
      serviceAccountName: gpu-fault-kubernetes-node-resource-collector
      priorityClassName: system-cluster-critical
      tolerations:
        - key: gpu-fault.io/quarantined
          operator: Exists
          effect: NoSchedule
        - key: node.kubernetes.io/unschedulable
          operator: Exists
          effect: NoSchedule
      containers:
        - name: collector
          image: public.ecr.aws/docker/library/python:3.12-slim
          command: ["gpu-fault-collector"]
          args: ["kubernetes-node-resources"]
          env:
            - name: PATH
              value: >-
                /opt/gpu-fault/executor/bin:/opt/app-root/bin:/opt/app-root/src/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
            - name: GPU_FAULT_CONTROL_PLANE_URL
              valueFrom:
                secretKeyRef:
                  name: gpu-fault-regional-connection
                  key: control-plane-url
            - name: GPU_FAULT_CLUSTER_ID
              valueFrom:
                secretKeyRef:
                  name: gpu-fault-regional-connection
                  key: cluster-id
            - name: GPU_FAULT_CONTROL_PLANE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: gpu-fault-regional-connection
                  key: cluster-token
            - name: GPU_FAULT_RUNTIME_PROFILE_VERSION
              value: REPLACE_WITH_RUNTIME_PROFILE_VERSION
            - name: GPU_FAULT_KUBERNETES_RESOURCE_INTERVAL_SECONDS
              value: "15"
            - name: GPU_FAULT_KUBERNETES_EFA_MISMATCH_SAMPLES
              value: "2"
            - name: GPU_FAULT_KUBERNETES_EFA_HEALTH_SUMMARY_SECONDS
              value: "300"
            - name: GPU_FAULT_KUBERNETES_NODE_LIST_PAGE_SIZE
              value: "500"
            - name: SSL_CERT_FILE
              value: /etc/gpu-fault/tls/ca.crt
          # This collector has no HTTP surface, and readiness would only
          # prove the process started. `list_node` and
          # `list_pod_for_all_namespaces` pass no request timeout, so one
          # half-open apiserver connection blocks the cycle forever while the
          # Pod stays Running and the whole cluster's EFA/GPU advertisement
          # coverage goes quiet -- exactly the silence this collector exists to
          # report. /tmp/node-resource-collector-alive is refreshed at the end
          # of every cycle, including a cycle that failed, so the probe answers
          # "is the loop turning" and never fires on an idle cluster: 300 s is
          # 20 cycles at GPU_FAULT_KUBERNETES_RESOURCE_INTERVAL_SECONDS=15. No
          # control-plane call, so a regional outage cannot restart every
          # cluster's collector at once.
          livenessProbe:
            exec:
              command:
                - python
                - -c
                - >-
                  import os, sys, time;
                  p = "/tmp/node-resource-collector-alive";
                  sys.exit(0 if os.path.exists(p)
                  and time.time() - os.path.getmtime(p) < 300 else 1)
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: artifact
              mountPath: /artifact
              readOnly: true
            - name: control-plane-ca
              mountPath: /etc/gpu-fault/tls
              readOnly: true
            # Writable state directory for the durable event outbox.
            - name: collector-state
              mountPath: /var/lib/gpu-fault
            # readOnlyRootFilesystem makes /tmp read-only too, and the liveness
            # heartbeat above lives there: without this volume every touch
            # fails with EROFS and the probe restarts a perfectly healthy Pod.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: artifact
          configMap:
            name: gpu-fault-executor-wheel-0100
        - name: control-plane-ca
          secret:
            secretName: gpu-fault-regional-connection
            items:
              - key: ca.crt
                path: ca.crt
        - name: collector-state
          emptyDir:
            sizeLimit: 256Mi
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
