apiVersion: v1
kind: ServiceAccount
metadata:
  name: gpu-fault-completion-watcher
  namespace: gpu-fault-system
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: gpu-fault-completion-watcher-outbox
  namespace: gpu-fault-system
data:
  active-attempts.json: "{}"
  events.json: "[]"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: gpu-fault-completion-watcher
# Read-only across the cluster. The watcher runs one Pod watch over every
# namespace (list_pod_for_all_namespaces), which RBAC cannot scope, so the
# read verbs stay cluster-wide. Every write -- annotating Pods, suspending
# Jobs/PyTorchJobs/JobSets, reading Pod logs and the `nvidia-smi` exec that
# GPU_FAULT_DISCOVER_POD_GPU_UUIDS enables -- is granted per workload
# namespace by the Role + RoleBinding the GPU rollout renders for each
# `allowed_namespaces` entry (regional_release_gpu_rollout
# .render_workload_namespace_rbac). `pods/exec` in particular must never be
# cluster-wide: resourceNames does not apply to subresources, so a
# ClusterRole grant is a shell into every Pod on the cluster.
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get"]
  - apiGroups: ["kubeflow.org"]
    resources: ["pytorchjobs"]
    verbs: ["get"]
  - apiGroups: ["jobset.x-k8s.io"]
    resources: ["jobsets"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["gpu-fault-completion-watcher-outbox"]
    verbs: ["get", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: gpu-fault-completion-watcher
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: gpu-fault-completion-watcher
subjects:
  - kind: ServiceAccount
    name: gpu-fault-completion-watcher
    namespace: gpu-fault-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gpu-fault-completion-watcher
  namespace: gpu-fault-system
  annotations:
    gpu-fault.io/cleanup-phase: producer
    gpu-fault.io/cleanup-order: "20"
    gpu-fault.io/deploy-mode: regional_rollout
spec:
  replicas: 1
  # Singleton by design; Recreate, not RollingUpdate. The watcher keeps its
  # attempt specs and observations, the missing-attempt tracker and the
  # `_terminal_sent` / `_failure_sent` / `_workloads_stopped` sets in the
  # process; only the write-ahead outbox and the active-attempt snapshot
  # are durable, in the shared ConfigMap above, written with a
  # resourceVersion compare-and-swap that gives up after three 409s. Two
  # replicas overlapping during a rollout each run their own Pod watch and
  # reconcile every attempt. The control plane is idempotent on event_key
  # for /v1/attempts/terminal and /v1/attempts/failure-detected (the second
  # POST is answered `duplicate: true`), so overlap does not open a second
  # incident, but the sent-sets are per process, so each replica re-posts
  # what the other already delivered, /v1/workload-observations traffic
  # doubles, the two replicas race the outbox ConfigMap and an append that
  # loses three CAS rounds raises and defers that attempt's delivery to the
  # next pass, the new replica's missing-attempt count restarts at zero,
  # and if the control plane is unreachable past
  # GPU_FAULT_PASSIVE_STOP_FALLBACK_SECONDS both replicas independently
  # suspend the same workloads and capture their logs twice. `replicas`
  # must stay 1; horizontal scale-out is not a supported lever because the
  # per-cluster load is one Pod watch, not per-node work. If the watcher
  # lags, raise GPU_FAULT_WATCHER_RECONCILE_DEBOUNCE_SECONDS so bursts of
  # Pod events coalesce into fewer reconcile passes, and raise the CPU
  # limit below; GPU_FAULT_WATCHER_POLL_SECONDS only paces the polling
  # fallback used when the watch client is unavailable.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: gpu-fault-completion-watcher
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "9109"
      labels:
        app: gpu-fault-completion-watcher
    spec:
      serviceAccountName: gpu-fault-completion-watcher
      tolerations:
        - key: gpu-fault.io/quarantined
          operator: Exists
          effect: NoSchedule
        - key: node.kubernetes.io/unschedulable
          operator: Exists
          effect: NoSchedule
      containers:
        - name: watcher
          image: public.ecr.aws/docker/library/python:3.12-slim
          command: ["gpu-fault-completion-watcher"]
          env:
            - name: PATH
              value: >-
                /opt/gpu-fault/executor/bin:/opt/app-root/bin:/opt/app-root/src/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
            - name: GPU_FAULT_CONTROL_PLANE_URL
              valueFrom:
                secretKeyRef:
                  name: gpu-fault-regional-connection
                  key: control-plane-url
            - name: GPU_FAULT_CLUSTER_ID
              valueFrom:
                secretKeyRef:
                  name: gpu-fault-regional-connection
                  key: cluster-id
            - name: GPU_FAULT_CONTROL_PLANE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: gpu-fault-regional-connection
                  key: cluster-token
            - name: SSL_CERT_FILE
              value: /etc/gpu-fault/tls/ca.crt
            - name: GPU_FAULT_WATCHER_ENVIRONMENT
              value: hyperpod-eks
            - name: GPU_FAULT_WATCHER_POLL_SECONDS
              value: "3"
            - name: GPU_FAULT_WATCHER_WATCH_TIMEOUT_SECONDS
              value: "30"
            - name: GPU_FAULT_WATCHER_RECONCILE_DEBOUNCE_SECONDS
              value: "0.5"
            - name: GPU_FAULT_WATCHER_CLEANUP_TIMEOUT_SECONDS
              value: "30"
            - name: GPU_FAULT_PROCESSOR_RECEIPT_TIMEOUT_SECONDS
              value: "120"
            - name: GPU_FAULT_PROCESSOR_RECEIPT_POLL_SECONDS
              value: "0.25"
            - name: GPU_FAULT_PASSIVE_STOP_FALLBACK_SECONDS
              value: "30"
            - name: GPU_FAULT_DEFAULT_RESTART_BUDGET
              value: "1"
            - name: GPU_FAULT_PUBLISH_WORKLOAD_OBSERVATIONS
              value: "true"
            - name: GPU_FAULT_DISCOVER_POD_GPU_UUIDS
              value: "true"
            - name: GPU_FAULT_COMPLETION_WATCHER_METRICS_PORT
              value: "9109"
          ports:
            - name: metrics
              containerPort: 9109
              protocol: TCP
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: artifact
              mountPath: /artifact
              readOnly: true
            - name: control-plane-ca
              mountPath: /etc/gpu-fault/tls
              readOnly: true
      volumes:
        - name: artifact
          configMap:
            name: gpu-fault-executor-wheel-0100
        - name: control-plane-ca
          secret:
            secretName: gpu-fault-regional-connection
            items:
              - key: ca.crt
                path: ca.crt
