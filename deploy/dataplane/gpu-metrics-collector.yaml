apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: gpu-fault-metrics-collector
  namespace: gpu-fault-system
  annotations:
    gpu-fault.io/cleanup-phase: producer
    gpu-fault.io/cleanup-order: "60"
spec:
  selector:
    matchLabels:
      app: gpu-fault-metrics-collector
  template:
    metadata:
      labels:
        app: gpu-fault-metrics-collector
    spec:
      tolerations:
        - operator: Exists
      containers:
        - name: collector
          resources:
            requests:
              cpu: "100m"
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          image: REPLACE_WITH_GPU_FAULT_IMAGE
          command: ["gpu-fault-collector"]
          args:
            - dcgm
            - --metrics-url
            - "$(GPU_FAULT_DCGM_METRICS_URL)"
          envFrom:
            - configMapRef:
                name: gpu-fault-collector
            - secretRef:
                name: gpu-fault-collector
                optional: true
          env:
            - name: PATH
              value: >-
                /opt/gpu-fault/executor/bin:/opt/app-root/bin:/opt/app-root/src/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: HOST_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: GPU_FAULT_DCGM_METRICS_URL
              value: "http://$(HOST_IP):9400/metrics"
            - name: GPU_FAULT_DCGM_EDGE_FILTER_ENABLED
              value: "true"
            - name: GPU_FAULT_DCGM_HEALTH_SUMMARY_SECONDS
              value: "300"
            - name: GPU_FAULT_DCGM_EDGE_CONFIRMATION_SAMPLES
              value: "3"
            - name: GPU_FAULT_DCGM_HISTORY_MAX_POINTS
              value: "20"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            capabilities:
              drop: ["ALL"]
          # The durable outbox lives under the state directory; with a
          # read-only root filesystem it needs a writable volume or
          # every buffered event is silently dropped.
          volumeMounts:
            - name: collector-state
              mountPath: /var/lib/gpu-fault
      volumes:
        - name: collector-state
          emptyDir:
            sizeLimit: 256Mi
