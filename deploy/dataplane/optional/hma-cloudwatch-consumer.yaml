apiVersion: v1
kind: ServiceAccount
metadata:
  name: gpu-fault-hma-cloudwatch-consumer
  namespace: gpu-fault-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gpu-fault-hma-cloudwatch-consumer
  namespace: gpu-fault-system
  annotations:
    gpu-fault.io/cleanup-phase: producer
    gpu-fault.io/cleanup-order: "50"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gpu-fault-hma-cloudwatch-consumer
  template:
    metadata:
      labels:
        app: gpu-fault-hma-cloudwatch-consumer
    spec:
      serviceAccountName: gpu-fault-hma-cloudwatch-consumer
      containers:
        - name: consumer
          resources:
            requests:
              cpu: "50m"
              memory: 128Mi
            limits:
              cpu: "500m"
              memory: 512Mi
          image: public.ecr.aws/docker/library/python:3.12-slim
          command: ["gpu-fault-collector"]
          args: ["sqs-hma"]
          env:
            - name: PATH
              value: >-
                /opt/gpu-fault/executor/bin:/opt/app-root/bin:/opt/app-root/src/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
            - name: GPU_FAULT_CONTROL_PLANE_URL
              value: http://gpu-fault-api-canary:8080
            - name: GPU_FAULT_HMA_QUEUE_URL
              value: REPLACE_WITH_QUEUE_URL
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            runAsUser: 65532
          volumeMounts:
            # Writable state directory for the durable event outbox.
            - name: collector-state
              mountPath: /var/lib/gpu-fault
      volumes:
        - name: artifact
          configMap:
            name: gpu-fault-executor-wheel-0100
        - name: collector-state
          emptyDir:
            sizeLimit: 256Mi
