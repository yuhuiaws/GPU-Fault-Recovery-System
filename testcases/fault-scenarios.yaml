  manifest: scripts/e2e/regional/manifests/xid45-correlation-canary.yaml
  capture_processing_trace: true
- id: GF-LIVE-KMSG-XID45-XID14-20260724
  title: HyperPod 真实 /dev/kmsg XID 45 后跟 XID 14
  category: live-kernel-log-correlation
