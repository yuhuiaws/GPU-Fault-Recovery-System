- id: GF-LIVE-XID45-AURORA-HA-20260724
  title: HyperPod XID 45 Aurora 跨副本关联
  category: live-hyperpod-control-plane
  level: end-to-end
  risk: non-destructive
  problem: 验证 XID 45 先到、companion 后到时，相关状态能通过 Aurora 跨控制面副本持久化。
  injection: 向两个不同节点上的 canary Pod 连续提交同 GPU、同 boot ID 的 synthetic XID 45 和 XID 14。
  expected:
  - XID 45 在窗口结束前为 PENDING_CORRELATION 且不创建 incident/workflow
  - Aurora 中只有一个副本取得最终处理 lease
  - 窗口结束后 XID 45 继承 XID 14 的 IGNORE/NO_ACTION
  - XID 45 复用 XID 14 的 incident 且不创建 workflow
  - canary 和三个生产副本读取完全相同的 FINALIZED 结果
  evidence:
    verdict: PASS
    verified:
      case_digest: 6eac06f6e75adde33f1a97504834b70dc82ea7111264a95af955e666f49808d4
  automation: manual
