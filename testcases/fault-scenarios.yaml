  - 未提供隔离证据或提供另一节点的证据时 safe_to_submit=false，错误含 trusted scheduler isolation evidence is missing
  - reboot 开关关闭时 safe_to_submit=false，错误含 HyperPod REBOOT mutation is disabled by configuration
  - CloudTrail 中出现 RebootClusterNodes 且 Username 为 executor 的 role 而非控制面 role
  - 控制面提交记录状态为 SUBMITTED 且 requested_node_identifiers 与目标节点一致
  - 提交后删除 executor Pod 强制重启，重放读到 SUBMITTED 并返回 duplicate，BatchRebootClusterNodes 只出现一次
  - EC2 instance incarnation 或 boot ID 变化
  - Node Agent 重新注册且 artifact SHA 不变
