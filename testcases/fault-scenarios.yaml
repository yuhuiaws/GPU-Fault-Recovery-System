    expected:
    - "只归一化出一个 XID {value} 事件"
    - 保留 sequence、boot ID、monotonic timestamp、PCI BDF 和 evidence reference
    - 使用固定 NVIDIA Catalog 生成确定性决策；证据不足的工作流必须阻塞
