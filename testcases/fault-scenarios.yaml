  risk: live-kernel-log-injection
  problem: 验证生产 KernelLogCollector 采集 XID 45 后，能在 30 秒窗口内关联同 GPU 的后续 XID 14。
  injection: 在同一真实 HyperPod 节点向宿主机 /dev/kmsg 写入标准 XID 45 消息，5 秒后写入同 PCI BDF 的 XID 14。
