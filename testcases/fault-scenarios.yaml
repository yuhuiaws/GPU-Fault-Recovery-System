- id: GF-POL-003
  title: XID 45 关联主故障
  category: xid-policy
  level: component
  risk: non-destructive
  problem: XID 45 先到达一个控制面副本，XID 79 后到达另一个副本。
  injection: 同一 GPU 先注入 XID 45，再在 30 秒窗口内向另一副本注入 XID 79。
  expected:
  - 窗口闭合前为 PENDING_CORRELATION 且不创建 workflow
  - 沿用 XID 79 的主恢复动作
  - XID 45 与 XID 79 复用同一 incident/workflow
  - 只有一个 HA 副本取得最终处理 lease
  automation: pytest
  pytest_nodeid: tests/metrics/test_xid_correlation.py::test_xid45_waits_and_follows_later_companion_across_replicas

