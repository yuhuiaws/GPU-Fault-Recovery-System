  - 两个事件映射到同一真实 GPU UUID、ACTIVE attempt 和 PyTorchJob
  - XID 45 在窗口结束后继承 XID 14 的 IGNORE/NO_ACTION
  - 两个事件复用 XID 14 incident 且不创建 workflow
  - 原训练 Pod 和 attempt 不变，rank 0/rank 8 all-reduce 持续正常
  evidence:
    verdict: PASS
    verified:
      case_digest: a133770e1aa0346798a00783c0c5a119cd214dedb876e855a84fb6c1b2dd44c5
  automation: manual
  manifest: scripts/e2e/regional/manifests/fault-injection/kmsg-xid45-xid14.yaml
  procedure: docs/故障模拟测试手册.md#751-xid-45-跨副本与-companion-真机关联
  capture_processing_trace: true
