- id: GF-REGIONAL-DESTR-012
  title: 任务自动恢复由本方案独占且 HyperPod auto-resume 必须处于禁用状态
  category: regional-destructive-acceptance
  level: staging
  risk: live-workload-restart
  problem: >-
    方案硬约束（2026-08-05，概要设计 §2.1 约束 3）要求禁用 HyperPod 的任务自动恢复， 训练任务的自动恢复完全由本方案接管：受管任务不得带 sagemaker.amazonaws.com/enable-job-auto-resume=true，Slurm 不得带 --auto-resume=1， runtime profile 的 workloadStop/workloadRestart 恒为 OWN。 该约束有两道落实：纳管前置检查（部署期，人工，会漏）与运行期 fail-closed 守卫 KubernetesWorkflowAdapter._managed_job_recovery_conflict()—— _set_workloads() 取回 workload 对象后立即用 from_eks_annotations() 复判 annotation， 任一 workload 为 ENABLED 即返回 FAILED，且守卫排在 _mark_terminating_pods() 与所有 patch 之前，STOP_WORKLOADS 与 RESTART_WORKLOAD 共用该入口。 生产 profile 由 deploy.sh:1527-1530 与 :1579-1586 静态填 OWN，正好是唯一合规形态。 故意不提供 per-workload 豁免注解：能违规开启 auto-resume 的一方同样能加豁免注解。 原 B 组（故意复现双写者）已作废：其前提是 auto-resume 为合法配置， 且守卫接通后双写在合规部署里已不可复现。
  injection: 分四组——B 组纯只读遍历受管命名空间核对 annotation 与 profile；A 组任务不带 annotation 且 profile 默认 OWN，注入 XID 11；D 组在一次性单节点 Job 上打违规 annotation（profile 不改）后注入 XID 11 验运行期守卫；C 组（可选）把 profile 误改为 DELEGATE 后注入 XID 11 验 fail-closed，任务配置全程保持合规。组内次序 B → A → D → C。
  expected:
  - B 组遍历全部受管命名空间后 enable-job-auto-resume 开启的任务集合为空（Slurm 脚本核对当前不执行，Slurm 编排暂不支持）
  - B 组所有副本的 profile 中 workloadStop 与 workloadRestart 均为 OWN 且 owner 为自建 adapter，副本间不一致即 FAIL
  - B 组报告必须给出遍历的命名空间清单与逐任务取值，只写未发现不构成证据
  - B 组失败的后果不是双写而是该任务失去本方案的全部自动恢复能力（每次故障停在 FAILED），仍阻断上线
  - A 组断言与 DESTR-009 一致，且 step execution_owner 为 gpu-fault-kubernetes-adapter 而非 hyperpod-managed-job-recovery
  - A 组只证明合规配置被放行，违规配置被拒绝由 D 组承担；单靠 A 组无法区分读了并判为合规与根本没读
  - D 组 STOP_WORKLOADS step FAILED 且 error 含 enable-job-auto-resume is enabled
  - D 组 step details 含 managed_job_recovery_workloads 且只列违规 workload，另含 required_annotation 与 required_annotation_value 为 absent or false 以及可直接执行的 remediation_commands
  - D 组该 Job 的 spec.suspend 未被改动且 Pod UID 全部不变，executor 日志中无针对该 Job 的 Kubernetes 写操作，证明守卫在任何写操作之前生效
  - D 组删除违规 annotation 后用新 record_id 重放同一注入必须转为正常路径并跑完 RESTART_WORKLOAD（2026-08-06 起由可选升级为必做，只跑主体无法区分守卫每次重读与守卫把该 workload 永久拉黑）
  - C 组 step execution_owner 为 hyperpod-managed-job-recovery 且停在 WAITING，details 含 mutation_submitted_by_control_plane 为 false 与 requires_external_confirmation 为 true
  - C 组 executor 日志中无任何针对该 Job 的 Kubernetes 写操作，收到指明恢复已委派的告警通知，写入 confirmed_adapter_operation_ids 后重放转 SUCCEEDED 且含 externally_confirmed 为 true
  - C组必须在隔离数据库另注册唯一临时profile版本，不得覆盖当前site的内容寻址profile；改claims时必须同步补observed条目
  - C 组 owner 必须在 GPU_FAULT_MANAGED_RECOVERY_OWNERS 内且不在 GPU_FAULT_REMOTE_EXECUTION_OWNERS 内，否则 step 会被 RegionalRemoteWorkflowAdapter 抢走真去动 K8s
  - C组结束后删除隔离测试数据库；当前site profile内容与指纹必须始终未变
  evidence:
    verdict: PASS
    verified:
