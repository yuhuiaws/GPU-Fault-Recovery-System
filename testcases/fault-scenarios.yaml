  category: regional-collector
  level: live
  risk: live-non-destructive
  problem: >-
    人工介入类 XID 从未被真机驱动， 而 CHECK_MECHANICALS 是其中唯一一条能形成完整闭环的路径。
  injection: >-
    在节点上注入 XID 54，等待 WAITING，先写错误fencing确认值再写正确值； 当前设计不隔离节点，确认后workflow直接完成。
  expected:
  - 状态机从 WAITING 经人工 annotation 走到 SUCCEEDED
  - 不做 GPU reset、不重启节点、不停任务、不刷固件
  - 节点全程Ready、可调度、无taint
  - Node Agent ledger与provider mutation均为0
  evidence:
    verdict: NOT_RUN
  automation: manual
  procedure: docs/区域模式端到端验收测试用例.md#gf-regional-collect-009
  related_pytest: tests/execution/test_misc.py::test_mechanical_inspection_waits_for_incident_fenced_annotation
- id: GF-REGIONAL-COLLECT-010
  title: UPDATE_SWFW 未配置固件目标版本时必须 fail-closed
  category: regional-collector
  level: live
  risk: live-isolation
  problem: >-
    UPDATE_SWFW 是唯一会真的刷固件的 XID 动作类， 刷固件在生产 GPU 节点上不可逆，因此只验 fail-closed 方向。
  injection: >-
    在不配置固件命令与目标版本的前提下注入一次 XID 78 的 kmsg 记录。
  expected:
  - 动作 blocked，不刷固件
  - 不 quiesce 节点
  - 任一检查失败即 quarantine 且节点不恢复调度
  - 除 quarantine 外零副作用
  evidence:
    verdict: NOT_RUN
  automation: manual
  procedure: docs/区域模式端到端验收测试用例.md#gf-regional-collect-010
  related_pytest: tests/orchestration/test_misc.py::test_failed_firmware_remediation_escalates_directly_to_support
- id: GF-REGIONAL-COLLECT-011
  title: SXID SCOPE_DEPENDENT_RESET 两个方向都 fail-closed
  category: regional-collector
  level: live
  risk: live-isolation
  problem: >-
    SCOPE_DEPENDENT_RESET 的 42 条码此前只有单测， 而这道闸的语义是“scope 不可信就不敢动 GPU”。
  injection: >-
    向真实 fabric manager 日志注入四条 SXID 记录， 分别构造有 switch 与 port 的 ACCESS 方向与无 switch 的 UNKNOWN 方向。
  expected:
  - 有 switch 与 port 时判 ACCESS，但空闲节点拿不到 participating_gpu_uuids 仍 blocked
  - 无 switch 时判 UNKNOWN 并以缺可信 port-scope 映射 blocked
  - 解码字段与目录逐字吻合
  - 零破坏，只有控制面侧 quarantine
  - 游标正确前进
  evidence:
    verdict: NOT_RUN
  automation: manual
  procedure: docs/区域模式端到端验收测试用例.md#gf-regional-collect-011
  related_pytest: tests/orchestration/test_sxid_topology.py::test_conflicting_or_untrusted_topology_fails_closed
- id: GF-REGIONAL-COLLECT-012
  title: XID RESTART_APP 从 API 重放换成真 kmsg 注入
  category: regional-collector
  level: live
  risk: live-isolation
  problem: >-
    RESTART_APP 这 48 条是占比最大的一类，此前只走过 API 重放， kmsg 采集器的正则、去重与权限从未被这一类驱动。
  injection: 通过真实 /dev/kmsg 注入 RESTART_APP 类 XID，并复核一条最常见的 MMU fault。
  expected:
  - kmsg 采集链走通，record_id、evidence_ref 与三元组齐全
  - 两次写入相同文本因kernel sequence不同形成两条不同record_id；相同原始sequence的去重由隔离重放夹具验证
  - 判定结果与目录一致
  - 空闲节点上有一道真实安全闸阻止执行段完成
  - 本用例只验采集层前半段与判定正确性，不验执行
  evidence:
    verdict: NOT_RUN
  automation: manual
  procedure: docs/区域模式端到端验收测试用例.md#gf-regional-collect-012
  related_pytest: tests/orchestration/test_misc.py::test_restart_app_requires_workload_identity
- id: GF-REGIONAL-COLLECT-013
  title: XID RESET_GPU 真 kmsg 注入并真的执行单卡 reset
  category: regional-collector
  level: staging
  risk: destructive
  problem: RESET_GPU 这 14 条此前只有 API 重放，单卡 reset 的真机链路从未跑通。
  injection: >-
    通过真实 /dev/kmsg 注入 RESET_GPU 类 XID，让 QUIESCE_GPU_SERVICES 真的停 kubelet 并执行单卡 reset；注入前先用 nohup setsid 起宿主机侧采样器写日志到 /var/log。
  expected:
  - 真 kmsg 驱动出真实单卡 reset
  - reset 后自动恢复调度
  - boot_id 不变，证明没有重启节点
  - quiesce 期间的证据由宿主机侧采样器完整留存
  evidence:
    verdict: NOT_RUN
  automation: manual
  procedure: docs/区域模式端到端验收测试用例.md#gf-regional-collect-013
  related_pytest: tests/node_agent/test_remediation.py::test_gpu_reset_is_idempotent_and_rechecks_clients
- id: GF-REGIONAL-COLLECT-014
  title: SXID整机GPU与NVSwitch reset的双证据门与正向
  category: regional-collector
  level: staging
  risk: destructive
  problem: >-
    RESET_ALL_GPUS_AND_NVSWITCHES 要求 fabric_partition 与完整 GPU inventory 双证据， fail-closed 分支此前只有单测，正向从未真机跑过。
  injection: >-
    先把事件时间设置为约2分钟前以超过inventory未来容忍窗口但仍处于900秒故障动作代际内，构造缺证据方向；再用SXID10003与19084走正向整机reset。
  expected:
  - 缺 fabric_partition 或缺完整 inventory 时 blocked
  - 正向整机全部GPU与NVSwitch reset真的发生
  - 节点被 quiesce 后自动恢复
  - 两个方向都不降级为节点重启或替换
  evidence:
    verdict: NOT_RUN
  automation: manual
  procedure: docs/区域模式端到端验收测试用例.md#gf-regional-collect-014
  related_pytest: tests/node_agent/test_remediation.py::test_full_fabric_reset_verifies_inventory_and_is_idempotent
- id: GF-REGIONAL-COLLECT-016
  title: 真实分布式训练下的 RESTART_APP 与 RESET_GPU 执行段
  category: regional-collector
  level: live
  risk: destructive
  problem: >-
    COLLECT-012 把执行段声明为未验， 因为空闲节点上 RESTART_APP 不可能执行完成。
  injection: >-
    在真实三节点分布式训练 workload 上注入 RESTART_APP 与 RESET_GPU， D 段还会 quiesce 节点并停 kubelet。
  expected:
  - 真的删除并重建训练 Pod，执行段跑完
  - RUN_DCGM_DIAGNOSTIC 的纯 CONFIG failure 不隔离；硬件 FAIL、缺 severity 的 FAIL 或 INCONCLUSIVE 仍走 DRAIN_AND_QUARANTINE
  - 多采样交集按 gpu_uuid 与 pid 与 device 三元组判定，瞬时放行、持久拒绝复位
  - 必须排在 COLLECT-015 之前，否则真重启会毁掉训练作业与采样器
  evidence:
    verdict: NOT_RUN
  automation: manual
  procedure: docs/区域模式端到端验收测试用例.md#gf-regional-collect-016
  related_pytest: tests/hyperpod/test_e2e_distributed_xid_reset.py::test_three_node_job_stops_before_two_fault_gpu_resets
