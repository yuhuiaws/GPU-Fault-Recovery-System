- id: GF-REGIONAL-NET-006
  title: 动作执行期间丢失 command lease，executor 不在丢失的 lease 下提交结果并计数，重新 claim 后由幂等账本收尾
  category: regional-network-resilience
  level: live
  risk: live-non-destructive
  problem: >-
    NET-002 证明的是动作结束后网络才中断、迟到结果被 409 拒绝；本用例证明动作仍在跑时 lease 就已丢失的那一侧：
    CommandLeaseWatch 连续续租失败达到上限（或本地 lease 窗口过期）后，_execute_and_report 必须把结果扣留而不是
    在自己已不能担保的 lease 下 POST，results_withheld_total 与 lease_lost_total 必须计数，
    reported_failures 必须不动，且这些计数要出现在 claim-state breadcrumb 里。
  injection: >-
    在合成集群 perf-cap-000 播种一条 FREEZE_EVIDENCE remote command（node_id 为合成名，无 Node Agent）；
    GPU 面探针 executor Pod 运行部署镜像自带的 ClusterActionExecutor（lease 60 s、续租失败上限 3），
    其本地适配器在观察到网络封禁后把动作持续 100 s；封禁由 Pod 内 loopback 代理实现，
    封禁期间对控制面的新连接直接拒绝（续租快速失败），120 s 后解除，150 s 自动回滚兜底。
  expected:
  - "动作返回时 lease 已被判定丢失：executor 日志含 regional command lease treated as lost 与 withheld a result under a lost lease，且不含结果提交的 rejected request (409)"
  - "results_withheld_total=1、lease_lost_total>=1、lease_renewal_failures>=3、reported_failures=0、unexpected_failures=0、cancellations_observed_total=0，claimed_total=2（首次 claim 加一次重新 claim）"
  - 动作线程上的 node-action lease guard 在动作结束时给出非空 hold reason（续租失败或本地过期），即一次此刻开始的节点动作会被拒绝
  - 封禁解除后同一 executor 重新 claim 该命令并从幂等账本以 cached=true 收尾为 SUCCEEDED；物理副作用计数恰为 1
  - 扣留期间命令保持 LEASED/PENDING，未出现任何终态；封禁在 120 s 后由 runner 解除，自动回滚未触发
  - claim-state breadcrumb 的 counters 与 executor 最终 metrics_snapshot 逐项相等
  - 清理后数据库、注册表、Kubernetes 三处残留均为零
  evidence:
    verdict: NOT_RUN
  automation: manual
  procedure: docs/区域模式端到端验收测试用例.md#gf-regional-net-006
  related_pytest: tests/regional/test_net006_lease_loss.py::test_the_counter_contract_passes_on_one_withheld_result_and_one_reclaim
- id: GF-REGIONAL-NET-007
  title: 节点隔离步骤遭遇瞬时 Kubernetes API 故障时步骤 WAITING 重试而非 FAILED，故障消退后工作流照常收尾
  category: regional-network-resilience
  level: live
  risk: live-node-mutation
  problem: >-
    ARCH-B1 把 Kubernetes 409/429/5xx 与 urllib3 超时/断连归为可重试适配器错误，让控制面 executor 的步骤进入 WAITING
    （details.retryable_adapter_error）而不是 FAILED 并升级隔离。但在区域拓扑里 Kubernetes 调用发生在 GPU 面 cluster executor，
    其异常出口原先只认 socket 级错误与 botocore 传输错误，不认 ApiException 与 urllib3 错误，一次真机的瞬时 API 故障
    会以 executor-internal-error FAILED 收尾并升级到 ESCALATE_SUPPORT。ARCH-INTEGRATION 已把 retryable_adapter_error
    接进 cluster executor 的异常出口（计数 retryable_adapter_errors_total）。本用例是这条对称契约在区域部署上的验收。
  injection: >-
    （设计，尚未实现驱动）在 GPU EKS 上为目标节点创建一条 ValidatingWebhookConfiguration：rules 仅 nodes 的 UPDATE，
    objectSelector 仅 kubernetes.io/hostname=<目标节点>，matchConditions 仅 executor ServiceAccount 的 username，
    failurePolicy=Fail、timeoutSeconds=1、clientConfig 指向不存在的 Service，使该节点上 executor 的 node patch 得到 HTTP 500；
    随后按 COLLECT-017 A 段解绑一个 EFA function 开出 REMEDIATE_EFA_DRIVER 工作流（含 MARK_UNSCHEDULABLE 与 RESTORE_SCHEDULING），
    60 s 后删除 webhook；由执行器镜像运行的 Job 作为 deadman 在到点时独立删除同名 webhook。不重启节点，不做 reset。
  expected:
  - 命中 500 的节点隔离步骤在 remote command 上为 WAITING，result_details 带可重试标记（retryable_transport_error 或区域回放的 retryable_adapter_error），控制面 step_execution 为 WAITING 而非 FAILED
  - webhook 删除后同一步骤 SUCCEEDED，工作流按 COLLECT-017 A 段七步收尾为 SUCCEEDED，incident RECOVERED，节点最终 Ready 且可调度
  - 全程不出现 ESCALATE_SUPPORT、QUARANTINE、RESTART_NODE、REPLACE_NODE；CloudTrail provider 变更动词集合为空
  - webhook 与 deadman Job/ServiceAccount/ClusterRole/ClusterRoleBinding 零残留；EFA function 由控制面而非宿主 fail-safe 重绑
  evidence:
    verdict: NOT_RUN
  automation: manual
  procedure: docs/区域模式端到端验收测试用例.md#gf-regional-net-007
  related_pytest: tests/execution/test_retryable_adapter_errors.py::test_transient_adapter_error_becomes_a_waiting_step_not_a_failure
- id: GF-REGIONAL-NET-008
  title: Collector outbox 的死信语义：403 保持可重放并在 token 恢复后送达，回放 4xx 死信并可 requeue，中断期间不重开 /dev/kmsg
  category: regional-network-resilience
  level: live
  risk: live-kernel-log-injection
  problem: >-
    修复前 401/403 一次即死信（token 轮换窗口丢掉全节点故障流）、回放遇到确定性 4xx 永远占住重放窗口、
    投递失败会让 kernel 采集器 reopen /dev/kmsg 到 live 端丢失中间行（ARCH-G2/G3/G4）。
    gpu-fault-collector outbox list/stats/requeue-dead 是唯一的死信入口，此前没有真机证据。
  injection: >-
    A：在 gpu-fault-kernel-collector.service 上开 drop-in 环境窗口注入节点上随机生成的错误 cluster token 并重启该单元，
    向真实 /dev/kmsg 用户态写入 2 条 monitor-only XID 63；B：在该单元停止（已 arm 兜底 start）时向 kernel.ndjson 追加一条
    指向控制面不提供的 channel path 的 replayable 记录；关窗、启动，写一条 wake 行；C：NET-001 式 iptables 拒绝 TCP/443 90 s
    （300 s 回滚定时器），期间再写一条 XID 63。
  expected:
  - A 期间 2 条记录进入 kernel outbox 且 replayable=true、error 含 403，outbox stats dead=0；服务 active 且 NRestarts 不变
  - 关窗后 2 条各自恰好到达一次成为 NVIDIA_KERNEL 证据，outbox 中不再含其记录，replayable 归零
  - 回放后种子记录 replayable=false、error 含 404，stats dead>=1；outbox list 只显示元数据、不含 payload
  - requeue-dead 无 --yes 被拒；--yes 后输出 requeued 1 dead record，stats replayable>=1
  - 中断前后 kernel 采集器 PID、InvocationID 与 /dev/kmsg fd 集合不变，fdinfo pos 不回退；中断期间写入的行在解封后恰到达一次
  - 清理：窗口、防火墙规则、种子记录、Pod/ConfigMap 均为零残留
  evidence:
    verdict: NOT_RUN
  automation: manual
  procedure: docs/区域模式端到端验收测试用例.md#gf-regional-net-008
  related_pytest: tests/regional/test_net008_outbox_dead_letter.py::test_the_transient_outbox_contract_passes_on_replayable_403_records
