- id: GF-REGIONAL-DESTR-001
  title: 经 executor 与 Node Agent 的真实 GPU reset
  category: regional-destructive-acceptance
  level: staging
  risk: destructive
  problem: 分离部署下的 GPU reset 必须完全由数据面执行且不得提交任何 provider 变更。
  injection: 维护窗口内在无 workload 的空闲节点通过真实 /dev/kmsg 注入 XID46，由 workflow 自行隔离、quiesce、reset、验证和恢复。
  expected:
  - step 序列完整走过 FREEZE_EVIDENCE、MARK_UNSCHEDULABLE、QUIESCE、VERIFY、RESET、RESTORE_GPU_SERVICES、VALIDATE_GPU、RESTORE_SCHEDULING
  - 远端 step 的 WAITING 委托详情含 mutation_submitted_by_control_plane=false；终态 details 以真实 adapter 结果为准
  - QUIESCE_GPU_SERVICES 先创建 systemd fail-safe timer
  - Node Agent ledger 中 RESET_GPU 恰一条且 attempt=1；kernel journal 中目标 PCI reset 至多一条（0 条允许，>1 条 FAIL——journal 里含 BDF 与 reset 的行此前只有注入文本本身，内核来源行只记录不据以计数）
  - 高频宿主采样必须捕获到目标 GPU 瞬时不可枚举（样本序列先低于期望 GPU 数再回到期望数），未捕获判 FAIL；这是物理 reset 的直接证据
  - RESTORE_GPU_SERVICES 恢复原本 active 的服务并取消 timer
  - Node Agent ledger 以确定性 command_id 为主键且只记录一条结果
  - CloudTrail 中没有 BatchRebootClusterNodes、BatchReplaceClusterNodes 或 BatchDeleteClusterNodes；周期性只读 ListClusterNodes 允许存在但频率不得因本 workflow 改变
  - 控制面 EKS 比对结果为 IDENTICAL
  - 前置必须核实 profile 里 gpuReset 是 OWN 而非 OBSERVE，否则 _owner 返回 None、RESET_GPU step 根本不生成
  - 节点动作寻址必须来自 fleet 心跳而非静态 map，过期节点应被显式拒绝为 agent lease is expired 或 agent is not registered，不得静默打到回收 IP 上的另一台机器
  - 判读顺序先确认 RESET_GPU step 是否被规划出来，再看 step error 是否为寻址类错误（no node action endpoint / not fleet-ready / not registered），最后才看节点 journal/ledger
  - reset 后的 VALIDATE_GPU 必须为 step.gpu_uuids 中每一张 GPU 拿到晚于 readiness_after 的新鲜样本才 SUCCEEDED；任一 GPU 缺样本时 WAITING details 含 missing_recent_metrics_by_gpu[<uuid>]，不允许兄弟 GPU 的样本代答
  - MARK_UNSCHEDULABLE 与 RESTORE_SCHEDULING 的 remote command result_details 含 node_baselines[node].before/after（unschedulable、taint_keys、resource_version），隔离后 after 带 gpu-fault.io/quarantined、恢复后 after 不带且 unschedulable 回到 previous-unschedulable；executor 每个副本的 GPU_FAULT_KUBERNETES_REQUEST_TIMEOUT_SECONDS 为正数或未设（默认 30 s），每个 Kubernetes 调用都带该上限
  evidence:
    verdict: NOT_RUN
  automation: manual
  procedure: docs/区域模式端到端验收测试用例.md#gf-regional-destr-001
  related_pytest: tests/regional/test_destructive_acceptance_fixtures.py::test_destr001_requires_the_exact_reset_contract

- id: GF-REGIONAL-DESTR-002
  title: 经 provider 的真实节点 reboot
  category: regional-destructive-acceptance
  level: staging
  risk: destructive-provider-reboot
  problem: provider reboot 必须由数据面 executor 的 role 发起且不得升级为 replace。
  injection: 维护窗口内在隔离节点触发映射到 NODE_REBOOT 的故障。
  expected:
