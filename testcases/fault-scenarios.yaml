  level: staging
  risk: destructive-provider-reboot
  problem: >-
    ALWAYS_FATAL 20 条此前只有单测， REBOOT_NODE 的真机路径只在 DESTR 侧被别的入口驱动过。
  injection: >-
    注入 ALWAYS_FATAL 类 SXID，让 RESTART_BM 与 REBOOT_NODE 走 HyperPod BatchRebootClusterNodes 真的重启物理节点；本组内最后执行。
