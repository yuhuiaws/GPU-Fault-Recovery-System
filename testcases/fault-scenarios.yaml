- id: GF-REGIONAL-BOOT-015
  title: runtime profile 声明的 owner 必须有对应的 executor adapter
  category: regional-deployability
  level: live
  risk: non-destructive
  problem: 控制面按 profile 的 owner 生成 step，executor 只 claim 本地已注册 adapter 的 owner；两边不一致时 command 永远停在 PENDING，且当前实现没有未领取超时、没有 dead-letter、没有告警，比直接失败更危险。
  injection: 先用 GPU_FAULT_REMOTE_EXECUTION_OWNERS 把 profile 的 OWN/DELEGATE owner 收窄为真正远端下发的集合，与 executor_from_environment().execution_owners 逐副本对照；再向控制面注入一条 owner 不存在的 remote_command（created_at 回拨 610 秒，越过告警阈值且为默认 claim deadline 保留评估余量）观察指标，最后删除该记录。
  expected:
  - profile 的 owner 与 REMOTE_EXECUTION_OWNERS 的交集是 executor execution_owners 的子集
  - 判据不得使用 profile 的全部 OWN/DELEGATE owner，因为控制面本地 adapter 的 owner 永不出现在 executor 侧
  - executor owner 集合必须逐副本读取且各副本一致
  - 必须直接读 execution_owners 而非从 ENABLE_* 开关反推，以覆盖 OWNER 覆写与 owner 唯一性守卫
  - 注入后同时出现 remote_command_total{status=PENDING} 与 oldest_unclaimed_seconds 且数值单调增长
  - /metrics 在 ADOT 的 5 秒 scrape timeout 内返回上述指标，不能用超时后的最终结果冒充可观测
  - 注入的命令始终 lease_owner 为空且 executor 日志无任何相关记录，证明 owner 过滤是静默 continue
  - 必须先分清两条独立通知路径：路径 A 管理员邮件走 SES 不经过 AMP，路径 B 指标告警走 ADOT 到 AMP；本用例的失效模式只能由路径 B 覆盖
  - 告警必须写在真正生效的告警路径里（区域控制面的路径 B 为 amp-rules.yaml 而非 PrometheusRule）
  - 告警引用的指标必须在 ADOT collector 的 keep 白名单内否则采集侧即被丢弃
  - 在真实 AMP 中用告警 expr 求值必须返回非空向量且过 for 窗口后 alerts 为 firing
  - 清理注入记录后告警必须自动 resolve
  - 删除注入记录后 oldest_unclaimed_seconds 时间序列整条消失而非残留旧值
  - 补充 executor 上报 execution_owners 与控制面在注册 profile 时交叉校验（防线 a，仍未落地）
  - 不得为制造差集而关闭数据面 adapter 开关
  evidence:
    verdict: NOT_RUN
  automation: manual
  procedure: docs/区域模式端到端验收测试用例.md#gf-regional-boot-015
  related_pytest: tests/regional/test_regional_boot_guard_acceptance.py::test_boot015_a_command_no_adapter_owns_is_skipped_silently_but_counted
