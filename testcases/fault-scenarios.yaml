test_cases:
- id: GF-POL-HYPERPOD-RESTART-VM-001
  title: HyperPod RESTART_VM 映射为节点 reboot
  category: xid-policy
  level: integration
  risk: non-destructive
  problem: NVIDIA Catalog XID 151 返回 RESTART_VM，需要在 HyperPod 中使用节点 reboot，而不是 EC2 stop/start。
  injection: 使用 hyperpod-eks runtime profile 评估 H100 XID 151 和一个运行中的受管 workload。
  expected:
  - 保留 official action RESTART_VM
  - incident effective action 为 REBOOT_NODE
  - workflow 使用 RESTART_NODE 和 HyperPod BatchRebootClusterNodes
  - workflow 包含停止 workload、GPU/Fabric 验证、恢复调度和恢复 workload
  - 该动作不调用 EC2 stop/start
  - 非 HyperPod runtime profile 不自动应用该映射
  automation: pytest
  procedure:
  - 注册 environment=hyperpod-eks 且具备节点重启和 workload owner 的 runtime profile
  - 构造 product=H100、xid=151、workload_state=ACTIVE 的事件
  - 编译 workflow 并检查 official/effective action 与完整 step 顺序
  pytest_nodeid: tests/orchestration/test_misc.py::test_hyperpod_restart_vm_uses_node_reboot_not_stop_start

- id: GF-LIVE-KMSG-XID45-FM-EMAIL-20260724
  title: HyperPod XID 45 Fabric Manager 重启固定模板邮件
  category: live-hyperpod-notification
  level: end-to-end
  risk: live-service-action
  problem: Fabric Manager 自动重启成功后管理员没有收到包含故障原因和执行结果的邮件。
  injection: 向运行训练任务的目标节点真实 /dev/kmsg 写入一条无 test ID 的 XID 45 用户态模拟记录。
  expected:
  - 单独 XID 45 完成 30 秒 correlation 后触发 RESTART_FABRIC_MANAGER
  - Node Agent 返回 Fabric Manager 新旧 MainPID 和 active 状态
  - workflow step details 持久化 notification ID
  - 使用 restart-fabric-manager-zh-v1 固定字段模板且不使用大模型
  - SES 返回 SENT 和 provider message ID
  - 相同 cluster、incident 和 operation 不重复发送
  - 训练持续运行且节点保持 Ready 和可调度
  evidence:
    verdict: PASS
    verified:
      case_digest: 325581c07686e883fcdf6caae01485aaf4c2f9f3ed441b1e5e04fa387f8463c4
  automation: manual
  procedure: docs/故障模拟测试手册.md#75-hyperpod-单独-xid-45-fabric-manager-重启
  capture_processing_trace: true
- id: GF-LIVE-KMSG-XID45-SOLO-FM-20260724
  title: HyperPod 单独 XID 45 自动重启 Fabric Manager
  category: live-hyperpod-recovery
  level: end-to-end
  risk: live-service-action
  problem: 两节点 16 GPU 分布式训练运行时，一个 H200 节点出现单独 XID 45。
  injection: 向目标节点真实 /dev/kmsg 写入一条无 test ID 的标准 NVRM XID 45 用户态模拟记录。
  expected:
  - KernelLogCollector 保留真实 boot ID、kernel sequence 和 monotonic timestamp
  - 等待完整 30 秒 correlation window 且没有 companion XID
  - 固定 Catalog 生成 EXECUTABLE RESTART_FM
  - workflow 依次完成 FREEZE_EVIDENCE 和 RESTART_FABRIC_MANAGER
  - Node Agent 通过 systemctl 重启 Fabric Manager 并验证 MainPID 变化
  - 训练 Pod UID 和 attempt ID 不变且 NCCL all-reduce 持续等于 136.0
  - 节点保持 Ready、可调度且无 taint
  evidence:
    verdict: PASS
    verified:
      case_digest: 4e42608127591edffb471465595ee5fd905d8d46aacbf0a5c1b37dbae6144f61
  automation: manual
  procedure: docs/故障模拟测试手册.md#75-hyperpod-单独-xid-45-fabric-manager-重启
  capture_processing_trace: true
- id: GF-LIVE-XID95-DUAL-RESET-RESUME-20260724
  title: HyperPod 双节点 XID 95 GPU reset 后恢复分布式训练
  category: live-hyperpod-recovery
  level: end-to-end
  risk: destructive
  problem: 两节点 16 GPU 分布式训练运行时，两个节点各有一张 GPU 需要 reset。
  injection: 通过 distributed XID API 提交两个 synthetic=true 的 H200 XID 95 事件。
  expected:
  - 停止整个两节点 PyTorchJob 后才允许 reset
  - Node Agent 分别验证目标 GPU 无 client
  - 两个 barrier participant 都返回 reset_gpu_uuids 且状态为 COMMITTED
  - post-reset GPU 验证通过后恢复调度并自动重启 PyTorchJob
  - 新 attempt 跨两个节点运行且 restart budget 为 1/2
  - rank 0 和 rank 8 的 NCCL all-reduce 持续等于 136.0
  evidence:
    verdict: PASS
    verified:
      case_digest: cd1ea704e793bda034c923f4c328ebed687758bfc1ed6a295b8dd19207ef5d71
  automation: manual
  procedure: docs/故障模拟测试手册.md#772-双节点-xid-95-reset-与训练恢复
  capture_processing_trace: true
