schema_version: 1
source_document: docs/区域模式端到端验收测试用例.md
ordering_rule: >-
  phases 按 sequence 升序执行；phase 内按 entries 顺序展开。
  range 按 start 到 end 递增。文档物理位置和 case ID 数字均不表示
  执行顺序。case 条目可带 predecessor 指明其正式证据前置；未声明时
  前置为顺序上最近的一条能产出 cases/<id>/<id>.json 证据的用例
  （automation 为 pytest 或 command 只是 python3 -m pytest 包装的用例
  不产出该证据，位置回退时跳过）。
phases:
  - sequence: 0
    name: 可部署性
    maintenance_window: 分级
    entries:
      - range: {prefix: BOOT, start: 11, end: 22}
      - case: GF-REGIONAL-BOOT-023
        predecessor: GF-REGIONAL-BOOT-020
    notes:
      - BOOT-023 以 BOOT-020 PASS 为证据前置；BOOT-021/022 之间没有它要读的发布历史。
  - sequence: 1
    name: 启动配置守卫
    maintenance_window: 否
    entries:
      # BOOT-006 is in do_not_run: the guard it drove ("regional control
      # plane cannot run in-cluster quick diagnostics against its own EKS")
      # was deleted with the quick-diagnostics path, so there is no switch
      # left to set and nothing to refuse.
      - range: {prefix: BOOT, start: 1, end: 5}
      - range: {prefix: BOOT, start: 7, end: 10}
  - sequence: 2
    name: 身份边界
    maintenance_window: 分级
    entries:
      # AUTH-012 is in do_not_run, not here: it is SUPERSEDED by AUTH-016 and
      # has no driver, so leaving it in the order would make AUTH-013 wait on
      # predecessor evidence that can never be produced.
      # AUTH-010 is in do_not_run: its route matrix is the first half of
      # AUTH-014, which also carries the data-plane Secret check.
      - range: {prefix: AUTH, start: 1, end: 9}
      - case: GF-REGIONAL-AUTH-011
      - range: {prefix: AUTH, start: 13, end: 16}
  - sequence: 3
    name: 训练工作负载基线
    maintenance_window: 是
    entries:
      - range: {prefix: WORKLOAD, start: 1, end: 2}
  - sequence: 4
    name: 单集群状态隔离
    maintenance_window: 分级
    entries:
      - range: {prefix: ISO, start: 1, end: 5}
  - sequence: 5
    name: Remote command 协议
    maintenance_window: 建议
    entries:
      - range: {prefix: CMD, start: 1, end: 18}
    notes:
      - 优先使用隔离逻辑集群或测试控制面；不得在无维护窗口时把生产 Executor 缩容到 0。
      - CMD-011 使用 Executor 本地夹具，不依赖控制面注入畸形 command。
      - CMD-017 只对合成集群 perf-cap-000 播种命令并用替身适配器的探针 executor claim，
        不注入 SXID、不触碰真实节点。
      - CMD-018 在 CPU API Pod 内用部署的 adapter 对合成集群 perf-cap-000 派发并改写 step，
        探针 executor 的动作是本地账本；两条命令都无 Node Agent 可达。
  - sequence: 6
    name: Workflow 抢占与 DAG
    maintenance_window: 分级
    entries:
      # PREEMPT-013, 023 and 034 are in do_not_run: each is a strict subset of
      # the pytest wrapper that follows it (014, 024, 035).
      - range: {prefix: PREEMPT, start: 1, end: 12}
      - range: {prefix: PREEMPT, start: 14, end: 22}
      - range: {prefix: PREEMPT, start: 24, end: 33}
      - range: {prefix: PREEMPT, start: 35, end: 38}
    notes:
      - PREEMPT-037 会把 gpu-fault-control-worker 的 GPU_FAULT_ENABLE_WORKFLOW_DISPATCHER 置为 false
        约 10 分钟并滚动副本；只在没有任何 PENDING/RUNNING/WAITING 工作流时执行，需要维护窗口，
        不得与其他区域用例同窗执行。
      - PREEMPT-038 只向真库写 audit-cluster 下的 audit-* 行并在 finally 删除，观察部署的周期清理。
  - sequence: 7
    name: 单集群闭环
    maintenance_window: 是
    entries:
      - case: GF-REGIONAL-E2E-001
  - sequence: 8
    name: 爆炸半径
    maintenance_window: 否
    entries:
      - range: {prefix: BLAST, start: 1, end: 4}
  - sequence: 9
    name: 通知
    maintenance_window: 否
    entries:
      # NOTIFY-002 is in do_not_run: NOTIFY-001's drill already submits the
      # same result four times and asserts one provider_message_id.
      - case: GF-REGIONAL-NOTIFY-001
      - range: {prefix: NOTIFY, start: 3, end: 7}
    notes:
      - NOTIFY-001 复用已批准动作或隔离通知夹具，不为邮件验收重复执行 GPU reset；重复提交去重断言并入本条。
      - NOTIFY-007 的正式前置是 NOTIFY-005：NOTIFY-006 是 pytest 用例，不产出 cases/<id>/<id>.json 证据。
      - NOTIFY-007 在 control-worker Pod 内用隔离 InMemoryStore 演练投递状态，只发一封 DRILL 邮件，不写生产行。
  - sequence: 10
    name: 容量
    maintenance_window: 否
    entries:
      - range: {prefix: CAP, start: 1, end: 5}
  - sequence: 11
    name: 网络中断与补交
    maintenance_window: 建议
    entries:
      - range: {prefix: NET, start: 1, end: 8}
  - sequence: 12
    name: 非破坏性 HA
    maintenance_window: 建议
    entries:
      # HA-005 is in do_not_run: HA-009 imports and re-asserts all of it
      # under the credential rotation it adds.
      - case: GF-REGIONAL-HA-001
      - case: GF-REGIONAL-HA-002
      - range: {prefix: HA, start: 6, end: 9}
      - case: GF-REGIONAL-HA-010
        predecessor: GF-REGIONAL-HA-001
    notes:
      - HA-010 以 HA-001 PASS 为证据前置，在无任何 remote command 在飞时做一次 Aurora writer failover
        并删除一个 gpu-fault-api-ha 副本；不注入故障、不触碰 GPU 面。
  - sequence: 13
    name: 破坏性能力验收（含非破坏性 fail-closed 负向用例）
    maintenance_window: 是
    entries:
      # DESTR-011 is in do_not_run: DESTR-013 carries its replace-switch,
      # reboot-still-enabled and per-replica report assertions.
      - range: {prefix: DESTR, start: 5, end: 7}
      - case: GF-REGIONAL-DESTR-010
      - case: GF-REGIONAL-DESTR-001
      - case: GF-REGIONAL-DESTR-002
      - case: GF-REGIONAL-DESTR-009
      - case: GF-REGIONAL-DESTR-012
      - case: GF-REGIONAL-DESTR-015
      - case: GF-REGIONAL-DESTR-016
        predecessor: GF-REGIONAL-DESTR-002
      - case: GF-REGIONAL-DESTR-017
        predecessor: GF-REGIONAL-DESTR-002
      - case: GF-REGIONAL-DESTR-018
        predecessor: GF-REGIONAL-DESTR-010
      - case: GF-REGIONAL-DESTR-019
        predecessor: GF-REGIONAL-DESTR-010
      - case: GF-REGIONAL-DESTR-020
        predecessor: GF-REGIONAL-DESTR-001
      - case: GF-REGIONAL-DESTR-021
      - case: GF-REGIONAL-DESTR-023
        predecessor: GF-REGIONAL-DESTR-001
      - case: GF-REGIONAL-DESTR-024
    notes:
      - DESTR-023 以 DESTR-001 PASS 为证据前置，在无任何受管作业、观测流全部过期、只剩 watcher 覆盖心跳的
        真正空闲集群上再做一次真实 GPU reset，证明节点不因 UNKNOWN 被 BLOCKED；不改任何控制面或 watcher 设置。
      - DESTR-024 以 DESTR-023 PASS 为前置，把 completion watcher 缩到 0 让心跳过期，注入同一 XID 46，
        只允许 FREEZE/MARK_UNSCHEDULABLE/QUARANTINE 与 BLOCKED，不 quiesce、不 reset、不 reboot；watcher 由 detached
        watchdog 兜底恢复，隔离只经 validated restore 工作流解除。
      - DESTR-020 以 DESTR-001 PASS 为证据前置，对一个 Kubernetes 与 fleet 都不认识的别名 node_id 走 API 重放的目录外 XID
        （SITE_SAFETY 隔离计划，无任何物理步骤），只证明 MARK_UNSCHEDULABLE 对 404 fail closed；别名没有 Node Agent 也没有
        provider 节点，任何 reset/reboot 都不可能被 arm；support 升级恰一次（containment_refused，只 FREEZE_EVIDENCE→ESCALATE_SUPPORT），链深度 ≤1。
      - DESTR-021 以 DESTR-020 PASS 为证据前置，复用 COLLECT-017 A 段的 EFA unbind 注入，在预写陈旧外来 plugin-restart 注解
        与本地并发 tick 注解写入下走七步 EFA 恢复；不 reset、不 reboot、不 replace。
      - provider replace 开关关闭的否证由 DESTR-013 在阶段末承担（原 DESTR-011 已并入，见 do_not_run）；
        DESTR-005..007 只在隔离进程里构造 step，不依赖该否证先跑。
      - DESTR-009 必须先于 DESTR-012。
      - DESTR-012 子用例严格按 B、A、D、C 执行。
      - DESTR-015 以 DESTR-012 PASS 为前置（同时依赖 DESTR-001 的真实 reset 与
        DESTR-009 的作业重启已各自成立），两台节点各做一次真实 GPU reset，不含 reboot。
      - DESTR-016 以 DESTR-002 PASS 为前置，在 RESET_GPU 的 VERIFY_NO_GPU_CLIENTS 屏障上
        先吸收一条同级 XID 46，再由 XID 79 抢占为 RESTART_NODE，只授权一次 provider reboot。
      - DESTR-017 以 DESTR-002 PASS 为前置，在 RESET_GPU 等待期间由带外 systemd 定时器重启
        节点一次，不调用任何 provider 动作。
      - DESTR-018 以 DESTR-010 PASS 为前置，在 CPU 面 gpu-fault-control-worker 上开临时
        环境窗口把 GPU_FAULT_NODE_WORKFLOW_MAX_LIFETIME_SECONDS 与
        GPU_FAULT_WORKFLOW_EXECUTION_TIMEOUT_SECONDS 压到 180 s；窗口在注入前打开、
        静默后关闭，不得与其他区域用例同窗执行。
      - DESTR-019 以 DESTR-010 PASS 为证据前置，只在无任何 remote command 在飞时重启一次
        Node Agent（先 arm fail-safe start），随后走 DESTR-010 的 XID 45 两步工作流核对审计轨迹；
        不含 reset/reboot/隔离。
  - sequence: 14
    name: Warm spare
    maintenance_window: 是
    entries:
      - case: GF-REGIONAL-DESTR-003
        predecessor: GF-REGIONAL-DESTR-012
      - case: GF-REGIONAL-DESTR-008
      - case: GF-REGIONAL-DESTR-022
      - case: GF-REGIONAL-DESTR-014
        predecessor: GF-REGIONAL-DESTR-008
    notes:
      - DESTR-003 以 DESTR-012 PASS 为证据前置（作业恢复归属成立后才做 warm-spare 切换），
        不读 DESTR-021 的证据。
      - DESTR-022 以 DESTR-008 PASS 为证据前置，在 003/008 仍声明着的那台热备上写一个合成 incident 的陈旧预留，
        只等部署 executor 的巡检按 TTL 回收；热备全程保持 cordon，不触发任何 workflow，必须在 DESTR-014 归还 spare 之前执行。
      - DESTR-014 不声明任何 warm spare（它要的正是 REPLACE_NODE 因热备不足而失败），
        执行前必须先按 DESTR-003 的 --release 归还已声明的 spare。
      - DESTR-014 含两次真实 BatchRebootClusterNodes，必须先于 DESTR-013 执行，
        使其落在 DESTR-013 覆盖的 CloudTrail 时间窗内。
  - sequence: 15
    name: 故障转移与约束否证
    maintenance_window: 分级
    entries:
      - case: GF-REGIONAL-HA-003
        predecessor: GF-REGIONAL-DESTR-008
      - case: GF-REGIONAL-HA-004
      - case: GF-REGIONAL-DESTR-013
    notes:
      - HA-003 以 DESTR-008 PASS 为证据前置（run_ha003_aurora_failover_reset.py 的链），不读 DESTR-014 的证据。
      - DESTR-013 必须最后执行，以覆盖前序维护窗口的 CloudTrail。
  - sequence: 16
    name: 多物理集群
    maintenance_window: 否
    prerequisite: 至少两个 enabled 的物理 GPU 集群
    entries:
      - case: GF-REGIONAL-ISO-006
      - case: GF-REGIONAL-E2E-002
        predecessor: GF-REGIONAL-ISO-001
    notes:
      - E2E-002 以 ISO-001 PASS 为证据前置：ISO-001 是同一身份的单次注入隔离用例，E2E-002 是它的
        两次注入后继；ISO-006（整集群离线）证明的不是 E2E-002 所依赖的东西，所以不读 ISO-006 的证据。
  - sequence: 17
    name: 采集与判定覆盖
    maintenance_window: 分级
    entries:
      - range: {prefix: COLLECT, start: 1, end: 7}
      - range: {prefix: COLLECT, start: 9, end: 12}
      - case: GF-REGIONAL-COLLECT-008
      - case: GF-REGIONAL-COLLECT-013
      - case: GF-REGIONAL-COLLECT-014
      - case: GF-REGIONAL-COLLECT-016
      - case: GF-REGIONAL-COLLECT-021
        predecessor: GF-REGIONAL-COLLECT-016
      - case: GF-REGIONAL-COLLECT-017
        predecessor: GF-REGIONAL-COLLECT-016
      - range: {prefix: COLLECT, start: 18, end: 20}
      - case: GF-REGIONAL-COLLECT-015
        predecessor: GF-REGIONAL-COLLECT-017
    notes:
      - COLLECT-021 以 COLLECT-016 PASS 为证据前置：它复用 COLLECT-016 的托管训练夹具与宿主探针，
        验证 Pod 先死、RESTART_APP XID 后到的竞态被判为 MONITOR_ONLY 且被动路径仍重启，排在 COLLECT-016 之后。
      - COLLECT-015 以 COLLECT-017 PASS 为证据前置（run_collector_destructive.py 的链），
        COLLECT-018..020 排在它前面只是为了让 reboot 最后发生。
      - COLLECT-009 的正式前置是 COLLECT-005：COLLECT-006/007 是 pytest 用例，不产出 cases/<id>/<id>.json 证据。
      - COLLECT-004 的expected-count替代路径会触发真实HyperPod reboot，必须在维护窗口执行。
      - 后六条包含 reset、EFA mutation、workload restart 或 reboot，
        必须在维护窗口执行。
      - COLLECT-018/019/020 在一台空闲节点上开有界采集器窗口（合成 API 注入、nvidia-smi 影子、
        drop-in 环境），不触碰 GPU；COLLECT-020 会 cordon 该节点做 DCGM 诊断再由 validation-first
        restore 恢复，需要维护窗口，且仍排在 COLLECT-015 的 reboot 之前。
do_not_run:
  - case: GF-REGIONAL-BOOT-006
    reason: >-
      它驱动的 in-cluster quick diagnostics 守卫已随该路径一起删除，
      GPU_FAULT_ENABLE_QUICK_DIAGNOSTICS 不再存在，用例作废。
  - case: GF-REGIONAL-DESTR-004
    reason: provider replace 已由架构与 IAM 明确禁止，该用例已作废。
  - case: GF-REGIONAL-AUTH-012
    reason: >-
      集群 token 轮换已改为重叠窗口，"测量失败窗口"的前提不再成立，
      由 GF-REGIONAL-AUTH-016 取代。
  - case: GF-REGIONAL-AUTH-010
    reason: >-
      cluster-token route 矩阵与写路由 bucket 审计是 GF-REGIONAL-AUTH-014 的前半段，
      "execution token 未进入数据面 Secret" 已并入 AUTH-014 的判定；由 AUTH-014 取代。
  - case: GF-REGIONAL-NOTIFY-002
    reason: >-
      GF-REGIONAL-NOTIFY-001 的通知 drill 已对同一 result 重复提交四次并断言
      provider_message_id 不变、通知条数不变；由 NOTIFY-001 取代。
  - case: GF-REGIONAL-DESTR-011
    reason: >-
      provider replace 开关、IAM implicitDeny 与 CloudTrail 否证由 GF-REGIONAL-DESTR-013
      在阶段末统一承担，"reboot 仍可独立启用"与逐副本开关报告已并入 DESTR-013；由 DESTR-013 取代。
  - case: GF-REGIONAL-HA-005
    reason: >-
      GF-REGIONAL-HA-009 复用并重新断言 HA-005 的全部滚动连续性判定，
      再叠加 Aurora 凭据轮换；由 HA-009 取代。
  - case: GF-REGIONAL-PREEMPT-013
    reason: >-
      三级连环抢占是 GF-REGIONAL-PREEMPT-014 五级链的严格子集；由 PREEMPT-014 取代。
  - case: GF-REGIONAL-PREEMPT-023
    reason: >-
      其唯一 pytest nodeid 已包含在 GF-REGIONAL-PREEMPT-024 的命令里；由 PREEMPT-024 取代。
  - case: GF-REGIONAL-PREEMPT-034
    reason: >-
      node-busy 等待与超时 STOP 的两条 nodeid 都被 GF-REGIONAL-PREEMPT-035 的
      placement-hold 套件覆盖；由 PREEMPT-035 取代。
