schema_version: 1
source_document: docs/区域模式端到端验收测试用例.md
ordering_rule: >-
  phases 按 sequence 升序执行；phase 内按 entries 顺序展开。
  range 按 start 到 end 递增。文档物理位置和 case ID 数字均不表示
  执行顺序。
phases:
  - sequence: 0
    name: 可部署性
    maintenance_window: 分级
    entries:
      - range: {prefix: BOOT, start: 11, end: 22}
  - sequence: 1
    name: 启动配置守卫
    maintenance_window: 否
    entries:
      - range: {prefix: BOOT, start: 1, end: 10}
  - sequence: 2
    name: 身份边界
    maintenance_window: 分级
    entries:
      # AUTH-012 is in do_not_run, not here: it is SUPERSEDED by AUTH-016 and
      # has no driver, so leaving it in the order would make AUTH-013 wait on
      # predecessor evidence that can never be produced.
      - range: {prefix: AUTH, start: 1, end: 11}
      - range: {prefix: AUTH, start: 13, end: 16}
  - sequence: 3
    name: 训练工作负载基线
    maintenance_window: 是
    entries:
      - range: {prefix: WORKLOAD, start: 1, end: 2}
  - sequence: 4
    name: 单集群状态隔离
    maintenance_window: 分级
    entries:
      - range: {prefix: ISO, start: 1, end: 5}
  - sequence: 5
    name: Remote command 协议
    maintenance_window: 建议
    entries:
      - range: {prefix: CMD, start: 1, end: 16}
    notes:
      - 优先使用隔离逻辑集群或测试控制面；不得在无维护窗口时把生产 Executor 缩容到 0。
      - CMD-011 使用 Executor 本地夹具，不依赖控制面注入畸形 command。
  - sequence: 6
    name: Workflow 抢占与 DAG
    maintenance_window: 分级
    entries:
      - range: {prefix: PREEMPT, start: 1, end: 36}
  - sequence: 7
    name: 单集群闭环
    maintenance_window: 是
    entries:
      - case: GF-REGIONAL-E2E-001
  - sequence: 8
    name: 爆炸半径
    maintenance_window: 否
    entries:
      - range: {prefix: BLAST, start: 1, end: 4}
  - sequence: 9
    name: 通知
    maintenance_window: 否
    entries:
      - range: {prefix: NOTIFY, start: 1, end: 6}
    notes:
      - NOTIFY-001/002 复用已批准动作或隔离通知夹具，不为邮件验收重复执行 GPU reset。
  - sequence: 10
    name: 容量
    maintenance_window: 否
    entries:
      - range: {prefix: CAP, start: 1, end: 5}
  - sequence: 11
    name: 网络中断与补交
    maintenance_window: 建议
    entries:
      - range: {prefix: NET, start: 1, end: 5}
  - sequence: 12
    name: 非破坏性 HA
    maintenance_window: 建议
    entries:
      - case: GF-REGIONAL-HA-001
      - case: GF-REGIONAL-HA-002
      - range: {prefix: HA, start: 5, end: 9}
  - sequence: 13
    name: 破坏性能力验收（含非破坏性 fail-closed 负向用例）
    maintenance_window: 是
    entries:
      - case: GF-REGIONAL-DESTR-011
      - range: {prefix: DESTR, start: 5, end: 7}
      - case: GF-REGIONAL-DESTR-010
      - case: GF-REGIONAL-DESTR-001
      - case: GF-REGIONAL-DESTR-002
      - case: GF-REGIONAL-DESTR-009
      - case: GF-REGIONAL-DESTR-012
      - case: GF-REGIONAL-DESTR-015
      - case: GF-REGIONAL-DESTR-016
      - case: GF-REGIONAL-DESTR-017
      - case: GF-REGIONAL-DESTR-018
    notes:
      - DESTR-011 必须先证明 provider replace 开关关闭。
      - DESTR-009 必须先于 DESTR-012。
      - DESTR-012 子用例严格按 B、A、D、C 执行。
      - DESTR-015 以 DESTR-012 PASS 为前置（同时依赖 DESTR-001 的真实 reset 与
        DESTR-009 的作业重启已各自成立），两台节点各做一次真实 GPU reset，不含 reboot。
      - DESTR-016 以 DESTR-002 PASS 为前置，在 RESET_GPU 的 VERIFY_NO_GPU_CLIENTS 屏障上
        先吸收一条同级 XID 46，再由 XID 79 抢占为 RESTART_NODE，只授权一次 provider reboot。
      - DESTR-017 以 DESTR-002 PASS 为前置，在 RESET_GPU 等待期间由带外 systemd 定时器重启
        节点一次，不调用任何 provider 动作。
      - DESTR-018 以 DESTR-010 PASS 为前置，在 CPU 面 gpu-fault-control-worker 上开临时
        环境窗口把 GPU_FAULT_NODE_WORKFLOW_MAX_LIFETIME_SECONDS 与
        GPU_FAULT_WORKFLOW_EXECUTION_TIMEOUT_SECONDS 压到 180 s；窗口在注入前打开、
        静默后关闭，不得与其他区域用例同窗执行。
  - sequence: 14
    name: Warm spare
    maintenance_window: 是
    entries:
      - case: GF-REGIONAL-DESTR-003
      - case: GF-REGIONAL-DESTR-008
      - case: GF-REGIONAL-DESTR-014
    notes:
      - DESTR-014 不声明任何 warm spare（它要的正是 REPLACE_NODE 因热备不足而失败），
        执行前必须先按 DESTR-003 的 --release 归还已声明的 spare。
      - DESTR-014 含两次真实 BatchRebootClusterNodes，必须先于 DESTR-013 执行，
        使其落在 DESTR-013 覆盖的 CloudTrail 时间窗内。
  - sequence: 15
    name: 故障转移与约束否证
    maintenance_window: 分级
    entries:
      - range: {prefix: HA, start: 3, end: 4}
      - case: GF-REGIONAL-DESTR-013
    notes:
      - DESTR-013 必须最后执行，以覆盖前序维护窗口的 CloudTrail。
  - sequence: 16
    name: 多物理集群
    maintenance_window: 否
    prerequisite: 至少两个 enabled 的物理 GPU 集群
    entries:
      - case: GF-REGIONAL-ISO-006
      - case: GF-REGIONAL-E2E-002
  - sequence: 17
    name: 采集与判定覆盖
    maintenance_window: 分级
    entries:
      - range: {prefix: COLLECT, start: 1, end: 7}
      - range: {prefix: COLLECT, start: 9, end: 12}
      - case: GF-REGIONAL-COLLECT-008
      - case: GF-REGIONAL-COLLECT-013
      - case: GF-REGIONAL-COLLECT-014
      - case: GF-REGIONAL-COLLECT-016
      - case: GF-REGIONAL-COLLECT-017
      - case: GF-REGIONAL-COLLECT-015
    notes:
      - COLLECT-004 的expected-count替代路径会触发真实HyperPod reboot，必须在维护窗口执行。
      - 后六条包含 reset、EFA mutation、workload restart 或 reboot，
        必须在维护窗口执行。
do_not_run:
  - case: GF-REGIONAL-DESTR-004
    reason: provider replace 已由架构与 IAM 明确禁止，该用例已作废。
  - case: GF-REGIONAL-AUTH-012
    reason: >-
      集群 token 轮换已改为重叠窗口，"测量失败窗口"的前提不再成立，
      由 GF-REGIONAL-AUTH-016 取代。
