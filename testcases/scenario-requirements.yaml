schema_version: 1
requirements:
  - id: GF-REQ-POLICY-CATALOG
    family: fault-policy
    title: Pinned catalog, product applicability and driver-version gates
    source: [src/gpu_fault/policy/catalog.py]
    covers: [fault:xid-catalog, fault:product, fault:driver-version]
    conditions: [normal, safety]
    assertions:
      - Every pinned rule and product family has its exact official decision.
      - Unknown products and insufficient versions cannot authorize a mutation.
    cases: [GF-REGIONAL-COLLECT-007, GF-POL-011]
    checks:
      - nodeid: tests/policy/test_policy.py::test_every_catalog_rule_resolves_as_the_catalog_says
        expected: 688
      - nodeid: tests/policy/test_policy.py::test_catalog_minimum_version_is_enforced
    critical: true
  - id: GF-REQ-POLICY-CORRELATION
    family: fault-policy
    title: Correlation, dynamic recovery labels and unknown XIDs
    source: [src/gpu_fault/policy/catalog.py, src/gpu_fault/xid_correlation.py]
    covers: [fault:xid45, fault:xid48, fault:xid154, fault:unknown]
    conditions: [normal, repeat, timeout, safety]
    assertions:
      - XID45 waits for its companion and follows the stronger official action.
      - XID48 companion handling cannot weaken containment.
      - Unknown XIDs are quarantined and retries remain idempotent.
      - Raw-event retention cannot erase a retained finalized decision or incident binding.
    cases: [GF-POL-001, GF-POL-002, GF-POL-003, GF-POL-009]
    checks:
      - nodeid: tests/policy/test_policy.py::test_unknown_xid_is_quarantined_and_idempotent
      - nodeid: tests/metrics/test_xid_correlation.py::test_xid45_waits_and_follows_later_companion_across_replicas
      - nodeid: tests/policy/test_policy.py::test_xid_48_exact_workflow_handles_solo_and_63_companion
      - nodeid: tests/policy/test_policy.py::test_xid_154_dynamic_action_takes_precedence
      - nodeid: tests/policy/test_cov95_runtime_correlation.py::test_redelivery_after_raw_event_retention_reuses_the_final_decision
    critical: true
  - id: GF-REQ-POLICY-NVLINK
    family: fault-policy
    title: NVLink bit decoding and XID74 escalation thresholds
    source: [src/gpu_fault/policy/nvlink74.py, src/gpu_fault/policy/catalog.py, src/gpu_fault/policy/engine.py]
    covers: [fault:nvlink5, fault:xid74]
    conditions: [normal, repeat, failure, safety]
    assertions:
      - All pinned NVLink5 rows decode across both driver layouts and error-status alternatives.
      - Safe-only, unknown and repeated XID74 branches retain distinct outcomes.
      - Secondary RXPIPE bit patterns retain their pinned action and exact error-status gate.
    cases: [GF-REGIONAL-COLLECT-006, GF-XID74-DECODE-002, GF-XID74-UNKNOWN-012]
    checks:
      - nodeid: tests/policy/test_policy.py::test_every_nvlink5_decode_rule_resolves_as_the_catalog_says
        expected: 192
      - nodeid: tests/policy/test_policy.py::test_xid74_register_workflow_is_deterministic
        expected: 4
      - nodeid: tests/policy/test_policy.py::test_xid74_register_branch_matrix[unknown-register]
      - nodeid: tests/policy/test_cov95_runtime_nvlink_policy.py::test_nvlink5_rxpipe_secondary_pattern_selects_the_pinned_reset_action
        expected: 12
      - nodeid: tests/policy/test_cov95_runtime_nvlink_policy.py::test_secondary_nvlink_pattern_still_requires_an_exact_error_status
        expected: 4
  - id: GF-REQ-POLICY-SXID
    family: fault-policy
    title: SXID scope, topology and all-fabric versus participating-GPU recovery
    source: [src/gpu_fault/policy/catalog.py]
    covers: [fault:sxid-access, fault:sxid-trunk, fault:sxid-topology]
    conditions: [normal, safety]
    assertions:
      - Access and trunk faults keep their different reset scopes.
      - Missing or untrusted fabric inventory blocks execution.
    cases: [GF-POL-007, GF-POL-008, GF-SXID-TRUNK-002, GF-SXID-TOPOLOGY-008]
    checks:
      - nodeid: tests/policy/test_policy.py::test_fatal_access_sxid_requires_participating_gpu_reset
      - nodeid: tests/policy/test_policy.py::test_fatal_trunk_sxid_is_not_mapped_to_single_gpu_reset
      - nodeid: tests/policy/test_policy.py::test_fatal_trunk_sxid_requires_complete_fabric_scope
      - nodeid: tests/orchestration/test_sxid_topology.py::test_unknown_scope_resolves_from_exact_trusted_port_topology
    critical: true
  - id: GF-REQ-OP-EVIDENCE
    family: operation
    title: Evidence capture and bounded diagnostic failures
    source: [src/gpu_fault/operation_registry.py, src/gpu_fault/node_agent/operations/diagnostics.py]
    covers: [operation:FREEZE_EVIDENCE, operation:COLLECT_DIAGNOSTIC_BUNDLE, operation:COLLECT_HUNG_TRIAGE]
    conditions: [normal, failure, timeout]
    assertions:
      - A diagnostic bundle preserves partial failures without enabling recovery.
      - Hung triage is bounded, read-only and tolerates unreachable participants.
    cases: [GF-SXID-DIAGNOSTICS-011, GF-REGIONAL-PREEMPT-024]
    checks:
      - nodeid: tests/node_agent/test_diagnostics.py::test_diagnostic_bundle_records_partial_failures
      - nodeid: tests/node_agent/test_diagnostics.py::test_hung_triage_collects_bounded_read_only_rank_signals
      - nodeid: tests/execution/test_misc.py::test_hung_triage_tolerates_unreachable_node
  - id: GF-REQ-OP-RESET
    family: operation
    title: Scoped GPU reset, active clients, retries and ambiguous timeouts
    source: [src/gpu_fault/operation_registry.py, src/gpu_fault/node_agent/operations/remediation.py, src/gpu_fault/node_agent/operations/reset.py, src/gpu_fault/recovery_safety.py, scripts/e2e/regional/collector_reset_evidence.py]
    covers: [operation:RESET_GPU, operation:QUIESCE_GPU_SERVICES, operation:VERIFY_NO_GPU_CLIENTS, operation:RESTORE_GPU_SERVICES]
    conditions: [normal, repeat, timeout, failure, safety]
    assertions:
      - Active GPU clients refuse reset and each retry rechecks the scope.
      - A timed-out physical action is not blindly submitted again.
      - Known failures may compensate quiesce; an unresolved physical outcome retains the hold and requires reconciliation.
      - Busy refusals and successful reset invocations are accounted separately without admitting duplicate or unknown execution.
    cases: [GF-REGIONAL-DESTR-001, GF-REGIONAL-PREEMPT-008]
    checks:
      - nodeid: tests/node_agent/test_remediation.py::test_gpu_reset_is_idempotent_and_rechecks_clients
      - nodeid: tests/node_agent/test_remediation.py::test_gpu_reset_refuses_active_compute_client
      - nodeid: tests/node_agent/test_remediation.py::test_gpu_reset_timeout_is_not_retryable_and_runs_once
      - nodeid: tests/execution/test_misc.py::test_failed_reset_runs_restore_compensation_before_terminal
      - nodeid: tests/execution/test_cov95_runtime_dag_cleanup.py::test_dag_reset_failure_finishes_compensation_before_landing_the_failure
        expected: 2
      - nodeid: tests/regional/test_collector_reset_evidence.py::test_known_busy_refusals_do_not_count_as_successful_physical_resets
        expected: 6
      - nodeid: tests/regional/test_collector_reset_evidence.py::test_busy_retry_evidence_never_accepts_duplicate_or_unknown_execution
        expected: 13
      - nodeid: tests/regional/test_independent_recovery_safety.py::test_cpu_and_both_cleanup_entries_refuse_the_same_uncertain_workflow
        expected: 4
      - nodeid: tests/regional/test_independent_recovery_safety.py::test_cpu_cancellation_refresh_never_substitutes_for_actual_completion
        expected: 4
    critical: true
  - id: GF-REQ-OP-FABRIC
    family: operation
    title: Full fabric reset and Fabric Manager recovery
    source: [src/gpu_fault/operation_registry.py, src/gpu_fault/node_agent/operations/remediation.py]
    covers: [operation:RESET_ALL_GPUS_NVSWITCHES, operation:RESTART_FABRIC_MANAGER]
    conditions: [normal, repeat, failure, safety]
    assertions:
      - Full reset requires exact inventory and keeps idempotent command identity.
      - Fabric Manager restart is fenced and verified after execution.
    cases: [GF-SXID-AGENT-004, GF-REGIONAL-DESTR-010]
    checks:
      - nodeid: tests/node_agent/test_remediation.py::test_full_fabric_reset_verifies_inventory_and_is_idempotent
      - nodeid: tests/node_agent/test_remediation.py::test_full_fabric_reset_rejects_inventory_mismatch
      - nodeid: tests/node_agent/test_remediation.py::test_fabric_manager_restart_is_fenced_and_verified
    critical: true
  - id: GF-REQ-OP-PROVIDER
    family: operation
    title: Reboot ownership and ambiguous provider submission
    source: [src/gpu_fault/operation_registry.py, src/gpu_fault/adapters/hyperpod/confirmation.py]
    covers: [operation:RESTART_NODE, operation:RESTART_VM]
    conditions: [normal, repeat, restart, failure, safety]
    assertions:
      - HyperPod RESTART_VM maps to reboot rather than EC2 stop/start.
      - Durable submission prevents duplicate reboot after adapter restart.
      - An interrupted provider submission remains fail closed.
      - A health interruption resets the stabilization window before confirmation.
    cases: [GF-POL-HYPERPOD-RESTART-VM-001, GF-REGIONAL-DESTR-002]
    checks:
      - nodeid: tests/orchestration/test_misc.py::test_hyperpod_restart_vm_uses_node_reboot_not_stop_start
      - nodeid: tests/hyperpod/test_hyperpod.py::test_durable_submission_survives_adapter_restart
      - nodeid: tests/hyperpod/test_hyperpod.py::test_interrupted_submission_fails_closed_instead_of_resubmitting
      - nodeid: tests/policy/test_policy.py::test_unowned_restart_vm_workflow_remains_fail_closed
      - nodeid: tests/hyperpod/test_cov95_provider_extra_confirmation.py::test_confirmation_restarts_stabilization_after_an_observed_health_interruption
        expected: 4
    critical: true
  - id: GF-REQ-OP-SPARE
    family: operation
    title: Warm spare compatibility, concurrent reservation and activation
    source: [src/gpu_fault/operation_registry.py, src/gpu_fault/hyperpod_spares.py]
    covers: [operation:REPLACE_NODE]
    conditions: [normal, repeat, failure, safety]
    assertions:
      - Only healthy compatible idle spares satisfy a reservation.
      - A partial conflicting reservation rolls back and activation rechecks workloads.
      - Shortage blocks and alerts without provider replacement.
      - Legacy replacement confirmation still requires scheduler-isolation proof.
      - A blocking spare marker can only use its matching incident, workflow and recovery fence.
    cases: [GF-SPARE-001, GF-SPARE-002, GF-REGIONAL-DESTR-003]
    checks:
      - nodeid: tests/hyperpod/test_hyperpod_spares.py::test_allocates_one_healthy_compatible_spare_per_fault_node
      - nodeid: tests/hyperpod/test_hyperpod_spares.py::test_concurrent_reservation_conflict_rolls_back_partial_set
      - nodeid: tests/hyperpod/test_hyperpod_spares.py::test_activation_rechecks_gpu_pods_before_uncordon
      - nodeid: tests/hyperpod/test_hyperpod_spares.py::test_insufficient_healthy_spares_blocks_and_alerts_admin
      - nodeid: tests/hyperpod/test_cov95_provider_extra_confirmation.py::test_legacy_replacement_cannot_confirm_without_scheduler_isolation_proof
      - nodeid: tests/hyperpod/test_cov95_runtime_spare_markers.py::test_only_matching_recovery_identity_can_clear_a_live_spare_marker
        expected: 5
    critical: true
  - id: GF-REQ-OP-EFA-PLUGINS
    family: operation
    title: Driver binding and accelerator plugin convergence
    source: [src/gpu_fault/operation_registry.py, src/gpu_fault/node_agent/operations/remediation.py]
    covers: [operation:REMEDIATE_EFA_DRIVER, operation:RESTART_EFA_DEVICE_PLUGIN, operation:RESTART_GPU_DEVICE_PLUGIN]
    conditions: [normal, failure, safety]
    assertions:
      - Missing PCI devices cannot be repaired by a blind module reload.
      - EFA binding failures retain a partial error report.
      - Plugin recovery must reconcile annotations and accelerator allocatable.
      - Managed training retains its Pod/attempt identity and advances valid collectives during and after plugin loss.
    cases: [GF-REGIONAL-COLLECT-017, GF-REGIONAL-DESTR-021]
    checks:
      - nodeid: tests/node_agent/test_remediation.py::test_efa_driver_remediation_accepts_already_bound_inventory
      - nodeid: tests/node_agent/test_remediation.py::test_efa_driver_remediation_refuses_missing_pci_device
      - nodeid: tests/node_agent/test_remediation.py::test_efa_driver_remediation_reports_partial_bind_errors
      - nodeid: tests/regional/test_destr021_adversarial_node_metadata.py::test_the_stale_foreign_annotation_is_taken_over_and_cleared
      - nodeid: tests/regional/test_collect017_training_progress.py::test_unchanged_samples_wait_until_every_original_pod_advances
      - nodeid: tests/regional/test_collect017_training_progress.py::test_stalled_collectives_cannot_pass_with_unchanged_uids
      - nodeid: tests/regional/test_collect017_training_progress.py::test_identity_and_collective_failures_stop_immediately
        expected: 14
      - nodeid: tests/regional/test_collect017_training_progress.py::test_incident_must_bind_the_same_cluster_job_attempt_and_planned_workflow
  - id: GF-REQ-OP-VERSIONED-REPAIR
    family: operation
    title: Pinned driver and firmware repairs
    source: [src/gpu_fault/operation_registry.py, src/gpu_fault/node_agent/operations/remediation.py]
    covers: [operation:REMEDIATE_DRIVER, operation:UPDATE_SOFTWARE_FIRMWARE]
    conditions: [normal, failure, safety]
    assertions:
      - Repair executes only the approved target and verifies the resulting version.
      - Missing firmware targets fail closed and failed repair escalates to support.
    cases: [GF-SXID-DRIVER-012, GF-REGIONAL-COLLECT-010]
    checks:
      - nodeid: tests/node_agent/test_remediation.py::test_driver_remediation_is_pinned_and_target_verified
      - nodeid: tests/node_agent/test_remediation.py::test_firmware_update_requires_exact_verified_version
      - nodeid: tests/orchestration/test_misc.py::test_failed_firmware_remediation_escalates_directly_to_support
        expected: 3
    critical: true
  - id: GF-REQ-OP-DIAGNOSTIC-DECISION
    family: operation
    title: Field/DCGM diagnostics, NVLink workflow and manual mechanical approval
    source: [src/gpu_fault/operation_registry.py, src/gpu_fault/node_agent/operations/diagnostics.py]
    covers: [operation:RUN_DCGM_DIAGNOSTIC, operation:RUN_FIELD_DIAGNOSTIC, operation:RUN_NVLINK74_WORKFLOW, operation:CHECK_MECHANICALS, operation:ESCALATE_SUPPORT]
    conditions: [normal, failure, safety]
    assertions:
      - Diagnostics use a pinned executable and exact target.
      - Zero exit status does not override a diagnostic failure report.
      - Mechanical approval is bound to the incident fence.
      - NVLink support notifications use deterministic templates.
    cases: [GF-MET-011, GF-XID74-EMAIL-004, GF-REGIONAL-COLLECT-009]
    checks:
      - nodeid: tests/node_agent/test_diagnostics.py::test_quick_dcgm_diagnostic_returns_structured_outcome
        expected: 4
      - nodeid: tests/node_agent/test_diagnostics.py::test_field_diagnostic_runs_pinned_command_for_exact_link
      - nodeid: tests/node_agent/test_diagnostics.py::test_field_diagnostic_rejects_failure_report_with_zero_exit
      - nodeid: tests/execution/test_misc.py::test_mechanical_inspection_waits_for_incident_fenced_annotation
      - nodeid: tests/execution/test_notification.py::test_xid74_support_uses_nvlink_template
  - id: GF-REQ-OP-WORKLOAD
    family: operation
    title: Contain, stop, checkpoint and restart one managed workload
    source: [src/gpu_fault/operation_registry.py, src/gpu_fault/adapters/kubernetes/restart_operations.py]
    covers: [operation:MARK_UNSCHEDULABLE, operation:CHECKPOINT_WORKLOADS, operation:STOP_WORKLOADS, operation:RESTART_WORKLOAD]
    conditions: [normal, repeat, failure, safety]
    assertions:
      - All workload participants stop before either fault GPU is reset.
      - A changed source UID or unapproved GPU count refuses restart.
      - Restart budget and durable reservation prevent duplicate attempts.
      - A passive restart is bound to its source decision and successful plan, any required containment, and fresh replacement Pod identities.
    cases: [GF-E2E-003, GF-RST-001, GF-RST-002, GF-RST-003, GF-REGIONAL-COLLECT-021]
    checks:
      - nodeid: tests/hyperpod/test_e2e_distributed_xid_reset.py::test_three_node_job_stops_before_two_fault_gpu_resets
      - nodeid: tests/execution/test_restart_safety.py::test_restart_rejects_source_uid_drift_before_budget_or_mutation
      - nodeid: tests/execution/test_restart_safety.py::test_gpu_count_change_waits_for_explicit_admin_approval
      - nodeid: tests/execution/test_restart_safety.py::test_restart_budget_blocks_second_restart_for_same_job
      - nodeid: tests/execution/test_restart_safety.py::test_restart_reservation_is_idempotent_and_persistent
      - nodeid: tests/regional/test_collect021_passive_completion.py::test_replacement_pod_visibility_waits_for_completion_and_watcher_lag
      - nodeid: tests/regional/test_collect021_passive_completion.py::test_each_required_plan_binding_is_checked
        expected: 35
      - nodeid: tests/regional/test_collect021_passive_completion.py::test_unproven_replacement_does_not_pass_even_when_pods_exist
        expected: 14
      - nodeid: tests/regional/test_cov95_collect_training_runners.py::test_late_xid_waits_for_legitimate_passive_containment_before_final_node_check
    critical: true
  - id: GF-REQ-OP-VALIDATION
    family: operation
    title: Fresh post-action validation before restoring scheduling
    source: [src/gpu_fault/operation_registry.py, src/gpu_fault/workflow_quarantine.py, src/gpu_fault/execution/terminal_state.py]
    covers: [operation:VALIDATE_GPU, operation:VALIDATE_HOST, operation:VALIDATE_FABRIC, operation:TRIGGER_HEALTH_SNAPSHOT, operation:RESTORE_SCHEDULING, operation:QUARANTINE]
    conditions: [normal, timeout, failure, safety]
    assertions:
      - Validation waits for telemetry newer than the physical action.
      - Failed node or fabric evidence cannot restore scheduling.
      - Quarantine ends shared restart rather than silently cancelling the fault.
      - A healthy node's readmission cannot clear another node's terminal incident or ownership hold.
      - Readmission requires a matching successful phase receipt even when completion indexes are partial.
      - Proven spare recovery can recover an incident without releasing its original failed node or an explicit persistent hold.
    cases: [GF-REGIONAL-PREEMPT-026, GF-REGIONAL-PREEMPT-030, GF-HOST-004]
    checks:
      - nodeid: tests/execution/test_validation.py::test_gpu_validation_waits_for_post_action_telemetry
      - nodeid: tests/execution/test_validation.py::test_host_validation_waits_for_post_reboot_telemetry
      - nodeid: tests/execution/test_validation.py::test_gpu_validation_reports_every_failed_node
      - nodeid: tests/execution/test_validation.py::test_fabric_validation_ignores_findings_outside_reset_scope
      - nodeid: tests/host_health/test_host_health.py::test_host_telemetry_endpoint_builds_quarantine_workflow
      - nodeid: tests/execution/test_terminal_quarantine_ownership_alignment.py::test_executed_mixed_branch_retains_quarantined_incident
        expected: 4
      - nodeid: tests/execution/test_terminal_quarantine_ownership_alignment.py::test_terminal_takeover_observes_node_hold_even_on_previously_misclassified_rows
        expected: 12
      - nodeid: tests/execution/test_terminal_quarantine_recovery_proof.py::test_partial_indexes_cannot_erase_phase_bound_quarantine
        expected: 6
      - nodeid: tests/execution/test_terminal_quarantine_recovery_proof.py::test_only_matching_completed_phase_can_release_the_held_node
        expected: 24
      - nodeid: tests/execution/test_terminal_quarantine_recovery_proof.py::test_successful_spare_recovery_and_original_node_ownership_are_distinct
        expected: 6
    critical: true
  - id: GF-REQ-OP-OUTBOX
    family: operation
    title: Scoped collector outbox maintenance
    source: [src/gpu_fault/operation_registry.py, src/gpu_fault/collectors/outbox_maintenance.py, src/gpu_fault/node_agent/operations/collector_outbox.py]
    covers: [operation:COLLECTOR_OUTBOX_MAINTENANCE]
    conditions: [normal, repeat, failure, safety]
    assertions:
      - Dead-letter maintenance addresses only the selected collector and generation.
      - Rejected records cannot become acknowledged successful delivery.
      - A foreign owner or uncertain generation cannot reach node transport.
    cases: [GF-REGIONAL-NET-008]
    checks:
      - nodeid: tests/regional/test_cov95_net_outbox_operation.py::test_outbox_operation_selects_live_generation_not_quiesce_generation
        expected: 3
      - nodeid: tests/regional/test_cov95_net_outbox_operation.py::test_outbox_generation_uncertainty_refuses_before_transport
        expected: 2
      - nodeid: tests/regional/test_cov95_net_outbox_operation.py::test_outbox_wrong_owner_is_not_dispatched_by_workflow_executor
      - nodeid: tests/collectors/test_http.py::test_http_event_sink_dead_letters_permanent_rejection
  - id: GF-REQ-INGEST-KERNEL
    family: ingestion
    title: Kernel fault delivery, retry and malformed-record visibility
    source: [src/gpu_fault/channel_registry.py, src/gpu_fault/collectors/logs/kernel.py]
    covers: [channel:/v1/collector-events/nvidia-kernel]
    conditions: [normal, repeat, restart, failure]
    assertions:
