schema_version: 1
requirements:
  - id: GF-REQ-OP-HUNG-SURVEY
    family: operation
    title: Full-task passive rank survey and bounded adaptive diagnosis
    source: [src/gpu_fault/node_agent/operations/hung_summary.py, src/gpu_fault/adapters/node_action/hung_survey.py, src/gpu_fault/hung_survey_analysis.py, src/gpu_fault/node_agent/operations/flight_series.py, src/gpu_fault/flight_progress.py, src/gpu_fault/execution/flight_temporal.py, src/gpu_fault/node_agent/operations/stack_samples.py, src/gpu_fault/node_agent/operations/process_samples.py, src/gpu_fault/execution/process_diagnosis.py, src/gpu_fault/execution/process_cohorts.py]
    covers: [operation:COLLECT_HUNG_SUMMARY]
    conditions: [normal, repeat, failure, timeout, safety]
    assertions:
      - Every task node is a survey target; concurrency limits do not silently reduce the denominator.
      - Passive collection never attaches a stack tool or triggers Flight Recorder.
      - Rank identity coverage process groups timing gaps and unavailable observations remain explicit.
      - Resumed surveys retain successful nodes and evidence decoding is bounded and lossless.
      - Active diagnosis expands only within its two-wave budget and failed training diagnosis cannot claim recovery.
      - Training step and phase never gate NCCL detection sampling or completion; unranked processes remain evidence with unknown rank coverage.
      - Targeted FR capture requires two fresh process-bound observations; enqueue movement is not completion and missing dumps are not stalls.
      - Thread-structured repeated captures validate exit codes and identity; comparable roles and windows are required for peer comparison.
      - CPU uses elapsed time normalization; missing GPU data and rank IDs never discard independent process evidence.
    cases: [GF-GENERAL-LIVE-011]
    checks:
      - nodeid: tests/execution/test_full_hung_survey.py::test_ten_thousand_ranks_are_all_visited_with_bounded_inflight_and_scoped_commands
        expected: 2
      - nodeid: tests/execution/test_full_hung_survey.py::test_resume_keeps_completed_nodes_and_expires_only_the_timed_out_pending_node
      - nodeid: tests/execution/test_hung_survey_pipeline.py::test_real_node_summary_drives_two_disjoint_active_waves_and_bounded_bundle
        expected: 3
      - nodeid: tests/execution/test_nccl_step_independence.py::test_legacy_application_step_fields_do_not_skip_nccl_diagnostics
      - nodeid: tests/execution/test_nccl_step_independence.py::test_first_wave_fr_members_choose_unsampled_peer_before_generic_expansion
      - nodeid: tests/node_agent/test_flight_temporal_collection.py::test_real_fifo_temporal_evidence_drives_persisted_targeted_bundle
      - nodeid: tests/node_agent/test_flight_temporal_collection.py::test_two_real_fifo_requests_are_fresh_process_bound_and_time_bounded
        expected: 5
      - nodeid: tests/execution/test_flight_temporal.py::test_same_enqueue_sequence_can_hide_persistent_completion_lag
      - nodeid: tests/execution/test_flight_temporal.py::test_every_member_stalled_is_reported_without_inventing_a_culprit
      - nodeid: tests/node_agent/test_process_diagnostics_e2e.py::test_real_capture_checks_exit_code_json_shape_and_does_not_parse_error_text
        expected: 3
      - nodeid: tests/node_agent/test_process_diagnostics_e2e.py::test_unknown_rank_storage_wait_reaches_workflow_without_strong_attribution
      - nodeid: tests/execution/test_process_diagnosis.py::test_legitimate_role_or_window_differences_are_not_peer_outliers
        expected: 7
      - nodeid: tests/execution/test_process_diagnosis.py::test_fr_completion_progress_does_not_silence_process_io_evidence
      - nodeid: tests/node_agent/test_stack_samples.py::test_container_native_tid_is_bound_to_host_tid_using_namespace_identity
      - nodeid: tests/execution/test_hung_summary_codec.py::test_small_compressed_input_cannot_expand_past_the_node_limit
    runners: [scripts/e2e/run_general_fault_injections.py]
    critical: true
    level: regional
    gap: Live GPU/EFA timing, application integration and thousand-GPU workload impact are NOT_RUN; software scale fixtures are not physical recovery evidence.
