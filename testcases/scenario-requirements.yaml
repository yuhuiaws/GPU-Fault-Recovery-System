    cases: [GF-XID-001, GF-REGIONAL-COLLECT-018]
    checks:
      - nodeid: tests/collectors/test_logs.py::test_kernel_collector_filters_and_uses_stable_kmsg_id
      - nodeid: tests/collectors/test_logs.py::test_kernel_collector_continues_after_retryable_event_is_buffered
      - nodeid: tests/collectors/test_logs.py::test_kernel_collector_reopens_after_stream_error
      - nodeid: tests/app_services/test_collector_event_route_wiring.py::test_kernel_route_reports_an_xid_line_without_a_code
      - nodeid: tests/regional/test_collector_window_marker_clock.py::test_kernel_clock_allowance_is_applied_once_and_only_to_the_matching_line
        expected: 2
  - id: GF-REQ-INGEST-FM
    family: ingestion
    title: Fabric Manager cursor durability and rotated log recovery
    source: [src/gpu_fault/channel_registry.py, src/gpu_fault/collectors/logs/fabric_manager.py, src/gpu_fault/collectors/logs/fabric_manager_cursor.py, src/gpu_fault/collectors/logs/fabric_manager_receipts.py]
    covers: [channel:/v1/collector-events/fabric-manager]
    conditions: [normal, repeat, restart, failure]
    assertions:
      - Failed delivery retains the unread cursor.
      - Corrupt or stale cursors and renamed logs recover without replaying history.
      - Observed copytruncate cannot reuse an already-emitted record identity.
      - Producer receipts distinguish source replay from sink retry, retain complete progress and explicitly expose logging omissions.
    cases: [GF-SXID-COLLECTOR-006, GF-SXID-COLLECTOR-007, GF-REGIONAL-COLLECT-022]
    checks:
      - nodeid: tests/collectors/test_logs.py::test_fabric_manager_file_cursor_rolls_back_on_delivery_failure
      - nodeid: tests/collectors/test_logs.py::test_fabric_manager_corrupt_state_does_not_replay_existing_file
      - nodeid: tests/collectors/test_logs.py::test_fabric_manager_journal_recovers_from_stale_cursor
      - nodeid: tests/collectors/test_logs.py::test_fabric_manager_reads_the_tail_of_a_renamed_log
      - nodeid: tests/collectors/test_alignment_fm_generation.py::test_empty_truncation_is_checkpointed_before_a_later_append
      - nodeid: tests/collectors/test_alignment_fm_generation.py::test_missing_checkpoint_does_not_recycle_a_previous_truncation_generation
      - nodeid: tests/collectors/test_alignment_fm_producer_receipts.py::test_restart_changes_producer_invocation_and_proves_zero_source_replay
      - nodeid: tests/collectors/test_alignment_fm_producer_receipts.py::test_normal_idle_polls_are_aggregated_at_the_existing_summary_cadence
      - nodeid: tests/collectors/test_alignment_fm_producer_receipts.py::test_logging_budget_limits_volume_without_losing_faults_or_hiding_omissions
  - id: GF-REQ-INGEST-GPU
    family: ingestion
    title: GPU inventory, metrics baseline and composite fault detection
    source: [src/gpu_fault/channel_registry.py]
    covers: [channel:/v1/collector-events/gpu-inventory, channel:/v1/collector-events/gpu-metrics]
    conditions: [normal, repeat, restart, failure]
    assertions:
      - Counter resets and stale samples cannot roll back a shared baseline.
      - Composite health survives service restart and avoids duplicate workflows.
      - Mixed GPU products are not silently accepted.
