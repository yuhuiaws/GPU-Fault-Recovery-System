      - Historical snapshots, missing activation or an incomplete signed start cannot become installation provenance.
      - The coordinator and actual key writer share the original activation deadline, and expired submissions or partial unknown writes cannot acquire completion proof.
      - Completed fencing cannot authorize resumed mutation after the exact installer wave is lost; only final unfence acknowledgement recovery may accept its restored baseline.
      - CPU capture and projection use the actual recognized renderer containers, not an ingress-only name.
